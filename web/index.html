<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>RetouchLab — 人像精修引擎</title>
<style>
  /* ============================================================
     设计令牌：像素蛋糕桌面版的视觉语言（纯黑 + 金色强调），
     图标用 Unicode 字符而非图片，全部原创。
     ============================================================ */
  :root {
    --bg: #0a0a0c;            /* 应用底色（近纯黑） */
    --panel: #121215;          /* 面板 */
    --panel2: #1a1b1f;         /* 面板内分区 */
    --panel3: #222328;         /* 控件底 */
    --line: #26272c;
    --text: #e8e9ec; --dim: #8a8c93;
    --gold: #e8b341;           /* 品牌金（强调/选中） */
    --gold2: #c9962e;
    --ok: #3fbf7f;
    --danger: #e05555;
    --topH: 52px; --railW: 64px; --sideW: 490px; --filmH: 96px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif;
    overflow: hidden; }

  /* ================= 桌面骨架 ================= */
  #app { display: flex; flex-direction: column; height: 100vh; }
  #main { flex: 1; display: flex; min-height: 0; }

  /* ---- 顶部工具条 ---- */
  #topbar { height: var(--topH); display: flex; align-items: center; gap: 6px;
    padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 700; letter-spacing: .3px; margin-right: 10px;
    font-size: 14px; }
  #topbar .title span { color: var(--gold); }
  .tgroup { display: flex; gap: 2px; align-items: center; padding: 0 10px;
    height: 30px; position: relative; }
  /* A visible divider between tool families. A 1px line on #121215 is nearly
     invisible; the raised block is what actually reads as a group boundary. */
  .tgroup + .tgroup::before {
    content: ""; position: absolute; left: 0; top: 3px; bottom: 3px;
    width: 1px; background: var(--line); }
  .tgroup + .tgroup { background: rgba(255,255,255,.018);
    border-radius: 6px; }
  .tbtn { background: transparent; border: none; color: var(--text);
    border-radius: 6px; padding: 6px 9px; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .tbtn:hover { background: var(--panel3); }
  .tbtn.active { background: rgba(232,179,65,.14); color: var(--gold); }
  .tbtn:disabled { opacity: .35; cursor: not-allowed; }
  .tbtn .ico { font-size: 14px; line-height: 1; }
  /* ---- 三模块切换 ---- */
  .modes { display: flex; gap: 2px; background: var(--panel3);
    border-radius: 6px; padding: 2px; margin-left: 4px; }
  .mode { background: transparent; border: none; color: var(--dim);
    font-size: 11px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
    white-space: nowrap; }
  .mode:hover { color: var(--text); }
  .mode.active { background: var(--panel); color: var(--gold); }
  .mode .new { font-size: 8px; color: #e8b341; vertical-align: super;
    margin-left: 1px; letter-spacing: .5px; }
  /* ---- 缩放 ---- */
  .zoomg { gap: 2px; }
  .zoomval { font-size: 10px; color: var(--dim); min-width: 32px;
    text-align: center; }
  #btnExport { background: var(--gold); color: #141005; border: none;
    font-weight: 700; padding: 7px 18px; border-radius: 6px; cursor: pointer;
    font-size: 13px; margin-left: auto; order: 9; }
  #btnExport:hover { background: #f2c55c; }
  #btnExport:disabled { opacity: .4; }
  /* meta sits before the export button so the primary action stays rightmost */
  #meta { color: var(--dim); font-size: 11px; text-align: right;
    margin-left: 10px; max-width: 260px; order: 8;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 右侧图标栏（与参考软件一致：预览 → 参数 → 图标导航）---- */
  #rail { width: var(--railW); background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column;
    align-items: center; padding: 4px 0; gap: 0; overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--panel3) transparent; }
  #rail::-webkit-scrollbar { width: 4px; }
  #rail::-webkit-scrollbar-thumb { background: var(--panel3);
    border-radius: 2px; }
  #rail::-webkit-scrollbar-track { background: transparent; }
  /* Compact, because the rail now carries 21 entries (预设 + 13 参数分组 +
     7 专用面板). At the previous padding the last ones needed a scroll to
     reach on a 1000px window; scrolling is still available as a fallback but
     everything fits at the sizes people actually use. */
  .rbtn { width: 52px; padding: 4px 0 3px; background: transparent; border: none;
    border-radius: 7px; color: var(--dim); cursor: pointer; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    flex: 0 0 auto; }
  .rbtn .ico { font-size: 16px; line-height: 1.15; }
  .rbtn .lbl { font-size: 9.5px; line-height: 1.2; }
  .rbtn:hover { background: var(--panel3); color: var(--text); }
  .rbtn.active { background: rgba(232,179,65,.14); color: var(--gold); }
  /* 分组标题：纯视觉分隔，不可点。让一屏列全的同时保留分类语义 */
  .catTitle { font-size: 9px; color: var(--dim); letter-spacing: .5px;
    padding: 6px 4px 2px; text-align: center; opacity: .7;
    border-top: 1px solid var(--line); margin-top: 4px; width: 52px;
    column-span: all; }
  /* 右侧栏双列：36 项单列要滚 1.8 屏（实测内容 1622px vs 可见 903px），
     两列后基本一屏放下，且仍是一次点击直达。 */
  #rail.cols2 { display: block; column-count: 2; column-gap: 0;
    width: 104px; flex: 0 0 104px; padding: 2px 2px 1px; }
  #rail.cols2 .rbtn { width: 50px; break-inside: avoid; padding: 0; }
  #rail.cols2 .rbtn .ico { font-size: 13px; line-height: 1.05; }
  #rail.cols2 .rbtn .lbl { font-size: 8.5px; line-height: 1.08; }
  #rail.cols2 .catTitle { width: 100px; break-inside: avoid;
    padding: 1px 4px 0; font-size: 8.5px; margin-top: 0; }
  #rail.cols2 .rsep { display: none; }
  .catNote { font-size: 9.5px; color: var(--dim); padding: 3px 6px;
    text-align: center; line-height: 1.3; }
  .rsep { width: 34px; height: 1px; background: var(--line); margin: 6px 0; }

  /* ---- 中央预览 ---- */
  /* ---- 左侧工具条（与参考软件同构：图标 + 文字标签）---- */
  #ltools { width: 68px; flex: 0 0 68px; background: var(--panel);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    align-items: center; padding: 6px 0; gap: 2px; overflow-y: auto;
    scrollbar-width: none; }
  #ltools::-webkit-scrollbar { display: none; }
  .ltGroup { display: flex; flex-direction: column; gap: 2px; }
  .ltSep { width: 34px; height: 1px; background: var(--line); margin: 4px 0;
    flex: 0 0 auto; }
  .ltBtn { position: relative; width: 58px; padding: 5px 0 4px;
    background: transparent; border: none; border-radius: 7px;
    color: var(--dim); cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 1px;
    flex: 0 0 auto; }
  .ltBtn .i { font-size: 15px; line-height: 1.15; }
  .ltBtn .l { font-size: 9.5px; line-height: 1.15; white-space: nowrap; }
  .ltBtn:hover { background: var(--panel3); color: var(--text); }
  .ltBtn.active { background: rgba(232,179,65,.14); color: var(--gold); }
  .ltBtn:disabled { opacity: .32; cursor: not-allowed; }

  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden;
    background: #060608; display: flex; align-items: center;
    justify-content: center; }
  #canvas { max-width: 100%; max-height: 100%; display: block;
    box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  #faceBox { position: absolute; border: 1.5px solid var(--ok); border-radius: 3px;
    display: none; }
  #faceBox::after { content: attr(data-label); position: absolute; top: -19px;
    left: -1px; background: var(--ok); color: #06120b; font-size: 10px;
    padding: 1px 5px; border-radius: 3px 3px 0 0; white-space: nowrap; }
  #dropzone { position: absolute; inset: 20px; border: 2px dashed var(--line);
    border-radius: 12px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 8px; color: var(--dim); cursor: pointer; }
  #dropzone.hot { border-color: var(--gold); color: var(--text);
    background: rgba(232,179,65,.05); }
  #dropzone .big { font-size: 44px; color: var(--gold); }
  #dropzone b { color: var(--text); font-size: 16px; }
  #busy { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,.78);
    padding: 5px 12px; border-radius: 6px; font-size: 12px; display: none;
    border: 1px solid var(--line); }

  /* 旧的 #film 条已被 #filmbox（选图条）取代，CSS 保留会误导下一次改动 */
  #filmbox { display: none; background: var(--panel);
    border-top: 1px solid var(--line); }
  #filmbox .fbTop { display: flex; align-items: center; gap: 14px;
    height: 34px; padding: 0 12px; font-size: 11px; color: var(--dim);
    border-bottom: 1px solid var(--line); }
  #filmbox .fbTop .grow { flex: 1; }
  #filmbox .fbTop button { background: transparent; border: none;
    color: var(--dim); font-size: 11px; cursor: pointer; padding: 3px 6px;
    border-radius: 4px; display: flex; align-items: center; gap: 4px; }
  #filmbox .fbTop button:hover { color: var(--gold); }
  #filmbox .fbTop button.on { color: var(--gold); }
  #filmbox .fbTop .star { color: var(--dim); cursor: pointer; font-size: 13px;
    padding: 0 1px; }
  #filmbox .fbTop .star.on { color: var(--gold); }
  #filmbox .fbTop .swatch { width: 11px; height: 11px; border-radius: 2px;
    cursor: pointer; }
  #filmbox .fbTop .curName { color: var(--text); }
  #filmbox .fbStrip { display: flex; gap: 3px; padding: 6px 10px;
    height: 74px; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin;
    scrollbar-color: var(--panel3) transparent; }
  #filmbox .fbStrip::-webkit-scrollbar { height: 5px; }
  #filmbox .fbStrip::-webkit-scrollbar-thumb { background: var(--panel3);
    border-radius: 2px; }
  #filmbox .shot { position: relative; flex: 0 0 auto; height: 60px;
    width: 90px; border: 2px solid transparent; border-radius: 4px;
    cursor: pointer; overflow: hidden; background: var(--panel3); }
  #filmbox .shot.active { border-color: var(--gold); }
  #filmbox .shot.rej { opacity: .35; }
  #filmbox .shot img { width: 100%; height: 100%; object-fit: cover;
    display: block; }
  #filmbox .shot .n { position: absolute; right: 2px; bottom: 2px;
    background: rgba(0,0,0,.75); color: #dfe3ea; font-size: 9px;
    padding: 0 3px; border-radius: 2px; }
  #filmbox .shot .raw { position: absolute; left: 2px; top: 2px;
    background: rgba(0,0,0,.75); color: var(--gold); font-size: 8px;
    padding: 0 3px; border-radius: 2px; letter-spacing: .5px; }
  #filmbox .shot .pk { position: absolute; left: 2px; bottom: 2px;
    color: var(--gold); font-size: 10px; }

  /* ---- 右侧参数区（双栏：导航说明 + 参数） ---- */
  #side { width: var(--sideW); background: var(--panel);
    border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  /* 参数面板内部再分两栏：左=预设缩略图条，右=参数。参考软件就是这个结构，
     好处是切预设时参数栏不重建，滚动位置得以保留。 */
  /* ---- 常驻直方图（参数区顶部）---- */
  #histBar { flex: 0 0 auto; padding: 6px 10px 4px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  #globalHist { width: 100%; height: 76px; display: block;
    background: #08080a; border-radius: 5px; }
  #histBar .histMeta { display: flex; align-items: center;
    font-size: 10px; color: var(--dim); padding-top: 3px; gap: 6px;
    white-space: nowrap; overflow: hidden; }
  #histBar .histMeta #histClip { color: #b9bec8; }

  #sideBody { flex: 1; display: flex; min-height: 0; }
  /* 右侧栏宽度：预设 108 + 参数自适应 + 历史 118。
     原来 128+282+150=560，加上双列图标栏 104 后预览只剩 723px（1800 视口
     下不到一半），照片区被挤得太窄。预设列只放 10px 小字缩略图、历史列
     只放步骤名，各自压掉 20~32px 不影响使用。 */
  #presetCol { width: 108px; flex: 0 0 108px; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden; }
  #presetCol .pcHead { padding: 6px 8px 4px; font-size: 11px;
    color: var(--dim); display: flex; gap: 6px; align-items: center; }
  #presetCol .pcList { flex: 1; overflow-y: auto; padding: 4px 6px 10px;
    display: flex; flex-direction: column; gap: 6px;
    scrollbar-width: thin; scrollbar-color: var(--panel3) transparent; }
  #presetCol .pcList::-webkit-scrollbar { width: 4px; }
  #presetCol .pcList::-webkit-scrollbar-thumb { background: var(--panel3);
    border-radius: 2px; }
  /* 历史记录列：常驻在最右，可折叠。窄屏（<1500）默认收起，
     因为预设+参数+历史三列一起会把照片挤得太窄。 */
  #histCol { width: 118px; flex: 0 0 118px; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden; }
  #histCol.collapsed { width: 26px; flex: 0 0 26px; }
  #histCol.collapsed .hcList { display: none; }
  #histCol.collapsed .pcHead span:first-child { display: none; }
  #histCol .hcList { flex: 1; overflow-y: auto; padding: 4px 4px 10px;
    display: flex; flex-direction: column; gap: 2px;
    scrollbar-width: thin; scrollbar-color: var(--panel3) transparent; }
  .pcMini { background: transparent; border: none; color: var(--dim);
    cursor: pointer; font-size: 11px; padding: 0 2px; }
  .pcMini:hover { color: var(--gold); }
  .hitem { display: flex; align-items: center; gap: 5px; padding: 3px 5px;
    border-radius: 4px; font-size: 10.5px; color: var(--dim); cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hitem:hover { background: var(--panel3); color: var(--text); }
  .hitem.cur { background: rgba(232,179,65,.15); color: var(--gold); }
  .hitem .n { flex: 0 0 auto; opacity: .6; font-variant-numeric: tabular-nums;
    width: 15px; text-align: right; }
  .hitem .t { overflow: hidden; text-overflow: ellipsis; }

  .pcard { border: 2px solid transparent; border-radius: 5px; cursor: pointer;
    overflow: hidden; background: var(--panel3); flex: 0 0 auto; }
  .pcard.active { border-color: var(--gold); }
  .pcard img { width: 100%; aspect-ratio: 3/4; object-fit: cover;
    display: block; }
  .pcard .pl { font-size: 10px; text-align: center; color: var(--dim);
    padding: 2px 0 3px; }
  .pcard.active .pl { color: var(--gold); }
  #paramCol { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #sideHead { padding: 10px 14px 8px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; }
  #sideHead .cat { font-size: 14px; font-weight: 700; }
  #sideHead .cat::before { content: ""; display: inline-block; width: 3px;
    height: 14px; background: var(--gold); border-radius: 2px;
    margin-right: 7px; vertical-align: -2px; }
  /* #sideBody 只在这一处定义（上方 209 行是双列 flex 布局）。
     这里原本还有一条 `#sideBody { overflow-y:auto; padding:10px 14px }`，
     它把 display:flex 覆盖掉，双列布局实际没生效——预设列与参数列是竖排
     堆叠的。滚动交给各列自己处理（每列各自 overflow-y:auto）。 */
  #log { border-top: 1px solid var(--line); padding: 7px 14px; font-size: 11px;
    color: var(--dim); max-height: 96px; overflow-y: auto;
    font-family: ui-monospace, Consolas, monospace; background: #0d0d10; }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- 控件 ---- */
  .presetRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { background: var(--panel3); color: var(--text); border: 1px solid var(--line);
    border-radius: 14px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .chip:hover { border-color: var(--gold); color: var(--gold); }
  /* Denser than the first pass: 13px between sliders with 4px label gaps left
     the panel mostly air, so a folding group of six controls ran past the fold
     while showing very little. The reference layout fits more than twice as
     many controls in the same column. */
  .sl { margin-bottom: 9px; }
  .sl .hdr { display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 3px; }
  .sl .name { font-size: 12px; color: var(--text); }
  .sl .val { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
    min-width: 30px; text-align: right; }
  .sl .val.mod { color: var(--gold); font-weight: 600; }
  .sl .reset { font-size: 10px; color: var(--dim); cursor: pointer;
    visibility: hidden; margin-right: 6px; }
  .sl .hdr:hover .reset { visibility: visible; }
  .sl .reset:hover { color: var(--gold); }
  input[type=range] { width: 100%; -webkit-appearance: none; appearance: none;
    height: 3px; border-radius: 2px; background: var(--panel3); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px;
    height: 13px; border-radius: 50%; background: var(--gold); cursor: pointer;
    border: 2px solid var(--bg); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px;
    border-radius: 50%; background: var(--gold); cursor: pointer;
    border: 2px solid var(--bg); }
  /* 白平衡轨道（截图里色温/色调是彩色渐变）：
     色温 蓝→暖，色调 绿→品红。渐变让"往哪边拖是变暖"不需要读数字。 */
  input[type=range].wb-temp { height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #4a7fd4, #d9d9d9 50%, #e0b354); }
  input[type=range].wb-tint { height: 5px; border-radius: 3px;
    background: linear-gradient(90deg, #5ede6a, #d9d9d9 50%, #d86bd0); }
  .groupTitle { margin: 16px 0 8px; font-size: 11px; color: var(--dim);
    font-weight: 600; letter-spacing: .8px; }
  .groupTitle::before { content: "▾ "; }

  /* 折叠分组（像素蛋糕的参数是分块折叠的） */
  .fold { border-bottom: 1px solid var(--line); padding: 0 0 4px;
    margin-bottom: 4px; }
  .fold > .foldHead { display: flex; justify-content: space-between;
    align-items: center; padding: 7px 0 5px; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--text); }
  .fold > .foldHead::after { content: "▾"; color: var(--dim); font-size: 11px;
    transition: transform .15s; }
  .fold.closed > .foldHead::after { transform: rotate(-90deg); }
  .fold.closed > .foldBody { display: none; }
  .fold .foldBody { padding: 2px 0 0; }
  .fold .badge { font-size: 9px; background: var(--gold); color: #141005;
    border-radius: 3px; padding: 0 4px; margin-left: 5px; font-weight: 700; }

  /* 配方面板 */
  .formula { border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; margin-bottom: 8px; background: var(--panel2); }
  .formula .fhdr { display: flex; justify-content: space-between;
    align-items: baseline; }
  .formula b { font-size: 13px; }
  .formula .fmeta { font-size: 10px; color: var(--dim); }
  .formula .fdesc { font-size: 11px; color: var(--dim); margin: 3px 0 7px; }
  .formula .slots { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 7px; }
  .formula .slots label { font-size: 11px; color: var(--dim);
    display: flex; flex-direction: column; gap: 2px; }
  .formula .slots input { width: 64px; background: var(--bg);
    border: 1px solid var(--line); color: var(--text); border-radius: 4px;
    padding: 3px 5px; font-size: 12px; }
  .goldbtn { background: var(--gold); color: #141005; border: none;
    border-radius: 6px; padding: 5px 16px; cursor: pointer; font-size: 12px;
    font-weight: 700; }
  .goldbtn:hover { background: #f2c55c; }

  /* 曲线编辑器 */
  #curveCanvas { width: 100%; height: 190px; background: #08080a;
    border: 1px solid var(--line); border-radius: 6px; cursor: crosshair;
    touch-action: none; display: block; }
  .curveMeta { display: flex; justify-content: space-between; font-size: 11px;
    color: var(--dim); margin: 4px 0 8px; }
  .chRow { display: flex; gap: 5px; margin-bottom: 10px; }
  .chBtn { flex: 1; padding: 6px 0; border-radius: 5px; cursor: pointer;
    background: var(--panel3); border: 1px solid var(--line); font-size: 11px;
    color: var(--text); }
  .chBtn.active { border-color: var(--gold); color: var(--gold);
    background: rgba(232,179,65,.12); }

  /* 批处理 */
  .batchRow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .batchRow input[type=text] { flex: 1; min-width: 0; background: var(--bg);
    border: 1px solid var(--line); color: var(--text); border-radius: 5px;
    padding: 5px 7px; font-size: 11px; }
  .prog { height: 6px; background: var(--panel3); border-radius: 3px;
    overflow: hidden; margin: 8px 0; }
  .prog > div { height: 100%; background: var(--gold); width: 0;

  .bstat { font-size: 11px; color: var(--dim); line-height: 1.7; }
  .bfail { color: var(--danger); }
  .bok { color: var(--ok); }

  /* 局部调整 */
  #localList { margin-bottom: 10px; }
  .locItem { display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; margin-bottom: 5px;
    background: var(--panel2); cursor: pointer; font-size: 12px; }
  .locItem.active { border-color: var(--gold); background: rgba(232,179,65,.10); }
  .locItem .nm { flex: 1; }
  .locItem .del { color: var(--dim); cursor: pointer; padding: 0 4px; }
  .locItem .del:hover { color: var(--danger); }
  #localHint { font-size: 11px; color: var(--dim); line-height: 1.7;
    margin: 6px 0 10px; }

  /* 配方编辑 */
  .stepRow { display: flex; align-items: center; gap: 5px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; margin-bottom: 5px;
    background: var(--panel2); font-size: 12px; cursor: pointer; }
  .stepRow.active { border-color: var(--gold); background: rgba(232,179,65,.10); }
  .stepRow .kind { font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: var(--panel3); color: var(--dim); }
  .stepRow .idx { color: var(--gold); width: 16px; font-weight: 700; }
  .stepRow .acts { display: flex; gap: 2px; margin-left: auto; }
  .stepRow .acts span { padding: 0 4px; color: var(--dim); cursor: pointer; }
  .stepRow .acts span:hover { color: var(--gold); }

  /* 挑图结果 */
  .cullGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;

  .cullThumb .sc { position: absolute; left: 2px; bottom: 2px;

  .cullThumb .flag { position: absolute; right: 2px; top: 2px;

  .cullThumb.pick { border-color: var(--gold); }
  .cullThumb.rej { border-color: var(--danger); opacity: .45; }

  /* 色轮面板 */
  .wheelRow { display: flex; gap: 6px; margin-bottom: 12px; }
  .wheelBtn { flex: 1; padding: 8px 0; border: 2px solid transparent;
    border-radius: 7px; color: #fff; font-size: 12px; font-weight: 600;

  .wheelBtn.active { opacity: 1; border-color: var(--gold); }

  /* 挑图/结果面板 */

    border-bottom: 1px solid var(--line); font-size: 12px; }
  .cullRow .sc { color: var(--gold); font-weight: 600;
    font-variant-numeric: tabular-nums; }

  /* ================= 移动端 ================= */
  #mbar { display: none; }
  @media (max-width: 860px) {
    :root { --topH: 46px; --filmH: 78px; }
    /* 顶栏收敛成 logo + 导出 */
    #topbar { gap: 4px; padding: 0 8px; overflow-x: auto; }
    #topbar .tgroup { display: none; }         /* 工具移入抽屉 */
    #topbar .title { margin-right: 4px; }
    #btnExport { margin-left: auto; padding: 6px 14px; }
    #meta { display: none; }
    #btnMenu { display: flex !important; }

    /* 左图标栏隐藏，改底部 tab */
    #rail { display: none; }
    /* 移动端不显示左侧工具条：390px 宽再切掉 68px 会让照片只剩一条缝，
       工具全部收进底部 tab 与画布上的浮动条 */
    #ltools { display: none; }
    #side { position: fixed; left: 0; right: 0; bottom: 0; top: auto;
      width: 100%; height: 58vh; border-left: none;
      border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
      /* starts closed: opening it by default left the photo with almost no
         room on a 390x844 screen, and the drawer is one tap away.

         Deliberately **no transition on transform**. With
         `transition: transform .22s` the panel could open and still sit
         entirely below the viewport: measured `transform: translateY(489px)`
         with `top: 844` (= viewport height) while the class was `open`, and
         the value snapped to `translateY(0)` the instant the running
         animation was force-finished. A drawer that is open but off-screen is
         worse than one that appears instantly, so the slide is dropped. */
      transform: translateY(100%);
      z-index: 40; }
    #side.open { transform: translateY(0); }
    /* The drawer is an overlay, so without this the canvas keeps centring in
       the full height and the photo sits behind the drawer with dead space
       above it — it looked like the image had been pushed off screen.

       Deliberately **no transition** on this property. An earlier version had
       `transition: margin-bottom .22s`, and the computed value could stay
       pinned at 0px forever: adding `drawer-open` while the drawer's own
       transform animation starts leaves the margin transition without a
       stable start value, so it never runs to completion. Measured
       `getComputedStyle` = 0px, then 489.52px the instant the animations were
       force-finished. The drawer already animates its transform (220 ms), so
       snapping the reserved space is both correct and visually right. */
    body.drawer-open #canvasWrap { margin-bottom: 58vh; }
    #sideHead { cursor: grab; }
    #sideHead .grip { display: block; width: 42px; height: 4px;
      background: var(--panel3); border-radius: 2px; margin: 0 auto 8px; }
    #filmbox { display: flex; flex-direction: column; }  /* 移动端显示选图条 */

    /* 底部 tab 栏：横向可滚动。
       19 个分类在 390px 宽下每个只有 20px，"存在感" 会折成两行并互相压住。
       固定每项宽度 + 横向滚动是手机上处理长分类列表的通行做法，也保证每个
       标签都能读到、都能点到。 */
    #mbar { display: flex; background: var(--panel);
      border-top: 1px solid var(--line); z-index: 45;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #mbar::-webkit-scrollbar { display: none; }
    #mbar button { flex: 0 0 auto; min-width: 58px; background: transparent;
      border: none; color: var(--dim); padding: 7px 6px 9px; font-size: 10px;
      cursor: pointer; white-space: nowrap;
      display: flex; flex-direction: column; align-items: center; gap: 2px; }
    #mbar button .ico { font-size: 18px; line-height: 1; }
    #mbar button.active { color: var(--gold); }
  }
  @media (min-width: 861px) {
    #btnMenu { display: none !important; }
    #sideHead .grip { display: none; }
  }

  #aboutCard { width: min(560px, calc(100vw - 32px)); max-height: 82vh;

  #aboutCard h2 { font-size: 16px; margin: 0 0 4px; color: var(--gold);

  #aboutCard .steps li { margin: 4px 0; color: var(--dim); }

    text-align: center; }
  @media (max-width: 860px) { #welcome { width: calc(100vw - 24px);
    left: 12px; bottom: 66px; } }
</style>

<script>
// ============================================================
// 状态
// ============================================================
const S = {
  session: null, faces: [], meta: null, params: {}, spec: [], groups: [],
  showBox: true, base: null, img: null, rendering: false, pending: false,
};

// 网络自适应：公网访问时降预览画质/尺寸，局域网或本机保持全画质。
// 实测公网隧道（frp2.ccszxc.xin:64649）预览一次约 1.6s，降一档后
// 明显更跟手；局域网 19ms 完全不需要降。
const NET = (function () {
  const h = (location.hostname || '').toLowerCase();
  const local = h === '' || h === 'localhost' || h === '127.0.0.1' ||
    /^192\.168\./.test(h) || /^10\./.test(h) ||
    /^172\.(1[6-9]|2\d|3[01])\./.test(h) || h === '[::1]';
  return {
    remote: !local,
    quality: local ? 88 : 80,      // 预览 JPEG 质量
    longEdge: local ? 0 : 1200,    // 0 = 不缩
  };
})();
const $ = (id) => document.getElementById(id);
const log = (msg) => {
  const el = $('log');
  const d = document.createElement('div');
  d.textContent = new Date().toTimeString().slice(0, 8) + '  ' + msg;
  el.prepend(d);
  while (el.children.length > 40) el.removeChild(el.lastChild);
};
const setBusy = (on) => { $('busy').style.display = on ? 'block' : 'none'; };

// The status line is derived from state, not written ad hoc. It used to be set
// only inside upload() and doRender(), so any path that made a session active
// without a render (restoring a session, a tool that commits server-side) left
// "未载入图片" on screen next to a photo that was plainly loaded.
function updateMeta(ms) {
  const el = $('meta');
  if (!el) return;
  if (!S.session || !S.meta) { el.textContent = '未载入图片'; return; }
  const m = S.meta;
  const parts = [m.width + '×' + m.height];
  if (m.decode && m.decode.raw) parts.push('RAW');
  if (S.faces && S.faces.length) parts.push(S.faces.length + ' 张脸');
  if (HIST.can_undo || HIST.can_redo) {
    parts.push('可撤销 ' + (HIST.steps.filter(s => !s.current).length || 1) + ' 步');
  }
  if (ms) parts.push(ms + ' ms');
  el.textContent = parts.join(' · ');
  el.title = parts.join(' · ');
}

// ============================================================
// 曲线 / 色阶
// ============================================================
// 每条曲线是一组 [x, y] 控制点（0..1）。对角两点 = 恒等。
const CURVE = {
  channel: 'rgb',
  points: { rgb: [[0, 0], [1, 1]], r: [[0, 0], [1, 1]],
            g: [[0, 0], [1, 1]], b: [[0, 0], [1, 1]] },
  levels: { master: [0, 1, 1, 0, 1], r: [0, 1, 1, 0, 1],
            g: [0, 1, 1, 0, 1], b: [0, 1, 1, 0, 1] },
  useLevels: false,
  drag: -1,
};
const CURVE_CH = [['rgb', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']];

function curveIsIdentity(pts) {
  return pts.length <= 2 && pts.every(p =>
    Math.abs(p[0] - p[1]) < 1e-6);
}

function renderCurves() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">曲线 / 色阶 · 点击添加控制点，拖动调整</div>';

  // 直方图不再画在这里：它是常驻的，在参数区顶部（#histBar）。
  // 一个界面里画两遍同样的直方图，除了浪费高度还会因为压缩算法不同而
  // 看起来"对不上"。

  // 通道切换是两个编辑器共用的，先渲染一次
  const chRow = document.createElement('div');
  chRow.className = 'chRow';
  CURVE_CH.forEach(([id, name]) => {
    const b = document.createElement('button');
    b.className = 'chBtn' + (CURVE.channel === id ? ' active' : '');
    b.textContent = name;
    if (id === 'rgb') b.style.fontWeight = '700';
    else b.style.color = { r: '#ff6b6b', g: '#5ede6a', b: '#6b8cff' }[id];
    b.onclick = () => {
      CURVE.channel = id;
      LEV.channel = id;
      renderCurves();
    };
    chRow.appendChild(b);
  });

function drawCurve() {
  const c = $('curveCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height, pad = 26;
  const X = v => pad + v * (w - pad * 2);
  const Y = v => h - pad - v * (h - pad * 2);

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#08080a';
  ctx.fillRect(0, 0, w, h);

  // 直方图作背景（截图里的曲线后面就是它），对数压缩
  if (MASK.hist) {
    const arr = MASK.hist[CURVE.channel === 'rgb' ? 'lum' : CURVE.channel]
      || MASK.hist.lum;
    if (arr) {
      const bins = arr.length;
      const peak = Math.max(1, ...arr);
      ctx.beginPath();
      ctx.moveTo(X(0), Y(0));
      for (let i = 0; i < bins; i++) {
        const t = i / (bins - 1);
        const val = Math.log1p(arr[i]) / Math.log1p(peak);
        ctx.lineTo(X(t), Y(val));
      }
      ctx.lineTo(X(1), Y(0));
      ctx.closePath();
      ctx.fillStyle = 'rgba(150,155,165,.35)';
      ctx.fill();
    }
  }

  // 网格
  ctx.strokeStyle = '#1e2026';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    ctx.beginPath(); ctx.moveTo(X(t), Y(0)); ctx.lineTo(X(t), Y(1)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0), Y(t)); ctx.lineTo(X(1), Y(t)); ctx.stroke();
  }
  // 对角参考线
  ctx.strokeStyle = '#2c2f36';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(1), Y(1)); ctx.stroke();
  ctx.setLineDash([]);

  const pts = CURVE.points[CURVE.channel];
  const col = { rgb: '#e8b341', r: '#ff6b6b', g: '#5ede6a', b: '#6b8cff' }[CURVE.channel];

  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.beginPath();
  const N = 128;
  const sorted = pts.slice().sort((a, b) => a[0] - b[0]);
  for (let i = 0; i <= N; i++) {
    const x = i / N;
    const y = interpCurve(sorted, x);
    if (i === 0) ctx.moveTo(X(x), Y(y)); else ctx.lineTo(X(x), Y(y));
  }
  ctx.stroke();

  // 阴影/中间调/高光 标签（截图里的三个区段名）
  ctx.fillStyle = 'rgba(160,165,175,.75)';
  ctx.font = '12px -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif';
  ctx.fillText('阴影', X(0.06), Y(0) - 6);
  const midW = ctx.measureText('中间调').width;
  ctx.fillText('中间调', X(0.5) - midW / 2, Y(0) - 6);
  const hiW = ctx.measureText('高光').width;
  ctx.fillText('高光', X(1) - hiW, Y(0) - 6);

  sorted.forEach(p => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0a0a0c'; ctx.lineWidth = 2; ctx.stroke();
  });
}

function interpCurve(sorted, x) {
  if (x <= sorted[0][0]) return sorted[0][1];
  if (x >= sorted[sorted.length - 1][0]) return sorted[sorted.length - 1][1];
  for (let i = 0; i < sorted.length - 1; i++) {
    const [x0, y0] = sorted[i], [x1, y1] = sorted[i + 1];
    if (x >= x0 && x <= x1) {
      const t = (x - x0) / Math.max(x1 - x0, 1e-6);
      return y0 + (y1 - y0) * t;
    }
  }
  return x;
}

function bindCurve() {
  const c = $('curveCanvas');
  if (!c) return;
  const pad = 26;
  const toVal = ev => {
    const r = c.getBoundingClientRect();
    const px = (ev.clientX - r.left) * (c.width / r.width);
    const py = (ev.clientY - r.top) * (c.height / r.height);
    return [
      Math.min(1, Math.max(0, (px - pad) / (c.width - pad * 2))),
      Math.min(1, Math.max(0, 1 - (py - pad) / (c.height - pad * 2))),
    ];
  };
  const pts = () => CURVE.points[CURVE.channel];
  const nearest = (x, y) => {
    let best = -1, bd = 0.06;
    pts().forEach((p, i) => {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  };

  const down = ev => {
    ev.preventDefault();
    const [x, y] = toVal(ev);
    const i = nearest(x, y);
    if (i >= 0) { CURVE.drag = i; return; }
    pts().push([x, y]);
    CURVE.points[CURVE.channel] =
      pts().sort((a, b) => a[0] - b[0]);
    CURVE.drag = nearest(x, y);
    drawCurve(); updateCurveInfo();
  };
  const move = ev => {
    if (CURVE.drag < 0) return;
    ev.preventDefault();
    const [x, y] = toVal(ev);
    const arr = pts();
    // 端点只允许纵向移动：横向移动会把映射范围弄丢
    const isEnd = CURVE.drag === 0 || CURVE.drag === arr.length - 1;
    arr[CURVE.drag] = [isEnd ? arr[CURVE.drag][0] : x, y];
    drawCurve(); updateCurveInfo();
  };
  const up = () => { CURVE.drag = -1; };
  const dbl = ev => {
    ev.preventDefault();
    const [x, y] = toVal(ev);
    const i = nearest(x, y);
    const arr = pts();
    if (i > 0 && i < arr.length - 1) {
      arr.splice(i, 1);
      drawCurve(); updateCurveInfo();
    }
  };
  c.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  c.addEventListener('dblclick', dbl);
  c.addEventListener('touchstart', e => down(e.touches[0]), { passive: false });
  c.addEventListener('touchmove', e => move(e.touches[0]), { passive: false });
  c.addEventListener('touchend', up);
}

function updateCurveInfo() {
  const el = $('curveInfo'), pc = $('curvePts');
  if (!el) return;
  const pts = CURVE.points[CURVE.channel];
  el.textContent = curveIsIdentity(pts)
    ? (CURVE.useLevels ? '色阶生效中' : '恒等')
    : '已修改';
  if (pc) pc.textContent = pts.length + ' 点';
}

async function applyCurves() {
  if (!S.session) { log('先载入图片'); return; }
  // 只提交真正改过的通道；恒等曲线/色阶不覆盖服务端状态
  const payload = { curves: {}, levels: {} };
  let any = false;
  CURVE_CH.forEach(([id]) => {
    if (!curveIsIdentity(CURVE.points[id])) {
      payload.curves[id] = CURVE.points[id];
      any = true;
    }
  });
  const lv = LEV.values || {};
  CURVE_CH.forEach(([id]) => {
    const spec = lv[id] || [0, 1, 1, 0, 1];
    if (Math.abs(spec[0]) > 1e-6 || Math.abs(spec[1] - 1) > 1e-6 ||
        Math.abs(spec[2] - 1) > 1e-6 || Math.abs(spec[3]) > 1e-6 ||
        Math.abs(spec[4] - 1) > 1e-6) {
      payload.levels[id] = spec;
      any = true;
    }
  });
  if (!any) { log('曲线与色阶都是恒等，无需应用'); return; }
  if (!Object.keys(payload.curves).length) delete payload.curves;
  if (!Object.keys(payload.levels).length) delete payload.levels;

  setBusy(true);
  try {
    const r = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, params: payload, quality: 92 }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    S.base = 'data:image/jpeg;base64,' + j.image;
    matteImg = null;
    await drawBase();
    log('曲线/色阶已应用：' + (j.applied || []).join(', ') + ' · ' + j.ms + ' ms');
  } catch (e) { log('应用失败：' + e.message); }
  finally { setBusy(false); }
}

async function startBatch() {
  const out = $('bOut').value.trim();
  if (!out) { log('请填写输出目录'); return; }
  if (!BATCH.preset) { log('请选择一个预设'); return; }
  // 图库选中集优先；否则用源目录
  const sel = (BATCH.paths && BATCH.paths.length) ? BATCH.paths : null;
  const src = $('bSrc').value.trim();
  if (!sel && !src) { log('请填写源目录（或先在图库勾选文件）'); return; }
  localStorage.setItem('rl_batch_out', out);
  if (src) localStorage.setItem('rl_batch_src', src);
  setBusy(true);
  try {
    const body = { out_dir: out, preset: BATCH.preset,
                   long_edge: BATCH.mode === 'draft' ? 1280 : 0 };
    if (sel) {
      body.paths = sel;
      body.path = null;
    } else {
      body.path = src;
    }
    const r = await fetch('/api/batch', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    BATCH.id = j.id;
    log('批处理开始：' + j.total + ' 个文件 · ' + j.recipe +
        (sel ? '（图库选中集）' : ''));
    $('bProg').style.display = 'block';
    $('bCancel').style.display = 'inline-block';
    pollBatch();
  } catch (e) { log('批处理启动失败：' + e.message); }
  finally { setBusy(false); }
}

async function cancelBatch() {
  if (!BATCH.id) return;
  try { await fetch('/api/batch/' + BATCH.id + '/cancel', { method: 'POST' }); }
  catch (e) { /* 轮询会发现终态 */ }
}

function pollBatch() {
  if (BATCH.timer) clearTimeout(BATCH.timer);
  BATCH.timer = setTimeout(async () => {
    if (!BATCH.id) return;
    try {
      const st = await fetch('/api/batch/' + BATCH.id).then(r => r.json());
      const pct = st.total ? Math.round(st.done / st.total * 100) : 0;
      const bar = $('bProg');
      if (bar) bar.firstChild.style.width = pct + '%';
      const el = $('bStat');
      if (el) {
        el.innerHTML = st.state === 'running' || st.state === 'queued'
          ? (st.state === 'queued' ? '排队中（另一个批处理在跑）' : '处理中') +
            ' · ' + st.done + '/' + st.total +
            (st.current ? '<br>当前：' + st.current : '') +
            (st.eta != null ? '<br>预计剩余 ' + st.eta + ' 秒' : '')
          : '<span class="' + (st.failed ? 'bfail' : 'bok') + '">' +
            (st.state === 'cancelled' ? '已取消' : '完成') + '</span>' +
            ' · 成功 ' + (st.done - st.failed) + ' / 失败 ' + st.failed +
            '<br>耗时 ' + st.elapsed + ' 秒<br>输出：' + st.out_dir;
      }
      const list = $('bList');
      if (list && st.results && st.results.length) {
        list.innerHTML = st.results.slice(-8).map(e =>
          e.ok ? '<span class="bok">✓ ' + e.name + '</span>'
               : '<span class="bfail">✗ ' + e.name + ' — ' +
                 (e.error || '') + '</span>').join('<br>');
      }
      if (st.state === 'running' || st.state === 'queued') {
        pollBatch();
      } else {
        BATCH.id = null;
        if ($('bCancel')) $('bCancel').style.display = 'none';
        log('批处理结束：成功 ' + (st.done - st.failed) + '，失败 ' + st.failed);
      }
    } catch (e) { log('批处理轮询失败：' + e.message); }
  }, 1200);
}

// 常驻历史列：列出每一步，当前步高亮，点任意一步跳回去。
// 参考软件把历史与预设并排放在同一屏——"刚才那步调好了/调坏了"是修图里
// 最频繁的判断，藏进分类面板等于没有。
function renderHistCol() {
  const box = $('hcList');
  if (!box) return;
  const steps = HIST.steps || [];
  if (!steps.length) {
    box.innerHTML = '<div class="bstat" style="padding:6px 4px">无历史</div>';
    return;
  }
  // 当前位置由每步的 `current` 标记，不是顶层 index —— `/api/history` 只
  // 返回 can_undo/can_redo/label/steps/depth。早先按顶层 index 渲染，
  // 永远取不到值：高亮总落在最后一步，点历史也判定错。
  let idx = -1;
  for (let k = 0; k < steps.length; k++) {
    if (steps[k] && steps[k].current) { idx = k; break; }
  }
  if (idx < 0) idx = steps.length - 1;
  // 最新的排最上面（和参考软件一致），序号用每步自带的 index
  const rows = [];
  for (let i = steps.length - 1; i >= 0; i--) {
    const st = steps[i];
    const label = (typeof st === 'string') ? st : (st.label || ('步骤 ' + (i + 1)));
    const real = (typeof st === 'object' && st && typeof st.index === 'number')
      ? st.index : i;
    rows.push('<div class="hitem' + (i === idx ? ' cur' : '') +
      '" data-i="' + real + '"><span class="n">' + (real + 1) + '</span>' +
      '<span class="t" title="' + escapeHtml(label) + '">' +
      escapeHtml(label) + '</span></div>');
  }
  box.innerHTML = rows.join('');
  box.querySelectorAll('.hitem').forEach(function (el) {
    el.onclick = function () { gotoHistory(parseInt(el.dataset.i, 10)); };
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function gotoHistory(i) {
  if (!S.session) return;
  setBusy(true);
  try {
    const r = await fetch('/api/history/' + encodeURIComponent(S.session) +
                          '/goto', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: i }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    if (j.image) S.base = 'data:image/jpeg;base64,' + j.image;
    await refreshHistory();
    await drawBase();
    log('已回到第 ' + (i + 1) + ' 步');
  } catch (e) { log('跳转历史失败：' + e.message); }
  finally { setBusy(false); }
}

function updateHistButtons() {

  if (!u || !r) return;
  u.disabled = !S.session || !HIST.can_undo;
  r.disabled = !S.session || !HIST.can_redo;
  u.title = HIST.can_undo ? ('撤销：' + HIST.label + ' → 上一步') : '没有可撤销的操作';
  r.title = HIST.can_redo ? '重做' : '没有可重做的操作';
}

async function doUndo() { await stepHistory('undo'); }
async function doRedo() { await stepHistory('redo'); }

async function stepHistory(which) {
  if (!S.session) return;
  if (which === 'undo' && !HIST.can_undo) return;
  if (which === 'redo' && !HIST.can_redo) return;
  setBusy(true);
  try {
    const r = await fetch('/api/' + which, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    S.base = 'data:image/jpeg;base64,' + j.image;
    matteImg = null; eraseCanvas = null;
    await drawBase();
    Object.assign(HIST, j);
    updateHistButtons();
    log((which === 'undo' ? '已撤销，回到：' : '已重做，回到：') + j.restored);
  } catch (e) { log(which + ' 失败：' + e.message); }
  finally { setBusy(false); }
}

function bindLeftTools() {
  const b = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };

  b('ltZoom', () => { ZOOM.mode = 'fit'; applyZoom(); });
  b('ltFit', () => { ZOOM.mode = 'fit'; applyZoom(); });

  // 抓手：切换画布拖动
  b('ltPan', () => {

    S.pan = on;
    $('ltPan').classList.toggle('active', on);
    $('canvasWrap').style.cursor = on ? 'grab' : '';
    log(on ? '抓手：开（拖动查看）' : '抓手：关');
  });

  b('ltDefringe', () => { setMode('retouch'); selectCat('祛边'); });
  b('ltGuide', () => { toggleGuides(); });
  b('ltLiquify', () => { setMode('retouch'); selectCat('美型'); });
  b('ltSpot', () => { setBrush('heal'); });
  b('ltPatch', () => { setBrush('heal'); });
  b('ltStamp', () => { setBrush('clone'); });
  b('ltErase', () => { setBrush('erase'); });
  b('ltAiRetouch', () => {
    setMode('retouch');
    selectCat('五官');
  });

  // 高亮：笔刷类工具与工具栏状态同步。
  // 模式名必须与 setBrush 实际接受的值一致——图章的模式是 `'clone'`，
  // 不是 HTML 上的 data-tool="stamp"；写成 'stamp' 永远不会高亮。
  const syncTool = () => {
    let cur = null;
    try {
      // BRUSH 用 const 声明且在文件靠后处，这里首次运行时它可能还在 TDZ
      // 里；用 try 兜住，否则初始化阶段抛错会把后续绑定一起打断。
      cur = (typeof BRUSH !== 'undefined' && BRUSH) ? BRUSH.mode : null;
    } catch (e) { cur = null; }
    [['ltSpot', 'heal'], ['ltPatch', 'heal'], ['ltStamp', 'clone'],
     ['ltErase', 'erase']].forEach(function (pair) {
      const e = $(pair[0]);
      if (e) e.classList.toggle('active', !!cur && cur === pair[1]);
    });
  };
  window.__syncLeftTools = syncTool;
  syncTool();
}

const MODES = {

                     '色彩编辑器', '配方'] },

  if (mode === 'library') libLoadSources();

// ---- 缩放 ----
// 只改变画布的显示尺寸，不改图片数据。预览、编辑、导出看到的必须是同一个
// 几何，否则人脸框、局部蒙版的手柄位置会和实际渲染错开。
const ZOOM = { level: 0, mode: 'fit', MIN: 0.1, MAX: 4.0 };

function applyZoom() {
  const cv = $('canvas');
  if (!cv || !S.meta) return;
  const wrap = $('canvasWrap');
  const availW = wrap.clientWidth - 32;
  const availH = wrap.clientHeight - 32;
  const pw = S.meta.preview_width || S.meta.width || 1;
  const ph = S.meta.preview_height || S.meta.height || 1;
  let scale;
  if (ZOOM.mode === 'fit') {
    scale = Math.min(availW / pw, availH / ph, 1);
  } else {
    scale = ZOOM.level;
  }
  scale = Math.max(ZOOM.MIN, Math.min(ZOOM.MAX, scale));
  ZOOM.level = scale;
  cv.width = Math.round(pw * scale);
  cv.height = Math.round(ph * scale);
  cv.style.width = cv.width + 'px';
  cv.style.height = cv.height + 'px';
  const zl = $('zoomVal');
  if (zl) {
    zl.textContent = ZOOM.mode === 'fit'
      ? '适合' : Math.round(scale * 100) + '%';
  }
  // 画布尺寸变了，画面上叠加的东西必须重算，否则手柄会飘
  if (typeof drawBase === 'function' && S.base) drawBase();
}

function zoomBy(factor) {
  ZOOM.mode = 'manual';
  ZOOM.level = Math.max(ZOOM.MIN, Math.min(ZOOM.MAX, ZOOM.level * factor));
  applyZoom();
}

function bindZoom() {
  const b = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  b('btnZoomOut', () => zoomBy(1 / 1.25));
  b('btnZoomIn', () => zoomBy(1.25));
  b('btnZoomFit', () => { ZOOM.mode = 'fit'; applyZoom(); });
  b('btnZoom100', () => { ZOOM.mode = 'manual'; ZOOM.level = 1; applyZoom(); });
  document.querySelectorAll('.mode').forEach(el => {
    el.onclick = () => setMode(el.dataset.mode);
  });
  window.addEventListener('resize', () => {
    if (ZOOM.mode === 'fit') applyZoom();
  });
  // Ctrl + 滚轮缩放
  $('canvasWrap').addEventListener('wheel', ev => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    zoomBy(ev.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });
}

// `CAT_TREE` 由 /api/cats 提供（父子关系仍保留，只是不再做折叠）。
let CAT_TREE = null;
// 宽屏右侧栏用双列：36 项单列要滚约 1.8 屏（实测内容 1622px vs 可见
// 903px），两列后能压进一屏，而且仍然是一次点击直达。
function railColumns() {
  const rail = $('rail');
  if (!rail) return;
  rail.classList.toggle('cols2', window.innerWidth >= 1400);

const CAT_ICONS = {
  AI色彩: '✦', 调色: '◐', 局部: '◎', 人像: '☺', 图像: '▦', 衣物: '⬒',
  宠物: '❋', 后调色: '◔', 裁剪: '✂', 历史: '⏱', 联机: '⌾', 自定义: '❖',
};

async function loadCatTree() {
  try {
    const j = await fetch('/api/cats').then(r => r.json());
    CAT_TREE = j.tree || {};
  } catch (e) { CAT_TREE = null; }
}

function buildCats() {
  const rail = $('rail'), mbar = $('mbar');
  rail.innerHTML = ''; mbar.innerHTML = '';
  const mk = (parent, ico, lbl, key, isActive, mobile) => {
    const b = document.createElement('button');
    if (mobile) {
      b.innerHTML = '<span class="ico">' + ico + '</span>' + lbl;
    } else {
      b.className = 'rbtn' + (isActive ? ' active' : '');
      b.innerHTML = '<span class="ico">' + ico + '</span><span class="lbl">' +
        lbl + '</span>';
    }
    b.dataset.cat = key;
    if (isActive) b.classList.add('active');
    b.onclick = () => selectCat(key);
    parent.appendChild(b);
    return b;
  };

  // 单层导航：**一次点击直达**。
  // 之前做过两级（父类→子项），实际操作要先判断"这个功能属于哪个父类"
  // 再点两次，比原来的平铺更累。现在回到一屏列全，但用**分组标题**做
  // 视觉分隔（标题不可点），既保留分类语义，又不用多想。
  if (CAT_TREE) {
    const allowed = MODES[CURRENT_MODE] ? MODES[CURRENT_MODE].cats : null;
    const allow = (key) => !allowed || allowed.indexOf(key) >= 0;
    const mkTitle = (txt) => {
      const d = document.createElement('div');
      d.className = 'catTitle';
      d.textContent = txt;
      rail.appendChild(d);
    };

    // 预设置顶（最常用）
    mk(rail, '◈', '预设', '预设', false, false);
    mk(mbar, '◈', '预设', '预设', false, true);

    Object.keys(CAT_TREE).forEach(p => {
      const kids = (CAT_TREE[p] || []).filter(allow);
      if (!kids.length) return;      // 空分组（宠物）直接不占位置
      mkTitle(p);
      kids.forEach(k => {
        const ico = GROUP_ICONS[k] || SPECIAL_ICONS[k] || '·';
        mk(rail, ico, k, k, false, false);
        mk(mbar, ico, k, k, false, true);
      });
    });
    railColumns();
    return;
  }

  // 回退：无树数据时保持原来的平铺（保证功能不因接口失败而不可用）
  mk(rail, '◈', '预设', '预设', true, false);
  mk(mbar, '◈', '预设', '预设', true, true);
  const allowed2 = MODES[CURRENT_MODE] ? MODES[CURRENT_MODE].cats : null;
  const allow2 = (key) => !allowed2 || allowed2.indexOf(key) >= 0;
  S.groups.forEach((g) => {
    if (!allow2(g)) return;
    const ico = GROUP_ICONS[g] || '◐';
    mk(rail, ico, g, g, false, false);
    mk(mbar, ico, g, g, false, true);
  });
  const sep = document.createElement('div');
  sep.className = 'rsep';
  rail.appendChild(sep);
  SPECIAL.forEach(([ico, lbl, key]) => {
    if (!allow2(key)) return;
    mk(rail, ico, lbl, key, false, false);
    mk(mbar, ico, lbl, key, false, true);
  });
}

    '<button class="chip levCh" data-c="' + i + '"' +
    (LEV.channel === i ? ' style="border-color:var(--gold)"' : '') +
    '>' + c + '</button>').join('');
  wrap.insertBefore(row, wrap.children[1]);
  row.querySelectorAll('.levCh').forEach(b => {
    b.onclick = () => {
      LEV.channel = parseInt(b.dataset.c, 10);
      row.querySelectorAll('.levCh').forEach(x =>
        x.style.borderColor = '');

  apply.className = 'presetRow';

  wrap.appendChild(apply);
  $('levApply').onclick = async () => {
    if (!S.session) { log('先载入图片'); return; }
    setBusy(true);
    try {
      const spec = {};
      ['master', 'r', 'g', 'b'].forEach((k, i) => {
        const v = LEV.values[i];
        if (v && (v[0] !== 0 || v[1] !== 1 || v[2] !== 1 ||
                  v[3] !== 0 || v[4] !== 1)) {
          spec[k] = v;
        }
      });
      const r = await fetch('/api/render', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: S.session, params: {},
                               levels: spec, commit: true }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      log('色阶已应用');
      await refreshHistory();
    } catch (e) { log('色阶失败：' + e.message); }
    finally { setBusy(false); }

  const wrap = $('sliders'); wrap.innerHTML = '';
  const items = S.spec.filter(s => s.group === group);
  if (!items.length) {
    wrap.innerHTML = '<div style="color:var(--dim);font-size:12px;padding:20px 0">该分类暂无控件</div>';
    return;
  }
  const buckets = [];
  const used = new Set();
  FOLD_RULES.forEach(rule => {
    const inGroup = items.filter(s => !used.has(s.key) && (
      rule.keys ? rule.keys.includes(s.key)
                : rule.prefix ? s.key.startsWith(rule.prefix) : false));
    if (inGroup.length) {
      inGroup.forEach(s => used.add(s.key));
      buckets.push({ title: rule.title, specs: inGroup });
    }
  });
  const rest = items.filter(s => !used.has(s.key));
  if (rest.length) buckets.push({ title: null, specs: rest });

  buckets.forEach(b => {
    if (b.title) {
      const fold = document.createElement('div');
      fold.className = 'fold';
      const head = document.createElement('div');
      head.className = 'foldHead';
      head.innerHTML = '<span>' + b.title + '</span>';
      head.onclick = () => fold.classList.toggle('closed');
      const body = document.createElement('div');
      body.className = 'foldBody';
      b.specs.forEach(s => body.appendChild(sliderEl(s)));
      fold.appendChild(head); fold.appendChild(body);
      wrap.appendChild(fold);
    } else {
      b.specs.forEach(s => wrap.appendChild(sliderEl(s)));
    }
  });
}

// 曝光用摄影师熟悉的 EV 单位显示（PS/ACR/像素蛋糕同）：滑杆内部仍是
// -100..100，显示与输入一律 ×0.05 -> -5.00..+5.00 EV，步进 0.05 对应
// 内部 1。以后再有别的单位换算参数（如色温开尔文）也走这张表。
const UNIT_SCALE = {
  exposure: { scale: 0.05, step: 0.05, digits: 2, suffix: ' EV' },
};

function dispVal(key, v) {
  const u = UNIT_SCALE[key];
  if (!u) return v;
  return v * u.scale;
}
function fromDisp(key, disp) {
  const u = UNIT_SCALE[key];
  if (!u) return disp;
  return disp / u.scale;
}
function dispFmt(key, v) {
  const u = UNIT_SCALE[key];
  if (!u) {
    const isBool = false;   // 由调用方决定
    return Math.round(v);
  }
  return Number(v).toFixed(u.digits) + (u.suffix || '');
}
function dispStep(key) {
  const u = UNIT_SCALE[key];
  return u ? u.step : 1;
}

function sliderEl(s) {
  const d = document.createElement('div');
  d.className = 'sl';
  const isBool = (s.min === 0 && s.max === 1);
  const hasUnit = !!UNIT_SCALE[s.key];
  const step = hasUnit ? UNIT_SCALE[s.key].step
    : (isBool ? 1 : ((s.max - s.min) <= 10 ? 0.05 : 1));
  const dmin = dispVal(s.key, s.min), dmax = dispVal(s.key, s.max);
  d.innerHTML =
    '<div class="hdr"><span class="name">' + s.label +
    (s.hint ? ' <span title="' + s.hint + '" style="color:var(--dim)">ⓘ</span>' : '') +
    '</span><span><span class="reset" data-k="' + s.key + '">重置</span>' +
    '<span class="val" id="v_' + s.key + '">' +
    (hasUnit ? dispFmt(s.key, dispVal(s.key, S.params[s.key]))
             : fmt(S.params[s.key], step)) +
    '</span></span></div>' +
    '<input type="range" id="r_' + s.key + '" min="' + dmin + '" max="' + dmax +
    '" step="' + step + '" value="' + dispVal(s.key, S.params[s.key]) + '" />';
  const inp = d.querySelector('input');
  inp.addEventListener('input', () => {
    // 显示值 -> 内部值（曝光 EV -> -100..100）
    S.params[s.key] = hasUnit ? fromDisp(s.key, parseFloat(inp.value))
                              : parseFloat(inp.value);
    updateVal(s.key, S.params[s.key]);
    requestRender();
  });
  d.querySelector('.reset').onclick = () => {
    S.params[s.key] = s.default;
    inp.value = dispVal(s.key, s.default);
    updateVal(s.key, s.default);
    requestRender();
  };
  return d;
}

function fmt(v, step) { return step < 1 ? Number(v).toFixed(2) : Math.round(v); }
function updateVal(key, v) {
  const el = $('v_' + key); if (!el) return;
  const spec = S.spec.find(x => x.key === key);
  if (UNIT_SCALE[key]) {
    el.textContent = dispFmt(key, dispVal(key, v));
  } else {
    const step = (spec && (spec.max - spec.min) <= 10) ? 0.05 : 1;
    el.textContent = fmt(v, step);
  }
  el.classList.toggle('mod', spec && Math.abs(v - spec.default) > 1e-9);
}

let FORMULAS = [], FORMULA_LIB = {};
async function renderFormulas() {
  if (FEDIT.open) { renderFormulaEditor(); return; }
  const wrap = $('sliders');
  if (!FORMULAS.length) {
    try {
      const j = await fetch('/api/formulas').then(r => r.json());
      FORMULAS = j.formulas; FORMULA_LIB = j.library;
    } catch (e) {
      wrap.innerHTML = '<div style="color:var(--danger);padding:16px 0">配方加载失败</div>';
      return;
    }
  }
  wrap.innerHTML = '<div class="groupTitle">配方 · 点击运行</div>';
  const bar = document.createElement('div');
  bar.className = 'presetRow';
  bar.innerHTML = '<button class="chip" id="fNew">＋ 新建配方</button>';
  wrap.appendChild(bar);
  $('fNew').onclick = () => { newFormula(); renderFormulaEditor(); };

  FORMULAS.forEach(f => {
    const d = document.createElement('div');
    d.className = 'formula';
    const slots = collectSlots(FORMULA_LIB[f.name]);
    let slotHtml = '';
    if (slots.length) {
      slotHtml = '<div class="slots">' + slots.map(s =>
        '<label>' + s + '<input type="number" class="slotIn" data-f="' + f.name +
        '" data-s="' + s + '" value="70" /></label>').join('') + '</div>';
    }
    // builtins are rejected by the server with a clear message rather than
    // hidden here, so the UI does not need its own copy of that list
    d.innerHTML =
      '<div class="fhdr"><b>' + f.name + '</b><span class="fmeta">' + f.steps +
      ' 步</span></div><div class="fdesc">' + (f.description || '') + '</div>' +
      slotHtml + '<div class="presetRow">' +
      '<button class="goldbtn" data-f="' + f.name + '">运行</button>' +
      '<button class="chip" data-edit="' + f.name + '">编辑</button>' +
      '<button class="chip" data-del="' + f.name + '">删除</button>' +
      '</div>';
    wrap.appendChild(d);
  });
  wrap.querySelectorAll('button.goldbtn').forEach(b => {
    b.onclick = () => runFormula(b.dataset.f, wrap);
  });
  wrap.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => {
      if (formulaToEditor(b.dataset.edit)) renderFormulaEditor();
      else log('配方数据未加载，稍后重试');
    };
  });
  wrap.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => deleteFormula(b.dataset.del);
  });
}
function collectSlots(formula) {
  const out = new Set();
  const walk = (o) => {
    if (typeof o === 'string') {
      const m = o.match(/\{\{\s*(\w+)\s*\}\}/);
      if (m) out.add(m[1]);
    } else if (o && typeof o === 'object') Object.values(o).forEach(walk);
  };
  ((formula && formula.steps) || []).forEach(walk);
  return Array.from(out);
}
async function runFormula(name, wrap) {
  if (!S.session) { log('先载入图片'); return; }
  const slots = {};
  wrap.querySelectorAll('.slotIn[data-f="' + name + '"]').forEach(inp => {
    slots[inp.dataset.s] = parseFloat(inp.value) || 0;
  });
  setBusy(true);
  try {
    const j = await fetch('/api/formulas/run', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, session: S.session, slots: slots })
    }).then(r => r.json());
    if (j.detail) throw new Error(j.detail);
    S.base = 'data:image/jpeg;base64,' + j.image;
    matteImg = null; eraseCanvas = null;
    await drawBase();
    log('配方 ' + name + ' 完成：' + j.applied.join(' → '));
  } catch (e) { log('配方失败：' + e.message); }
  finally { setBusy(false); }
}

// ============================================================
// 配方编辑器
// ============================================================
// 配方面板有两种状态：列表（运行）与编辑（改步骤）。之前只有列表，"配方"这个
// 概念在 UI 里是只读的 —— 用户能跑现成的却做不出自己的。
const FEDIT = { open: false, name: null, desc: '', steps: [], sel: -1,
                dirty: false };

const STEP_KINDS = {
  params: '参数', local: '局部', fill: '填充', formula: '子配方',
};

function formulaToEditor(name) {
  const f = FORMULA_LIB[name];
  if (!f) return false;
  FEDIT.open = true;
  FEDIT.name = name;
  FEDIT.desc = f.description || '';
  // deep copy so an abandoned edit does not corrupt the loaded library
  FEDIT.steps = JSON.parse(JSON.stringify(f.steps || []));
  FEDIT.sel = FEDIT.steps.length ? 0 : -1;
  FEDIT.dirty = false;
  return true;
}

function newFormula() {
  FEDIT.open = true;
  FEDIT.name = 'my_formula';
  FEDIT.desc = '';
  FEDIT.steps = [{ kind: 'params', params: {} }];
  FEDIT.sel = 0;
  FEDIT.dirty = true;
}

function stepSummary(st) {
  if (st.kind === 'params') {
    const n = Object.keys(st.params || {}).length;
    const keys = Object.keys(st.params || {}).slice(0, 3).join(',');
    return n + ' 项' + (keys ? ' · ' + keys : '');
  }
  if (st.kind === 'local') {
    const n = (st.adjustments || st.entries || []).length;
    return n + ' 个蒙版';
  }
  if (st.kind === 'fill') return st.prompt ? ('「' + st.prompt + '」') : '涂抹遮罩';
  if (st.kind === 'formula') return st.name || '(未命名)';
  return '';
}

function renderFormulaEditor() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">配方编辑</div>';

  const head = document.createElement('div');
  head.className = 'batchRow';
  head.innerHTML = '<span style="font-size:11px;color:var(--dim);width:42px">名称</span>' +
    '<input type="text" id="fedName" value="' + (FEDIT.name || '') + '">';
  wrap.appendChild(head);
  const head2 = document.createElement('div');
  head2.className = 'batchRow';
  head2.innerHTML = '<span style="font-size:11px;color:var(--dim);width:42px">说明</span>' +
    '<input type="text" id="fedDesc" value="' + (FEDIT.desc || '') + '">';
  wrap.appendChild(head2);

  const addRow = document.createElement('div');
  addRow.className = 'presetRow';
  addRow.innerHTML = Object.keys(STEP_KINDS).map(k =>
    '<button class="chip" data-add="' + k + '">＋ ' + STEP_KINDS[k] + '</button>'
  ).join('');
  wrap.appendChild(addRow);

  const list = document.createElement('div');
  list.id = 'fedSteps';
  wrap.appendChild(list);

  const det = document.createElement('div');
  det.id = 'fedDetail';
  wrap.appendChild(det);

  const acts = document.createElement('div');
  acts.className = 'presetRow';
  acts.innerHTML = '<button class="goldbtn" id="fedSave">保存</button>' +
    '<button class="chip" id="fedCancel">返回列表</button>';
  wrap.appendChild(acts);

  $('fedName').oninput = () => { FEDIT.name = $('fedName').value; FEDIT.dirty = true; };
  $('fedDesc').oninput = () => { FEDIT.desc = $('fedDesc').value; FEDIT.dirty = true; };
  addRow.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = () => {
      const k = b.dataset.add;
      const st = { kind: k };
      if (k === 'params') st.params = {};
      else if (k === 'local') st.adjustments = [];
      else if (k === 'formula') st.name = '';
      else if (k === 'fill') st.prompt = '';
      FEDIT.steps.push(st);
      FEDIT.sel = FEDIT.steps.length - 1;
      FEDIT.dirty = true;
      renderFormulaEditor();
    };
  });
  $('fedCancel').onclick = () => {
    FEDIT.open = false;
    renderFormulas();
  };
  $('fedSave').onclick = saveFormula;

  list.innerHTML = FEDIT.steps.length ? FEDIT.steps.map((st, i) =>
    '<div class="stepRow' + (i === FEDIT.sel ? ' active' : '') + '" data-i="' + i + '">' +
    '<span class="idx">' + (i + 1) + '</span>' +
    '<span class="kind">' + (STEP_KINDS[st.kind] || st.kind) + '</span>' +
    '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
    stepSummary(st) + '</span>' +
    '<span class="acts"><span data-up="' + i + '">↑</span>' +
    '<span data-dn="' + i + '">↓</span><span data-del="' + i + '">✕</span></span></div>'
  ).join('') : '<div style="color:var(--dim);font-size:11px">还没有步骤。用上面的按钮添加。</div>';

  list.querySelectorAll('.stepRow').forEach(el => {
    el.onclick = ev => {
      // `ev.target` is whichever child was actually clicked, so the action
      // spans are found with closest() — reading dataset off the row only
      // works when the row itself is the target, which a real click on the
      // ↑/↓/✕ glyph is not.
      const up = ev.target.closest('[data-up]');
      const dn = ev.target.closest('[data-dn]');
      const del = ev.target.closest('[data-del]');
      const i = parseInt(el.dataset.i, 10);
      if (up) {
        if (i > 0) {
          const t = FEDIT.steps[i - 1];
          FEDIT.steps[i - 1] = FEDIT.steps[i]; FEDIT.steps[i] = t;
          FEDIT.sel = i - 1; FEDIT.dirty = true; renderFormulaEditor();
        }
        return;
      }
      if (dn) {
        if (i < FEDIT.steps.length - 1) {
          const t = FEDIT.steps[i + 1];
          FEDIT.steps[i + 1] = FEDIT.steps[i]; FEDIT.steps[i] = t;
          FEDIT.sel = i + 1; FEDIT.dirty = true; renderFormulaEditor();
        }
        return;
      }
      if (del) {
        FEDIT.steps.splice(i, 1);
        FEDIT.sel = Math.min(FEDIT.sel, FEDIT.steps.length - 1);
        FEDIT.dirty = true; renderFormulaEditor();
        return;
      }
      FEDIT.sel = i;
      renderFormulaEditor();
    };
  });
  renderStepDetail();
}

function renderStepDetail() {
  const d = $('fedDetail');
  if (!d) return;
  const st = FEDIT.steps[FEDIT.sel];
  if (!st) { d.innerHTML = ''; return; }
  let html = '<div class="groupTitle">步骤 ' + (FEDIT.sel + 1) +
    ' · ' + (STEP_KINDS[st.kind] || st.kind) + '</div>';

  if (st.kind === 'params') {
    const keys = Object.keys(st.params || {});
    html += '<div class="batchRow"><input type="text" id="fedKey" ' +
      'placeholder="参数名，如 exposure"><button class="chip" id="fedAddKey">添加</button></div>';
    html += keys.length ? keys.map(k =>
      '<div class="batchRow"><span style="font-size:11px;color:var(--dim);width:96px;' +
      'overflow:hidden;text-overflow:ellipsis">' + k + '</span>' +
      '<input type="text" data-k="' + k + '" value="' + st.params[k] + '">' +
      '<span class="del" data-delk="' + k + '" style="cursor:pointer;color:var(--dim)">✕</span></div>'
    ).join('') : '<div style="color:var(--dim);font-size:11px">还没有参数。' +
      '参数名要和滑杆一致，例如 exposure / contrast / smooth。</div>';
  } else if (st.kind === 'formula') {
    html += '<div class="batchRow"><span style="font-size:11px;color:var(--dim);width:64px">子配方</span>' +
      '<input type="text" id="fedSub" value="' + (st.name || '') + '"></div>';
    html += '<div style="font-size:11px;color:var(--dim)">可用的：' +
      Object.keys(FORMULA_LIB).join('、') + '</div>';
  } else if (st.kind === 'fill') {
    html += '<div class="batchRow"><span style="font-size:11px;color:var(--dim);width:64px">提示词</span>' +
      '<input type="text" id="fedPrompt" value="' + (st.prompt || '') + '"></div>';
    html += '<div style="font-size:11px;color:var(--dim);line-height:1.7">' +
      '填充步骤在运行时会弹出涂抹界面，让你标出要重绘的区域。</div>';
  } else if (st.kind === 'local') {
    html += '<div style="font-size:11px;color:var(--dim);line-height:1.7">' +
      '这个步骤会应用你在"局部"面板里设好的蒙版。先在局部面板建好，再运行配方。</div>';
  }
  d.innerHTML = html;

  const add = $('fedAddKey');
  if (add) add.onclick = () => {
    const k = $('fedKey').value.trim();
    if (!k) return;
    st.params[k] = 0;
    FEDIT.dirty = true; renderFormulaEditor();
  };
  d.querySelectorAll('input[data-k]').forEach(inp => {
    inp.oninput = () => {
      const v = inp.value.trim();
      // keep numbers numeric: the engine does arithmetic on them, and a string
      // reaches `abs("170")` and raises
      const n = Number(v);
      st.params[inp.dataset.k] = (v !== '' && !isNaN(n)) ? n : v;
      FEDIT.dirty = true;
    };
  });
  d.querySelectorAll('[data-delk]').forEach(el => {
    el.onclick = () => {
      delete st.params[el.dataset.delk];
      FEDIT.dirty = true; renderFormulaEditor();
    };
  });
  const sub = $('fedSub');
  if (sub) sub.oninput = () => { st.name = sub.value; FEDIT.dirty = true; };
  const pr = $('fedPrompt');
  if (pr) pr.oninput = () => { st.prompt = pr.value; FEDIT.dirty = true; };
}

async function saveFormula() {
  const formula = { name: FEDIT.name, description: FEDIT.desc,
                    steps: FEDIT.steps };
  setBusy(true);
  try {
    const r = await fetch('/api/formulas/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ formula: formula }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    FORMULAS = []; FORMULA_LIB = {};
    FEDIT.dirty = false;
    FEDIT.open = false;
    await renderFormulas();
    log('配方已保存：' + formula.name + '（共 ' + j.count + ' 个）');
  } catch (e) { log('保存失败：' + e.message); }
  finally { setBusy(false); }
}

async function deleteFormula(name) {
  if (!confirm('删除配方「' + name + '」？')) return;
  setBusy(true);
  try {
    const r = await fetch('/api/formulas/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ formula: { name: name } }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    FORMULAS = []; FORMULA_LIB = {};
    await renderFormulas();
    log('已删除配方：' + name);
  } catch (e) { log('删除失败：' + e.message); }
  finally { setBusy(false); }
}

    '<div class="batchRow"><span style="font-size:11px;color:var(--dim);width:64px">自动导出</span>' +
    '<input type="text" id="tethOut" placeholder="留空则不导出"></div>';
  wrap.appendChild(paths);

  const auto = document.createElement('div');
  auto.innerHTML = '<div class="groupTitle">到达后自动处理</div>';
  wrap.appendChild(auto);
  const presets = document.createElement('div');
  presets.className = 'presetRow';
  const names = { natural: '自然', studio: '影楼', beauty: '美颜',

  presets.innerHTML = '<button class="chip" data-ap="">不处理</button>' +

  acts.className = 'presetRow';
  acts.innerHTML = '<button class="goldbtn" id="tethArm">开始联机</button>' +
    '<button class="chip" id="tethStop">停止</button>' +
    '<button class="goldbtn" id="tethShoot">拍摄</button>' +
    '<button class="chip" id="tethClear">清空记录</button>';
  wrap.appendChild(acts);

  const liveWrap = document.createElement('div');
  liveWrap.innerHTML = '<div class="groupTitle">实时取景</div>' +
    '<canvas id="tethLive" width="640" height="400" ' +
    'style="width:100%;height:auto;display:block;background:#08080a;' +
    'border:1px solid var(--line);border-radius:6px"></canvas>';
  wrap.appendChild(liveWrap);

  const box = document.createElement('div');
  box.id = 'tethInbox';
  wrap.appendChild(box);

  const cur = (TETHER.status && TETHER.status.config) || {};
  TETHER.cfg = Object.assign({ kind: 'folder', auto_preset: '' }, cur);
  if (cur.path) $('tethPath').value = cur.path;
  if (cur.auto_export_dir) $('tethOut').value = cur.auto_export_dir;
  const mark = (sel, attr, val) => {
    wrap.querySelectorAll(sel).forEach(b => {
      b.classList.toggle('active', (b.dataset[attr] || '') === (val || ''));

  };
  mark('[data-src]', 'src', TETHER.cfg.kind);
  mark('[data-ap]', 'ap', TETHER.cfg.auto_preset);
  srcRow.querySelectorAll('[data-src]').forEach(b => {
    b.onclick = () => {
      TETHER.cfg.kind = b.dataset.src;
      mark('[data-src]', 'src', TETHER.cfg.kind);
      refreshTether();
    };
  });
  presets.querySelectorAll('[data-ap]').forEach(b => {
    b.onclick = () => {
