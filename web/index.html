    };
  });
  $('tethArm').onclick = armTether;
  $('tethStop').onclick = async () => {
    await fetch('/api/tether/stop', { method: 'POST' });
    refreshTether();
  };
  $('tethShoot').onclick = shootTether;
  $('tethClear').onclick = async () => {
    await fetch('/api/tether/clear', { method: 'POST' });
    refreshTether();
  };

  refreshTether();
  if (TETHER.timer) clearInterval(TETHER.timer);
  TETHER.timer = setInterval(pollTether, 2500);
}

async function refreshTether() {
  try {
    const j = await fetch('/api/tether/status').then(r => r.json());
    TETHER.status = j;
    renderTetherStatus(j);
  } catch (e) { /* 状态取不到不打断面板 */ }
}

let devPoll = null;
async function loadDeviceStatus(retry) {
  const el = $('tethCamMsg');
  if (!el) return;
  try {
    const j = await fetch('/api/device/status').then(r => r.json());
    if (j.scanning && !retry) {
      // 首次查询要起 PowerShell 走 WIA，几秒钟；先给状态并轮询，
      // 否则面板会一直停在"检测中"
      el.innerHTML = '检测相机中… <span style="color:var(--dim)">' +
        '（读取 WIA 设备信息）</span>';
      if (devPoll) clearTimeout(devPoll);
      devPoll = setTimeout(function () { loadDeviceStatus(true); }, 1500);
      return;
    }
    const wia = (j.wia || [])[0];
    const wpd = (j.wpd || [])[0];
    const lines = [];
    if (wia) {
      lines.push('已识别：<b style="color:var(--gold)">' + wia.Name +
        '</b>（WIA 数码相机）');
    } else if (wpd) {
      lines.push('已识别：<b style="color:var(--gold)">' + wpd.name +
        '</b>（便携设备）');
    } else {
      lines.push('<span style="color:var(--dim)">未检测到相机</span>');
    }
    if (j.can_capture) {
      lines.push('<span class="bok">可以控制快门</span>');
    } else {
      // 这是这台机器的真实情况，说明清楚而不是留一个灰色按钮
      lines.push('<span class="bfail">系统未提供拍照命令与文件列表</span>');
      lines.push('<span style="color:var(--dim)">WIA 命令数 ' +
        (wia ? wia.Cmds : 0) + '、项目数 ' + (wia ? wia.Items : 0) +
        '。Nikon 不通过 Windows 标准接口开放快门控制。</span>');
      lines.push('<span style="color:var(--dim)">→ 走「文件夹监听」：' +
        '相机/传输软件把文件写进目录即可自动导入并套预设。</span>');
    }
    el.innerHTML = lines.join('<br>');
  } catch (e) {
    el.innerHTML = '<span style="color:var(--dim)">状态读取失败</span>';
  }
}

function renderTetherStatus(j) {
  const el = $('tethInfo');
  if (!el) return;
  const cam = (j.cameras || [])[0];
  const lines = [];
  lines.push('数据源：<b style="color:var(--gold)">' + (j.kind || '-') + '</b>' +
    (j.enabled ? ' · <span class="bok">联机中</span>' : ' · 未开始'));
  if (j.reason) lines.push('<span class="bfail">' + j.reason + '</span>');
  if (cam) {
    lines.push('相机：' + cam.name +
      (cam.can_capture
        ? ' <span class="bok">可控制快门</span>'
        : ' <span class="bfail">' + (cam.note || '不可控制快门') + '</span>'));
  } else {
    lines.push('相机：<span style="color:var(--dim)">未检测到</span>');
  }
  lines.push('digiCamControl：' +
    (j.digicamcontrol ? '<span class="bok">已安装</span>'
                      : '<span class="bfail">未安装</span>'));
  el.innerHTML = lines.join('<br>');
}

async function armTether() {
  TETHER.cfg.path = $('tethPath').value.trim();
  TETHER.cfg.auto_export_dir = $('tethOut').value.trim();
  setBusy(true);
  try {
    const r = await fetch('/api/tether/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(TETHER.cfg),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    log('联机已启动：' + TETHER.cfg.kind +
        (TETHER.cfg.path ? ' → ' + TETHER.cfg.path : ''));
    refreshTether();
  } catch (e) { log('启动失败：' + e.message); }
  finally { setBusy(false); }
}

async function shootTether() {
  setBusy(true);
  try {
    const j = await fetch('/api/tether/capture', { method: 'POST' })
      .then(r => r.json());
    if (!j.ok) { log('拍摄失败：' + (j.reason || '未知')); return; }
    log('已拍摄：' + (j.path || '') + ' · ' + j.seconds + 's');
    if (j.ingested && j.ingested.length) await adoptTether(j.ingested[0]);
    pollTether(true);
  } catch (e) { log('拍摄失败：' + e.message); }
  finally { setBusy(false); }
}

let tethPollBusy = false;
async function pollTether(force) {
  if (tethPollBusy) return;
  tethPollBusy = true;
  try {
    // POST：这次调用会导入照片、写会话、跑预设、导出文件，是有副作用的
    // 命令。用 GET 的话浏览器预取或代理重试可能把同一张导两次。
    const j = await fetch('/api/tether/poll', { method: 'POST' })
      .then(r => r.json());
    if (!j.enabled) return;
    if (j.new && j.new.length) {
      log('联机收到 ' + j.new.length + ' 张');
      // **不打断正在修的图**：当前会话有已提交的历史步骤（用户在精修）
      // 时只把新照片放进收件箱，不切会话——联机自动覆盖正在修的图是
      // 数据丢失级缺陷（实测：调到一半的参数被直接冲掉）。收件箱条目
      // 点一下才接入。
      const busy = await fetch('/api/history/' + S.session)
        .then(r => r.json()).catch(() => null);
      const editing = busy && (busy.can_undo === true);
      if (!editing || !S.session) {
        await adoptTether(j.new[j.new.length - 1]);
      } else {
        log('正在精修中：新照片已入收件箱，点击收件箱条目接入');
      }
    }
    renderInbox(j.inbox);
    if (force) renderTetherStatus(Object.assign({}, TETHER.status || {}, j.status || {}));
  } catch (e) { /* 轮询失败静默 */ }
  finally { tethPollBusy = false; }
}

async function adoptTether(entry) {
  if (!entry || !entry.session) return;
  try {
    const meta = await fetch('/api/faces/' + entry.session)
      .then(r => r.json()).catch(() => null);
    const img = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: entry.session, params: {}, quality: 88 }),
    }).then(r => r.json());
    if (!img || !img.image) return;
    S.session = entry.session;
    S.meta = meta || { width: img.width || 0, height: img.height || 0,
                       preview_width: img.width || 0,
                       preview_height: img.height || 0 };
    S.faces = (img.faces || []);
    S.base = 'data:image/jpeg;base64,' + img.image;
    matteImg = null; eraseCanvas = null;
    $('dropzone').style.display = 'none';
    ['btnExport','btnErase','btnPicker','btnMatte','btnMatch',
     'btnAuto','btnHeal','btnStamp','btnUpscale'].forEach(id => {
       const el = $(id); if (el) el.disabled = false;
     });
    await drawBase();
    await refreshHistory();
    log('已接入联机照片：' + entry.name +
        (entry.out ? '（已导出 ' + entry.out + '）' : ''));
  } catch (e) { log('接入联机照片失败：' + e.message); }
}

function renderInbox(list) {
  const box = $('tethInbox');
  if (!box || !list) return;
  if (!list.length) {
    box.innerHTML = '<div class="bstat">还没有收到照片。</div>';
    return;
  }
  box.innerHTML = '<div class="groupTitle">已收到（' + list.length + '）</div>' +
    list.slice().reverse().map(e =>
      '<div class="cullRow"><span>' + (e.ok ? '✓' : '✗') + ' ' + e.name +
      (e.preset ? ' <span style="color:var(--dim)">· ' + e.preset + '</span>' : '') +
      (e.error ? ' <span class="bfail">' + e.error + '</span>' : '') +
      '</span><span class="sc">' +
      (e.out ? '已导出' : (e.ok ? '已接入' : '失败')) + '</span></div>').join('');
}

// 常驻直方图（参数区顶部，任何分类下都在）。
// 和曲线/色阶面板里的那些不同：这是唯一的"权威"直方图，其它面板只是引用
// 同一份数据来画背景。参考软件也是这个结构。
function drawGlobalHist() {
  const c = $('globalHist');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#08080a';
  ctx.fillRect(0, 0, w, h);

  if (!MASK.hist) {
    ctx.fillStyle = 'rgba(150,155,165,.45)';
    ctx.font = '13px -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif';
    ctx.fillText('载入图片后显示直方图', 12, h / 2 + 4);
    const cap0 = $('histCap');
    if (cap0) cap0.textContent = '—';
    return;
  }

  const bins = MASK.hist.bins;
  const peak = Math.max(1, ...MASK.hist.lum, ...MASK.hist.r,
                        ...MASK.hist.g, ...MASK.hist.b);
  // 立方根压缩。log1p 会把真实分布的两倍起伏压到 0.92~1.00，画出来几乎是
  // 平的——形状和真实分布对不上，这是它上一条被判为"对不上"的原因。
  // 压缩策略：**去除首尾极端桶后的线性绘制**。
  //
  // 实测（这张图 64 桶，与真实分布的相关性）：identity 1.000 · sqrt 0.964 ·
  // cbrt 0.927 · log1p 0.817。任何固定压缩都在损失形状，而"形状对不上"正是
  // 这个功能最初被指出的问题——所以优先保真。
  //
  // 但纯线性也不行：死白（这张图 10.5% 的像素挤在最后一桶）会把比例尺顶到
  // 天花板，中间调被压成一条平线。所以归一化时**跳过首尾各一桶**——它们照常
  // 画出来，只是不参与决定高度比例。这样中间调的形状 1:1，而极端桶被裁顶。
  const shape = arr => {
    const n = arr.length;
    const out = new Float32Array(n);
    // 用去掉首尾两桶后的最大值做比例尺
    let scale = 1;
    for (let i = 1; i < n - 1; i++) {
      if (arr[i] > scale) scale = arr[i];
    }
    // 去掉后仍为 0 说明画面几乎全在极端值上，退回全局峰值
    if (scale < 1) scale = Math.max(1, peak);
    for (let i = 0; i < n; i++) {
      out[i] = Math.min(1, Math.max(0, arr[i]) / scale);
    }
    return out;
  };
  const lum = shape(MASK.hist.lum);
  const rr = shape(MASK.hist.r);
  const gg = shape(MASK.hist.g);
  const bb = shape(MASK.hist.b);

  // 亮度作为灰色底（填充）。压得比之前暗，否则 RGB 线被盖住看不出来——
  // 参考软件里三条彩色通道线是主体，灰度只是背景。
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let i = 0; i < bins; i++) {
    ctx.lineTo(i / (bins - 1) * w, h - lum[i] * h * 0.94);
  }
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(96,102,114,.30)';
  ctx.fill();

  // RGB 描边，叠加在上面
  const line = (arr, colour) => {
    ctx.beginPath();
    for (let i = 0; i < bins; i++) {
      const x = i / (bins - 1) * w;
      const y = h - arr[i] * h * 0.94;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = colour;
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  line(rr, '#ff6b6b');
  line(gg, '#5ede6a');
  line(bb, '#6b8cff');

  // 四分位竖线，帮助判断曝光落点
  ctx.strokeStyle = 'rgba(255,255,255,.08)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(w * i / 4, 0);
    ctx.lineTo(w * i / 4, h);
    ctx.stroke();
  }

  const cap = $('histCap');
  if (cap) {
    const m = MASK.hist.meta || {};
    const bits = [];
    if (m.iso) bits.push('ISO ' + m.iso);
    if (m.focal) bits.push(Math.round(m.focal) + 'mm');
    if (m.aperture) bits.push('F' + m.aperture);
    if (m.shutter) bits.push(m.shutter + '秒');
    if (m.raw) bits.push('RAW');
    cap.textContent = bits.length ? bits.join(' · ')
      : ((m.width || '?') + '×' + (m.height || '?'));
  }
  const clip = $('histClip');
  if (clip) {
    const pct = v => (100 * v / Math.max(1, MASK.hist.total)).toFixed(1) + '%';
    clip.textContent = '死黑 ' + pct(MASK.hist.clipped_low) +
      ' · 死白 ' + pct(MASK.hist.clipped_high);
  }
}


// 曲线/蒙版面板里的小直方图复用常驻那一个的绘制逻辑，避免两套压缩曲线
// 各自漂移（之前就是一处 log1p、一处 cbrt，形状不一致）。
function drawCurveHist() {
  drawGlobalHist();
}


// ============================================================
// 色阶（可拖动黑/灰/白场，截图里那一栏）
// ============================================================
// 三个手柄各自对应 levels 元组里的一项：黑场=in_black、白场=in_white、
// 灰场=gamma。灰场的位置不是中点：它是"输出 0.5 所对应的输入值"，
// 由 gamma 反解出来，所以拖动灰场改变的是曲线形状而不是平移。
const LEV = {
  channel: 'master',
  values: null,          // {master:[...], r:[...], g:[...], b:[...]}
  hist: null,
  drag: -1,
};
const LEV_CH = [['master', 'RGB'], ['r', 'R'], ['g', 'G'], ['b', 'B']];

function levVals() {
  if (!LEV.values) {
    LEV.values = { master: [0, 1, 1, 0, 1], r: [0, 1, 1, 0, 1],
                   g: [0, 1, 1, 0, 1], b: [0, 1, 1, 0, 1] };
  }
  return LEV.values[LEV.channel] || LEV.values.master;
}

// 输出 0.5 对应的输入位置（0..1），即灰场手柄该站的地方
function levGrayPos(v) {
  const ib = v[0], iw = Math.max(v[1], v[0] + 1e-4);
  const g = Math.max(v[2], 1e-3), ob = v[3], ow = v[4];
  const t = Math.pow(Math.min(1, Math.max(0, (0.5 - ob) / Math.max(ow - ob, 1e-4))), g);
  return ib + t * (iw - ib);
}

function drawLevels() {
  const c = $('levCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#08080a';
  ctx.fillRect(0, 0, w, h);

  const v = levVals();
  const hist = LEV.hist ? (LEV.hist[LEV.channel === 'master' ? 'lum'
                          : LEV.channel] || LEV.hist.lum) : null;

  if (hist && LEV.hist) {
    const bins = hist.length;
    const peak = Math.max(1, ...hist);
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let i = 0; i < bins; i++) {
      const val = Math.log1p(hist[i]) / Math.log1p(peak);
      ctx.lineTo(i / (bins - 1) * w, h - val * h * 0.92);
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fillStyle = 'rgba(150,155,165,.55)';
    ctx.fill();
  }

  // 被黑场/白场裁掉的区域压暗，和参考软件一样让"裁掉了多少"可见
  const X = t => t * w;
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, 0, X(v[0]), h);
  ctx.fillRect(X(v[1]), 0, w - X(v[1]), h);

  // 三个手柄：黑场/灰场/白场
  const pos = [v[0], levGrayPos(v), v[1]];
  const col = ['#ffffff', '#9aa3b2', '#ffffff'];
  pos.forEach((p, i) => {
    const x = Math.min(w - 2, Math.max(2, p * w));
    ctx.strokeStyle = LEV.drag === i ? '#e8b341' : col[i];
    ctx.lineWidth = LEV.drag === i ? 3 : 2;
    ctx.beginPath();
    ctx.moveTo(x, 2); ctx.lineTo(x, h - 2); ctx.stroke();
    // 手柄底部三角
    ctx.beginPath();
    ctx.moveTo(x - 5, h - 1); ctx.lineTo(x + 5, h - 1); ctx.lineTo(x, h - 9);
    ctx.closePath();
    ctx.fillStyle = LEV.drag === i ? '#e8b341' : col[i];
    ctx.fill();
  });
}

function bindLevels() {
  const c = $('levCanvas');
  if (!c) return;
  const toT = ev => {
    const r = c.getBoundingClientRect();
    return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  };
  const nearest = t => {
    const v = levVals();
    const pos = [v[0], levGrayPos(v), v[1]];
    let best = -1, bd = 0.05;
    pos.forEach((p, i) => { if (Math.abs(p - t) < bd) { bd = Math.abs(p - t); best = i; } });
    return best;
  };

  c.onmousedown = ev => {
    ev.preventDefault();
    LEV.drag = nearest(toT(ev));
    if (LEV.drag >= 0) levDragMove(toT(ev));
  };
  c.onmousemove = ev => { if (LEV.drag >= 0) levDragMove(toT(ev)); };
  window.addEventListener('mouseup', () => { LEV.drag = -1; });

  function levDragMove(t) {
    const v = levVals();
    if (LEV.drag === 0) v[0] = Math.min(t, v[1] - 0.01);          // 黑场
    else if (LEV.drag === 2) v[1] = Math.max(t, v[0] + 0.01);     // 白场
    else {
      // 灰场：从位置反解 gamma
      const ib = v[0], iw = v[1];
      const t2 = Math.min(0.999, Math.max(0.001, (t - ib) / Math.max(iw - ib, 1e-4)));
      v[2] = Math.log(t2) / Math.log(0.5);   // t2 = 0.5^g  →  g = ln t2 / ln 0.5
      v[2] = Math.min(4, Math.max(0.25, v[2]));
    }
    drawLevels();
    updateLevBoxes();
    requestRender();
  }

  ['levB', 'levG', 'levW'].forEach((id, i) => {
    const el = $(id);
    if (!el) return;
    el.oninput = () => {
      const v = levVals();
      const num = parseFloat(el.value);
      if (i === 0) v[0] = Math.min(num / 255, v[1] - 0.01);
      else if (i === 2) v[1] = Math.max(num / 255, v[0] + 0.01);
      else {
        const g = Math.min(4, Math.max(0.25, num === 0 ? 1 : num));
        v[2] = g;
      }
      drawLevels();
      requestRender();
    };
  });
  ['levB', 'levG', 'levW'].forEach((id, i) => {
    const el = $(id);
    if (el) el.onchange = () => { updateLevBoxes(); requestRender(); };
  });
}

function updateLevBoxes() {
  const v = levVals();
  const set = (id, val) => { const el = $(id); if (el) el.value = val; };
  const b = Math.round(v[0] * 255), w2 = Math.round(v[1] * 255);
  set('levB', b);
  set('levW', w2);
  set('levG', (Math.round(v[2] * 100) / 100).toFixed(2));
  // 底部那排是只读回显：上面两个框是实际输入，这里同步显示，否则看着像三个空框
  set('levB2', b);
  set('levW2', w2);
}

// ============================================================

// ============================================================
// 裁剪不写进像素，而是记在 session.geometry 上，每次从原图重算。这样"改裁剪"
// 和"取消裁剪"都成立；直接裁已裁过的图会把丢掉的像素永久丢掉。
const CROP = { x: 0, y: 0, w: 1, h: 1, rotate: 0, flipH: false, flipV: false,
               ratio: 'free', drag: null, active: false };

function renderCrop() {

    'style="width:100%;height:auto;display:block;background:#08080a;' +
    'border:1px solid var(--line);border-radius:6px;cursor:crosshair;' +

function drawCropCanvas(imgW, imgH) {
  const c = $('cropCanvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#08080a';
  ctx.fillRect(0, 0, w, h);

  // 以图片宽高比把画布当 "图片坐标系"
  const ar = imgW / Math.max(imgH, 1);
  let dw = w, dh = w / ar;
  if (dh > h) { dh = h; dw = h * ar; }
  const ox = (w - dw) / 2, oy = (h - dh) / 2;
  const X = t => ox + t * dw;
  const Y = t => oy + t * dh;

  if (S.base) {
    const im = S.img;
    if (im) ctx.drawImage(im, ox, oy, dw, dh);
    else {
      ctx.fillStyle = '#1a1d23'; ctx.fillRect(ox, oy, dw, dh);
    }
  } else {
    ctx.fillStyle = '#1a1d23'; ctx.fillRect(ox, oy, dw, dh);
  }

  // 框外压暗
  ctx.fillStyle = 'rgba(0,0,0,.62)';
  ctx.fillRect(0, 0, w, Y(CROP.y));
  ctx.fillRect(0, Y(CROP.y + CROP.h), w, h - Y(CROP.y + CROP.h));
  ctx.fillRect(0, Y(CROP.y), X(CROP.x), CROP.h * dh);
  ctx.fillRect(X(CROP.x + CROP.w), Y(CROP.y),
               w - X(CROP.x + CROP.w), CROP.h * dh);

  // 边框 + 三分线
  ctx.strokeStyle = 'var(--gold)';
  ctx.strokeStyle = '#e8b341';
  ctx.lineWidth = 2;
  ctx.strokeRect(X(CROP.x), Y(CROP.y), CROP.w * dw, CROP.h * dh);
  ctx.strokeStyle = 'rgba(255,255,255,.28)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(X(CROP.x + CROP.w * i / 3), Y(CROP.y));
    ctx.lineTo(X(CROP.x + CROP.w * i / 3), Y(CROP.y + CROP.h));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(X(CROP.x), Y(CROP.y + CROP.h * i / 3));
    ctx.lineTo(X(CROP.x + CROP.w), Y(CROP.y + CROP.h * i / 3));
    ctx.stroke();
  }
  // 四角手柄
  const hs = 7;
  [[CROP.x, CROP.y], [CROP.x + CROP.w, CROP.y],
   [CROP.x, CROP.y + CROP.h], [CROP.x + CROP.w, CROP.y + CROP.h]]
    .forEach(([px, py]) => {
      ctx.fillStyle = '#e8b341';
      ctx.fillRect(X(px) - hs / 2, Y(py) - hs / 2, hs, hs);
    });

  const info = $('crInfo');
  if (info) {
    const pw = Math.round(CROP.w * imgW), ph = Math.round(CROP.h * imgH);
    info.innerHTML = '裁剪尺寸 <b>' + pw + ' × ' + ph + '</b>' +
      ' px（原图 ' + imgW + ' × ' + imgH + '）';
  }
}

function bindCropCanvas() {
  const c = $('cropCanvas');
  if (!c) return;
  const toNorm = ev => {
    const r = c.getBoundingClientRect();
    const sx = c.width / r.width, sy = c.height / r.height;
    const px = (ev.clientX - r.left) * sx;
    const py = (ev.clientY - r.top) * sy;
    const imgW = S.meta ? S.meta.width : 1440;
    const imgH = S.meta ? S.meta.height : 960;
    const ar = imgW / Math.max(imgH, 1);
    let dw = c.width, dh = c.width / ar;
    if (dh > c.height) { dh = c.height; dw = c.height * ar; }
    const ox = (c.width - dw) / 2, oy = (c.height - dh) / 2;
    return { x: (px - ox) / dw, y: (py - oy) / dh };
  };
  c.onmousedown = ev => {
    const p = toNorm(ev);
    CROP.drag = { x0: p.x, y0: p.y };
    CROP.active = true;
  };
  c.onmousemove = ev => {
    if (!CROP.drag) return;
    const p = toNorm(ev);
    let x0 = Math.min(CROP.drag.x0, p.x);
    let y0 = Math.min(CROP.drag.y0, p.y);
    let x1 = Math.max(CROP.drag.x0, p.x);
    let y1 = Math.max(CROP.drag.y0, p.y);
    x0 = Math.max(0, Math.min(1, x0)); x1 = Math.max(0, Math.min(1, x1));
    y0 = Math.max(0, Math.min(1, y0)); y1 = Math.max(0, Math.min(1, y1));
    if (x1 - x0 < 0.02 || y1 - y0 < 0.02) return;
    CROP.x = x0; CROP.y = y0; CROP.w = x1 - x0; CROP.h = y1 - y0;
    drawCropCanvas(S.meta ? S.meta.width : 1440,
                   S.meta ? S.meta.height : 960);
  };
  window.addEventListener('mouseup', () => {
    if (!CROP.drag) return;
    CROP.drag = null;
    fetchCropPreview();
  });
}

let cropTimer = null;
function fetchCropPreview() {
  clearTimeout(cropTimer);
  cropTimer = setTimeout(async () => {
    if (!S.session || !CROP.active) return;
    try {
      const r = await fetch('/api/crop/preview', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: S.session,

      const j = await r.json();
      if (j.image) {
        const info = $('crInfo');
        if (info) info.innerHTML = '预览 <b>' + j.width + ' × ' + j.height +
          '</b> px';
      }
    } catch (e) { /* 预览失败不阻断 */ }
  }, 180);
}

const PG = { shadow: [0, 0, 0], highlight: [0, 0, 0], balance: 0,
             vignette: 0, glow: 0, temperature: 0 };

function renderPostGrade() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">后调色 · 分离色调 / 暗角 / 辉光</div>';
  const tints = [['shadow', '阴影染色'], ['highlight', '高光染色']];

  body.innerHTML = tints.map(([k, n]) =>
    '<div class="groupTitle">' + n + '</div>' +
    ['r', 'g', 'b'].map(c =>
      '<div class="sl"><div class="hdr"><span class="name">' +
      c.toUpperCase() + '</span><span class="val" id="pgv_' + k + c + '">0' +
      '</span></div><input type="range" id="pgr_' + k + c +
      '" min="-100" max="100" step="1" value="0"></div>').join('')).join('') +
    '<div class="groupTitle">整体</div>' +
    [['balance', '平衡', -100, 100], ['vignette', '暗角', 0, 100],
     ['glow', '辉光', 0, 100], ['temperature', '色温', -100, 100]]
      .map(([k, n, lo, hi]) =>
        '<div class="sl"><div class="hdr"><span class="name">' + n +
        '</span><span class="val" id="pgv_' + k + '">' + (PG[k] || 0) +
        '</span></div><input type="range" id="pgr_' + k + '" min="' + lo +
        '" max="' + hi + '" step="1" value="' + (PG[k] || 0) +

  tints.forEach(([k]) => {
    ['r', 'g', 'b'].forEach((c, i) => {

      el.oninput = () => {
        const v = parseFloat(el.value);
        $('pgv_' + k + c).textContent = v;
        PG[k][i] = v / 100;
        requestPGPreview();
      };
    });
  });
  ['balance', 'vignette', 'glow', 'temperature'].forEach(k => {
    const el = $('pgr_' + k);
    if (!el) return;

  $('pgZero').onclick = () => {
    PG.shadow = [0, 0, 0]; PG.highlight = [0, 0, 0];
    PG.balance = PG.vignette = PG.glow = PG.temperature = 0;
    renderPostGrade();
  };

const PT = {
  expression: { smile: 0, eye_open: 0, brow_raise: 0, mouth_narrow: 0, squash: 0 },

function renderPortrait(kind) {

                   hair: '头发调整', clothes: '衣物' };

      '没有检测到人脸时这些滑杆不会生效。</div>';
    [['smile', '微笑'], ['eye_open', '睁眼'], ['brow_raise', '抬眉'],
     ['mouth_narrow', '收窄嘴'], ['squash', '下巴下压']].forEach(([k, n]) => {

      d.className = 'sl';

      };

  }

    const tones = ['coral', 'rose', 'peach', 'berry', 'nude', 'brick', 'plum'];
    [['lip', '唇彩', 'lip_tone'], ['blush', '腮红', 'blush_tone'],
     ['shadow', '眼影', 'shadow_tone'], ['brow', '眉毛', 'brow_tone']]
      .forEach(([k, n, tk]) => {
        const d = document.createElement('div');
        d.innerHTML = '<div class="sl"><div class="hdr"><span class="name">' +
          n + '</span><span class="val" id="ptv_' + k + '">' + (st[k] || 0) +
          '</span></div><input type="range" id="ptr_' + k +
          '" min="0" max="100" step="1" value="' + (st[k] || 0) + '"></div>' +
          '<div class="presetRow">' + tones.map(t =>
            '<button class="chip toneChip' + (st[tk] === t ? ' active' : '') +
            '" data-k="' + k + '" data-t="' + t + '">' + t + '</button>')
            .join('') + '</div>';
        wrap.appendChild(d);
        d.querySelector('input').oninput = ev => {
          st[k] = parseFloat(ev.target.value);
          $('ptv_' + k).textContent = st[k];
          requestPortrait();
        };
        d.querySelectorAll('.toneChip').forEach(b => {
          b.onclick = () => { st[tk] = b.dataset.t; renderPortrait('makeup'); };
        });
      });
  }

  if (kind === 'hair') {
    [['hair_volume', '蓬松'], ['hair_shine', '光泽'],
     ['hair_colour', '发色强度'], ['hair_frizz', '减少碎发']]
      .forEach(([k, n]) => {
        const d = document.createElement('div');
        d.className = 'sl';
        d.innerHTML = '<div class="hdr"><span class="name">' + n +
          '</span><span class="val" id="ptv_' + k + '">' + (st[k] || 0) +
          '</span></div><input type="range" id="ptr_' + k +
          '" min="0" max="100" step="1" value="' + (st[k] || 0) + '">';
        wrap.appendChild(d);
        d.querySelector('input').oninput = ev => {
          st[k] = parseFloat(ev.target.value);
          $('ptv_' + k).textContent = st[k];
          requestPortrait();
        };
      });
    const sw = document.createElement('div');
    sw.className = 'presetRow';
    sw.innerHTML = '<span class="bstat" style="width:100%">发色</span>' +
      ['#1a1a1a', '#6b4a2f', '#c9a06a', '#e0c070', '#b03a3a',
       '#5a5ad0', '#c05aa8'].map(c =>
        '<span class="swatch" data-hc="' + c +
        '" style="background:' + c + ';width:20px;height:20px"></span>').join('');
    wrap.appendChild(sw);
    sw.querySelectorAll('[data-hc]').forEach(el => {
      el.onclick = () => {
        const hex = el.dataset.hc;
        st.hair_rgb = [parseInt(hex.slice(1, 3), 16) / 255,
                       parseInt(hex.slice(3, 5), 16) / 255,
                       parseInt(hex.slice(5, 7), 16) / 255];
        st.hair_colour = st.hair_colour || 60;
        renderPortrait('hair');
      };
    });
  }

  if (kind === 'clothes') {
    [['wrinkle', '去褶皱'], ['stain', '去污点'],
     ['structure', '版型强化'], ['cloth_tint', '染色强度']]
      .forEach(([k, n]) => {
        const d = document.createElement('div');
        d.className = 'sl';
        d.innerHTML = '<div class="hdr"><span class="name">' + n +
          '</span><span class="val" id="ptv_' + k + '">' + (st[k] || 0) +
          '</span></div><input type="range" id="ptr_' + k +
          '" min="0" max="100" step="1" value="' + (st[k] || 0) + '">';
        wrap.appendChild(d);
        d.querySelector('input').oninput = ev => {
          st[k] = parseFloat(ev.target.value);
          $('ptv_' + k).textContent = st[k];
          requestPortrait();
        };
      });
  }

  const acts = document.createElement('div');
  acts.className = 'presetRow';
  acts.innerHTML = '<button class="goldbtn" id="ptApply">应用</button>' +
    '<button class="chip" id="ptZero">归零</button>';
  wrap.appendChild(acts);
  $('ptApply').onclick = () => applyPortrait(true);
  $('ptZero').onclick = () => {
    if (kind === 'expression') PT.expression = { smile: 0, eye_open: 0,
      brow_raise: 0, mouth_narrow: 0, squash: 0 };
    else if (kind === 'hair') PT.hair = { hair_volume: 0, hair_shine: 0,
      hair_colour: 0, hair_frizz: 0, hair_rgb: null };
    else if (kind === 'clothes') PT.clothes = { wrinkle: 0, stain: 0,
      structure: 0, cloth_tint: 0, cloth_rgb: null };
    else PT.makeup = { lip: 0, lip_tone: 'rose', blush: 0, blush_tone: 'coral',
      shadow: 0, shadow_tone: 'nude', brow: 0, brow_tone: 'brick' };
    renderPortrait(kind);
  };
}

// ============================================================
// 自动蒙版（人脸/皮肤/衣服/背景 一次抠出）
// ============================================================
// 参考软件（PS）的「选择主体」给一个整体选区；这里按**部位**分开给，
// 并且每个都能单独导出。能力来自两个分割模型的分工：
//   selfie_multiclass -> 背景/头发/脸部皮肤/身体皮肤/衣服/配饰/人物整体
//   SegFormer         -> 面部皮肤/眉毛/眼睛/嘴唇/口腔/鼻子
const AM = {
  parts: [], coverage: {}, thumbs: {}, picked: null,
  LABEL: {
    background: '背景', hair: '头发', face_skin: '脸部皮肤',
    body_skin: '身体皮肤', clothes: '衣服', accessories: '配饰',
    subject: '人物整体', face: '面部皮肤', brows: '眉毛', eyes: '眼睛',
    lips: '嘴唇', mouth: '口腔', nose: '鼻子',
  },
};

async function renderAutoMask() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">自动蒙版</div>' +
    '<div class="bstat">一次生成全部区域蒙版。每个都能单独导出' +
    '（灰度蒙版 / 透明 PNG）。</div>';
  const act = document.createElement('div');
  act.className = 'presetRow';
  act.innerHTML = '<button class="goldbtn" id="amRun">生成蒙版</button>' +
    '<span class="bstat" id="amStat" style="flex:1"></span>';
  wrap.appendChild(act);

  const view = document.createElement('div');
  view.id = 'amView';
  view.style.cssText = 'margin-top:6px;text-align:center';
  view.innerHTML = '<div class="bstat" style="padding:10px">' +
    '点「生成蒙版」开始（约 20~30 秒）</div>';
  wrap.appendChild(view);

  const grid = document.createElement('div');
  grid.id = 'amGrid';
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);' +
    'gap:5px;margin-top:6px';
  wrap.appendChild(grid);

  const actions = document.createElement('div');
  actions.className = 'presetRow';
  actions.id = 'amActions';
  actions.style.display = 'none';
  actions.innerHTML = '<button class="chip" id="amMask">导出灰度蒙版</button>' +
    '<button class="chip" id="amAlpha">导出透明 PNG</button>';
  wrap.appendChild(actions);

  $('amRun').onclick = runAutoMask;
  $('amMask').onclick = () => exportAutoMask('mask');
  $('amAlpha').onclick = () => exportAutoMask('alpha');
}

async function runAutoMask() {
  if (!S.session) { log('先载入图片'); return; }
  const btn = $('amRun'), stat = $('amStat');
  btn.disabled = true;
  if (stat) stat.textContent = '生成中…（约 20~30 秒）';
  setBusy(true);
  try {
    const r = await fetch('/api/automask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    const info = j.info || {};
    AM.parts = info.available || [];
    AM.coverage = info.coverage || {};
    AM.thumbs = j.thumbs || {};
    if (j.image) {
      $('amView').innerHTML =
        '<img src="data:image/jpeg;base64,' + j.image +
        '" style="max-width:100%;border:1px solid var(--line);' +
        'border-radius:4px">';
    }
    renderAutoMaskGrid();
    const un = info.unavailable || {};
    const missing = Object.keys(un);
    if (stat) {
      stat.textContent = AM.parts.length + ' 个区域可用' +
        (missing.length ? '（' + missing.join('/') + ' 不可用）' : '');
    }
    log('自动蒙版：' + AM.parts.length + ' 个区域' +
        (missing.length ? ' · ' + missing.join('/') + ' 不可用' : ''));
  } catch (e) {
    log('自动蒙版失败：' + e.message);
    if (stat) stat.textContent = '失败';
  } finally { btn.disabled = false; setBusy(false); }
}

function renderAutoMaskGrid() {
  const grid = $('amGrid');
  if (!grid) return;
  // 按语义顺序排（背景在最后）
  const ORDER = ['subject', 'hair', 'face_skin', 'body_skin', 'clothes',
                 'accessories', 'face', 'brows', 'eyes', 'lips', 'mouth',
                 'nose', 'background'];
  const list = ORDER.filter(k => AM.parts.indexOf(k) >= 0);
  grid.innerHTML = list.map(k => {
    const cov = AM.coverage[k] || 0;
    const th = AM.thumbs[k] ? 'data:image/jpeg;base64,' + AM.thumbs[k] : '';
    return '<div class="amCell" data-p="' + k + '" style="cursor:pointer;' +
      'border:2px solid ' + (AM.picked === k ? 'var(--gold)' : 'transparent') +
      ';border-radius:5px;overflow:hidden;background:#1a1a1e">' +
      (th ? '<img src="' + th + '" style="width:100%;display:block;' +
        'filter:none">' : '') +
      '<div style="font-size:9.5px;color:var(--text);padding:1px 3px">' +
      (AM.LABEL[k] || k) + '</div>' +
      '<div style="font-size:8.5px;color:var(--dim);padding:0 3px 2px">' +
      (cov * 100).toFixed(1) + '%</div></div>';
  }).join('');
  grid.querySelectorAll('.amCell').forEach(el => {
    el.onclick = () => {
      AM.picked = el.dataset.p;
      grid.querySelectorAll('.amCell').forEach(x =>
        x.style.borderColor = 'transparent');
      el.style.borderColor = 'var(--gold)';
      const a = $('amActions');
      if (a) a.style.display = 'flex';
    };
  });
}

async function exportAutoMask(mode) {
  if (!S.session || !AM.picked) { log('先选一个区域'); return; }
  setBusy(true);
  try {
    const r = await fetch('/api/automask/export', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, part: AM.picked,
                             mode: mode }) });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.detail || r.statusText);
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mask_' + AM.picked + (mode === 'alpha' ? '_alpha' : '') +
      '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    log('已导出：' + (AM.LABEL[AM.picked] || AM.picked) +
        '（' + (mode === 'alpha' ? '透明 PNG' : '灰度蒙版') + '）');
  } catch (e) { log('导出失败：' + e.message); }
  finally { setBusy(false); }
}

// ============================================================
// 生成式三件套（AI 布景 / 创成式填充 / 道具修复，本地 ComfyUI）
// ============================================================
// 三者共用扩散 inpainting：mask 外逐像素不变。AI 布景的 mask 是主体
// 补集；创成式填充是用户在画布上手涂（毛笔模式画 mask 后回本面板）；
// 道具修复自动识别灯架/柔光箱，也可手涂。ComfyUI 未启动时面板给出
// 启动命令而不是死按钮。
const GEN = { feature: 'backdrop', prompt: '', strength: 1.0 };

function renderGen() {
  const wrap = $('sliders');

async function runGen() {
  if (!S.session) { log('先载入图片'); return; }
  if (GEN.feature !== 'prop' && !GEN.prompt.trim()) {
    log('先写一句描述'); return;
  }
  const btn = $('genRun'), info = $('genInfo');
  btn.disabled = true;
  if (info) info.textContent = '生成中…（15~60 秒，取决于显卡）';
  setBusy(true);
  try {
    // 手涂 mask（如果画过）转 PNG 上传
    let maskB64 = '';
    if (typeof genMaskToPng === 'function') {
      maskB64 = genMaskToPng() || '';
    }
    const r = await fetch('/api/gen', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, feature: GEN.feature,
        prompt: GEN.prompt, strength: GEN.strength, mask_png: maskB64 }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    if ($('genView')) {
      $('genView').innerHTML =
        '<img src="data:image/jpeg;base64,' + j.image +
        '" style="max-width:100%;border:1px solid var(--line);' +
        'border-radius:4px">' +
        '<div class="bstat" style="margin-top:4px">耗时 ' +
        ((j.info.seconds || 0)) + 's · seed ' + (j.info.seed || '-') +
        '</div>';

    S.base = 'data:image/jpeg;base64,' + j.image;
    await drawBase();
    if (info) info.textContent = '完成';
    log('生成完成：' + GEN.feature + '（' + (j.info.seconds || '?') + 's）');
  } catch (e) {
    log('生成失败：' + e.message);
    if (info) info.textContent = '失败：' + e.message;
  } finally { btn.disabled = false; setBusy(false); }
}

  if (!S.session) { log('先载入图片'); return; }
  const btn = $('skyRun'), stat = $('skyStat');
  btn.disabled = true;
  if (stat) stat.textContent = '识别并合成中…';
  setBusy(true);
  try {
    const r = await fetch('/api/sky', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, preset: SKY.preset,
                             strength: SKY.strength,
                             match_brightness: $('skyMatch').checked }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    if ($('skyView')) {
      $('skyView').innerHTML =
        '<img src="data:image/jpeg;base64,' + j.image +
        '" style="max-width:100%;border:1px solid var(--line);' +
        'border-radius:4px">' +
        '<div class="bstat" style="margin-top:4px">天空占比 ' +
        Math.round((j.info.coverage || 0) * 100) + '%</div>';
    }
    S.base = 'data:image/jpeg;base64,' + j.image;
    await drawBase();
    if (stat) stat.textContent = '完成（天空 ' +
      Math.round((j.info.coverage || 0) * 100) + '%）';
    log('换天空：' + SKY.preset + ' · 天空占比 ' +
        Math.round((j.info.coverage || 0) * 100) + '%');
  } catch (e) {
    log('换天空失败：' + e.message);
    if (stat) stat.textContent = '失败';
  } finally { btn.disabled = false; setBusy(false); }
}

// ============================================================
// 证件照（规格裁切 + 换底色）
// ============================================================
// 参考软件在「图像美化 → 创成式填充 → 证件照换背景」和「证件照换背景」
// 折叠项里提供。这里做的是可确定的部分：按国标尺寸裁切、头部占比按规范
// 定位、纯色底换色。不生成衣物、不改表情。
const IDP = {
  spec: 'two_inch', colour: [255, 255, 255],
  SPECS: { one_inch: '一寸 25×35', two_inch: '二寸 35×49',
           small_two: '小二寸 35×45', visa: '签证 35×45',
           passport: '护照 33×48' },
  COLOURS: [['白底', [255, 255, 255]], ['蓝底', [28, 90, 184]],
            ['红底', [208, 40, 40]], ['灰底', [200, 200, 205]]],
};

function renderIdPhoto() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">证件照 · 规格裁切 + 换底色</div>' +
    '<div class="bstat">按国标尺寸裁切，头部占比按规范自动定位。' +
    '纯色背景走色键（边缘更干净），复杂背景回退抠图。</div>';

  sizeRow.innerHTML = Object.keys(IDP.SPECS).map(k =>
    '<button class="chip idSpec" data-s="' + k + '"' +
    (IDP.spec === k ? ' style="border-color:var(--gold)"' : '') + '>' +
    IDP.SPECS[k] + '</button>').join('');
  wrap.appendChild(sizeRow);

  const colRow = document.createElement('div');
  colRow.className = 'presetRow';
  colRow.innerHTML = IDP.COLOURS.map(c =>
    '<button class="chip idCol" data-c="' + c[1].join(',') + '">' +
    '<span style="display:inline-block;width:9px;height:9px;border-radius:2px;' +
    'background:rgb(' + c[1].join(',') + ');margin-right:4px;' +
    'border:1px solid #555"></span>' + c[0] + '</button>').join('');
  wrap.appendChild(colRow);

  const acts = document.createElement('div');
  acts.className = 'presetRow';
  acts.innerHTML = '<button class="goldbtn" id="idMake">生成证件照</button>' +

  wrap.appendChild(acts);

  const view = document.createElement('div');
  view.id = 'idView';
  view.style.cssText = 'margin-top:8px;text-align:center';
  wrap.appendChild(view);

  sizeRow.querySelectorAll('.idSpec').forEach(b => {
    b.onclick = () => {
      IDP.spec = b.dataset.s;
      sizeRow.querySelectorAll('.idSpec').forEach(x =>
        x.style.borderColor = '');
      b.style.borderColor = 'var(--gold)';
    };
  });
  colRow.querySelectorAll('.idCol').forEach(b => {
    b.onclick = () => {
      IDP.colour = b.dataset.c.split(',').map(Number);
      colRow.querySelectorAll('.idCol').forEach(x =>
        x.style.borderColor = '');

    };
  });
  $('idMake').onclick = () => makeIdPhoto(false);
  $('idSave').onclick = () => makeIdPhoto(true);
}

async function makeIdPhoto(save) {
  if (!S.session) { log('先载入图片'); return; }
  setBusy(true);
  try {
    const body = { session: S.session, spec: IDP.spec,
                   colour: IDP.colour, keep_lighting: false };
    if (save) {
      // 导出路径：默认放到原图同目录，名字带规格
      const base = (S.meta && S.meta.name) ? S.meta.name : 'idphoto';
      const dir = prompt('导出目录（留空 = 当前目录）', '');
      if (dir === null) return;
      body.out_path = (dir ? dir.replace(/[\\\/]+$/, '') + '\\' : '') +
        base.replace(/\.[^.]+$/, '') + '_' + IDP.spec + '.jpg';
    }
    const r = await fetch('/api/idphoto', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    const v = $('idView');
    if (v) {
      v.innerHTML = '<img src="data:image/jpeg;base64,' + j.image +
        '" style="max-width:100%;border:1px solid var(--line);' +
        'border-radius:4px">' +
        '<div class="bstat" style="margin-top:4px">' + j.width + '×' +
        j.height + ' · ' + (j.info && j.info.key === 'color_key'
          ? '色键' : '抠图') + '</div>';
    }
    S.base = 'data:image/jpeg;base64,' + j.image;
    await drawBase();
    if (save) {
      log('证件照已导出：' + j.path);
      await refreshHistory();
    } else {
      log('证件照已生成：' + j.width + '×' + j.height + '（未提交，' +
          '预览用）');
    }
  } catch (e) { log('证件照失败：' + e.message); }
  finally { setBusy(false); }
}

// ============================================================
// 图库：网格浏览 + 技术分组（参考软件的图库模块）
// ============================================================
// 分组不是"按文件名"，而是按**技术指标**：抖动/欠曝/过曝/重复/精选。
// 判据是这一批自身的分位数，所以夜景不会被整批标成欠曝。
const LIB = {
  roots: null, scanning: false, path: '', items: [], groups: {},
  filter: 'all', sel: {}, view: 'grid', pollTimer: null,
};

const LIB_GROUP_LABEL = {
  all: '全部', pick: 'AI 精选', blur: '抖动', under: '欠曝',
  over: '过曝', dup: '重复照片', closed: '闭眼',
};

// 图库由**用户自行导入**（参考软件同为用户把照片文件夹拖进来/选进来）。
// 之前这里会自动扫描整个磁盘的所有盘符——首屏要等几十秒，还会把系统
// 目录也列出来，既慢又不是用户想要的流程。现在启动时图库为空，用户
// 「导入文件夹」或拖放目录进来，来源持久化，下次启动直接可用。
async function libLoadSources() {
  try {
    const j = await fetch('/api/library/sources').then(r => r.json());
    LIB.sources = j.sources || [];
  } catch (e) { LIB.sources = []; }
  // 已修标记（源路径 -> 导出记录），格子渲染 ✓ 用。失败不阻塞。
  if (!LIB.done) {
    try {
      const d = await fetch('/api/library/done').then(r => r.json());
      LIB.done = d.done || {};
    } catch (e) { LIB.done = {}; }
  }
  // 恢复上次浏览的目录。必须 await：如果放任它在后台跑，用户这边的
  // 移除/再导入会先执行，扫描回来的 renderLibrary 又把旧状态刷回来
  // （实测"移除来源"因此看起来没生效）。
  if (!LIB.items.length && LIB.sources.length) {
    const lastSrc = LIB.sources[LIB.sources.length - 1];
    await libScan(lastSrc.path, lastSrc.recursive);
  }
}

async function libImportFolder() {
  // 浏览器不能直接拿本机目录路径；用输入框 + 服务端校验，与联机监听
  // 的目录填写方式一致。也支持把文件夹拖到图库面板上（drop 事件）。
  const p = prompt('输入照片文件夹路径：', localStorage.getItem('rl_lib_dir')
    || '');
  if (!p) return;
  await libAddSource(p.trim());
}

async function libAddSource(path, recursive) {
  setBusy(true);
  try {
    const r = await fetch('/api/library/import', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path, recursive: !!recursive }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    localStorage.setItem('rl_lib_dir', path);
    LIB.sources = j.sources || [];
    LIB.path = j.root;
    LIB.items = j.items || [];
    LIB.groups = j.groups || {};
    LIB.sel = {}; LIB.filter = 'all';
    renderLibrary();
    log('图库导入：' + j.count + ' 张（' + path + '）· 精选 ' +
        (j.groups.pick || 0) + ' 闭眼 ' + (j.groups.closed || 0));
  } catch (e) { log('导入失败：' + e.message); }
  finally { setBusy(false); }
}

async function libRemoveSource(path) {
  try {
    await fetch('/api/library/source_remove', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path }) });
    LIB.sources = (LIB.sources || []).filter(s => s.path !== path);
    if (LIB.path === path) { LIB.path = ''; LIB.items = []; LIB.sel = {}; }
    renderLibrary();
    log('已从图库移除：' + path);
  } catch (e) { log('移除失败：' + e.message); }
}

async function libScan(path, recursive) {
  LIB.path = path;
  LIB.items = []; LIB.sel = {}; LIB.filter = 'all';
  renderLibrary();
  try {
    const j = await fetch('/api/library/scan?path=' +
                          encodeURIComponent(path) + '&limit=300')
      .then(r => r.json());
    if (j.detail) throw new Error(j.detail);
    LIB.items = j.items || [];
    LIB.groups = j.groups || {};
    renderLibrary();
    log('图库：' + j.count + ' 张 · 抖动 ' + (j.groups.blur || 0) +
        ' 欠曝 ' + (j.groups.under || 0) + ' 过曝 ' + (j.groups.over || 0) +
        ' 重复 ' + (j.groups.dup || 0) + ' 闭眼 ' + (j.groups.closed || 0) +
        ' 精选 ' + (j.groups.pick || 0));
  } catch (e) { log('图库扫描失败：' + e.message); }
}

function libVisible() {
  if (LIB.filter === 'all') return LIB.items;
  return LIB.items.filter(it => (it.tags || []).includes(LIB.filter));
}

function renderLibrary() {
  const wrap = $('sliders');
  if (!wrap) return;
  wrap.innerHTML = '';

  // 分组选择
  const bar = document.createElement('div');
  bar.className = 'presetRow';
  const g = LIB.groups || {};
  bar.innerHTML = Object.keys(LIB_GROUP_LABEL).map(k => {
    const n = k === 'all' ? LIB.items.length : (g[k] || 0);
    return '<button class="chip libF' + (LIB.filter === k ? ' active' : '') +
      '" data-f="' + k + '">' + LIB_GROUP_LABEL[k] + ' ' + n + '</button>';
  }).join('');
  wrap.appendChild(bar);
  bar.querySelectorAll('.libF').forEach(b => {
    b.onclick = () => { LIB.filter = b.dataset.f; renderLibrary(); };
  });

  // 来源（用户导入的文件夹）+ 导入按钮 + 拖放
  const roots = document.createElement('div');
  roots.id = 'libSources';
  roots.innerHTML = '<div class="groupTitle">照片来源</div>' +
    '<div class="presetRow">' +
    '<button class="goldbtn" id="libImport">导入文件夹</button>' +
    '<button class="chip" id="libImportRec">含子文件夹</button>' +
    '<span class="bstat" style="flex:1">或把文件夹拖到这里</span></div>';
  wrap.appendChild(roots);
  $('libImport').onclick = () => libImportFolder();
  let recNext = false;
  $('libImportRec').onclick = () => {
    recNext = !recNext;
    $('libImportRec').classList.toggle('active', recNext);
    log('下一次导入' + (recNext ? '包含' : '不包含') + '子文件夹');
  };
  (LIB.sources || []).forEach(s => {
    const d = document.createElement('div');
    d.className = 'batchRow';
    if (s.missing) {
      d.innerHTML = '<span style="flex:1;color:var(--dim);font-size:11px">' +
        '⚠ ' + s.path + '（目录不存在）</span>';
    } else {
      d.innerHTML = '<span style="flex:1;color:var(--text);font-size:11px;' +
        'overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:' +
        'pointer" title="' + s.path + '">' + s.path + '</span>' +
        '<span style="color:var(--gold);font-size:11px;flex:0 0 auto">' +
        s.count + ' 张</span>';
    }
    const del = document.createElement('button');
    del.className = 'chip';
    del.textContent = '✕';
    del.title = '从图库移除';
    del.onclick = () => libRemoveSource(s.path);
    d.appendChild(del);
    if (!s.missing) {
      d.style.cursor = 'pointer';
      d.onclick = (ev) => {
        if (ev.target === del) return;
        libScan(s.path, s.recursive);
      };
    }
    roots.appendChild(d);
  });
  if (!LIB.sources || !LIB.sources.length) {
    roots.innerHTML += '<div class="bstat">图库是空的。导入一个照片' +
      '文件夹，或把文件夹拖到这里。</div>';
  }
  // 拖放：文件夹/文件都支持。文件夹走 webkitGetAsEntry 递归拿路径不可行
  // （浏览器不暴露本机路径），所以拖放只接受**文件**：直接读 File 对象
  // 上传成会话并加入当前图库列表；要按文件夹导入仍用按钮（那里有完整
  // 的本机路径）。
  roots.ondragover = (ev) => { ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; };
  roots.ondrop = (ev) => {
    ev.preventDefault();
    const files = [...(ev.dataTransfer.files || [])].filter(f =>
      /\.(jpe?g|png|tiff?|nef|cr2|cr3|arw|raf|dng|orf|rw2)$/i.test(f.name));
    if (!files.length) { log('拖入的没有可识别的照片'); return; }
    importDroppedFiles(files);
  };

  // 当前浏览的目录提示
  if (LIB.path) {
    const cur = document.createElement('div');
    cur.className = 'bstat';
    cur.textContent = '正在浏览：' + LIB.path;
    wrap.appendChild(cur);
  }

  // 网格
  const vis = libVisible();
  const grid = document.createElement('div');
  grid.id = 'libGrid';
  grid.style.cssText = 'display:grid;grid-template-columns:repeat(2,1fr);' +
    'gap:4px;margin-top:6px;max-height:52vh;overflow-y:auto';
  if (!vis.length) {
    grid.innerHTML = '<div class="bstat" style="grid-column:1/-1">' +
      (LIB.path ? '该文件夹没有照片' : '先导入一个照片文件夹') + '</div>';
  } else {
    grid.innerHTML = vis.map((it, i) => {
      const idx = LIB.items.indexOf(it);
      // 拖入的临时条目没有 path，用上传时返回的缩略图
      const thumbSrc = it.thumb ||
        ('/api/library/thumb?size=200&path=' + encodeURIComponent(it.path));
      return '<div class="libCell" data-i="' + idx + '" style="position:relative;' +
        'border:2px solid ' + (LIB.sel[idx] ? 'var(--gold)' : 'transparent') +
        ';border-radius:4px;overflow:hidden;cursor:pointer;background:#222">' +
        '<img loading="lazy" src="' + thumbSrc + '" style="width:100%;display:block;' +
        'aspect-ratio:3/2;object-fit:cover">' +
        '<span style="position:absolute;left:2px;bottom:2px;' +
        'background:rgba(0,0,0,.7);color:#ddd;font-size:9px;padding:0 3px;' +
        'border-radius:2px">' + (idx + 1) + '</span>' +
        // 已修角标：源路径在 done 表里 → 绿色 ✓（摄影师的"处理完没"一眼可见）
        (it.path && LIB.done && LIB.done[it.path] ?
          '<span style="position:absolute;right:2px;bottom:2px;' +
          'background:rgba(46,160,67,.92);color:#fff;font-size:10px;' +
          'padding:0 4px;border-radius:2px" title="已修：' +
          (LIB.done[it.path].out || '') + '">✓</span>' : '') +
        ((it.tags || []).length ? '<span style="position:absolute;right:2px;' +
          'top:2px;background:rgba(232,179,65,.9);color:#141005;font-size:8px;' +
          'padding:0 3px;border-radius:2px">' +
          (LIB_GROUP_LABEL[it.tags[0]] || it.tags[0]) + '</span>' : '') +
        '</div>';
    }).join('');
  }
  wrap.appendChild(grid);
  grid.querySelectorAll('.libCell').forEach(el => {
    const idx = parseInt(el.dataset.i, 10);
    el.onclick = ev => {
      if (ev.shiftKey || ev.ctrlKey) {
        LIB.sel[idx] = !LIB.sel[idx];
        renderLibrary();
        return;
      }
      // 单击：选中并展示元数据 + 智能预览（不跳走，看片流程不中断）；
      // 双击才打开成会话。原单击直接打开，挑图时每点一张就丢掉图库
      // 面板，与参考软件的"点选看信息"不符。
      LIB.cur = idx;
      grid.querySelectorAll('.libCell').forEach(x =>
        x.style.outline = '');
      el.style.outline = '2px solid var(--gold)';
      libShowInfo(LIB.items[idx]);
    };
    el.ondblclick = () => libOpen(idx);
  });

  // 智能预览 + 元数据：常驻在网格下方（参考软件在右栏，这里画布更窄，
  // 放底部一样达到"点一张看一张"的目的）
  const info = document.createElement('div');
  info.id = 'libInfo';
  info.innerHTML = '<div class="bstat" style="padding:6px 4px">' +
    '单击照片查看信息 · 双击打开编辑</div>';
  wrap.appendChild(info);

  // 底部操作
  const acts = document.createElement('div');
  acts.className = 'presetRow';
  const nsel = Object.values(LIB.sel).filter(Boolean).length;
  acts.innerHTML = '<span class="bstat" style="flex:1">已选 ' + nsel +
    ' 张（共 ' + LIB.items.length + ' 张）</span>' +
    '<button class="chip" id="libAll">全选</button>' +
    '<button class="chip" id="libNone">取消</button>' +
    (nsel ? '<button class="goldbtn" id="libToBatch">去批处理</button>' : '');
  wrap.appendChild(acts);
  $('libAll').onclick = () => {
    libVisible().forEach(it => { LIB.sel[LIB.items.indexOf(it)] = true; });
    renderLibrary();
  };
  $('libNone').onclick = () => { LIB.sel = {}; renderLibrary(); };
  const toBatch = $('libToBatch');
  if (toBatch) toBatch.onclick = () => {
    setMode('library');       // 保持图库模块内切分类，选中集不丢
    selectCat('批处理');
    log('已带 ' + nsel + ' 个选中文件进入批处理');
  };

  // ---- 我的分组（选片集）：存勾选 / 查看分组 ----
  const grp = document.createElement('div');
  grp.innerHTML = '<div class="groupTitle">我的分组</div>';
  const grow = document.createElement('div');
  grow.className = 'presetRow';
  grow.innerHTML = '<input type="text" id="libGrpName" ' +
    'placeholder="分组名（如：客户A选片）" style="flex:1">' +
    '<button class="chip" id="libGrpSave"' + (nsel ? '' : ' disabled') +
    '>存勾选</button>';
  grp.appendChild(grow);
  const gview = document.createElement('div');
  gview.className = 'presetRow';
  gview.innerHTML = '<select id="libGrpSel" style="flex:1;background:' +
    'var(--panel3);color:var(--text);border:1px solid var(--line);' +
    'border-radius:4px;font-size:11px"><option value="">查看分组…' +
    '</option></select><button class="chip" id="libGrpOpen" ' +
    'style="display:none">载入</button>';
  grp.appendChild(gview);
  const gstat = document.createElement('div');
  gstat.className = 'bstat';
  gstat.id = 'libGrpStat';
  grp.appendChild(gstat);
  wrap.appendChild(grp);

  $('libGrpSave').onclick = async () => {
    const name = ($('libGrpName').value || '').trim();
    const paths = Object.keys(LIB.sel).filter(i => LIB.sel[i])
      .map(i => (LIB.items[+i] || {}).path).filter(Boolean);
    if (!name) { log('先填分组名'); return; }
    if (!paths.length) { log('先勾选照片'); return; }
    try {
      const r = await fetch('/api/library/group_add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, paths: paths }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      log('分组「' + name + '」：新增 ' + j.added + ' 张，共 ' + j.total + ' 张');
      $('libGrpStat').textContent = '「' + name + '」共 ' + j.total + ' 张';
      libLoadGroups(gview);
    } catch (e) { log('保存分组失败：' + e.message); }
  };

  libLoadGroups(gview);
}

// 拖入的文件：逐个上传成会话，取缩略图加进当前图库列表。
// 浏览器安全模型拿不到拖入文件夹的本机路径，所以拖**文件夹**时只能
// 拿到文件对象——这里直接把照片加进列表（不落盘、不写来源），要按
// 文件夹持久导入用「导入文件夹」按钮（那里走服务端真实路径）。
async function importDroppedFiles(files) {
  setBusy(true);
  let ok = 0;
  for (const f of files.slice(0, 50)) {
    try {
      const fd = new FormData();
      fd.append('file', f);
      const up = await fetch('/api/upload', { method: 'POST', body: fd })
        .then(r => r.json());
      if (!up.session) continue;
      LIB.items.push({
        path: null, name: f.name, session: up.session,
        thumb: 'data:image/jpeg;base64,' + up.preview,
        size: f.size, mtime: Date.now() / 1000,
        sharp: 0, mean: 0, shadow: 0, clip: 0, phash: 0,
        tags: [],
      });
      ok++;
    } catch (e) { /* 单张失败不断流程 */ }
  }
  setBusy(false);
  renderLibrary();
  log('拖入 ' + ok + '/' + files.length + ' 张已加入图库列表' +
      '（临时，刷新后不在；按文件夹导入请用「导入文件夹」）');
}

async function libLoadGroups(container) {
  // 分组下拉：列出所有分组；选中后「载入」把成员变成勾选
  try {
    const j = await fetch('/api/library/groups').then(r => r.json());
    const sel = $('libGrpSel');
    if (!sel) return;
    const names = Object.keys(j.groups || {});
    sel.innerHTML = '<option value="">查看分组…</option>' +
      names.map(n => '<option value="' + n + '">' + n + '（' +
        j.groups[n].count + '）</option>').join('');
    sel.onchange = () => {
      const btn = $('libGrpOpen');
      btn.style.display = sel.value ? 'inline-block' : 'none';
    };
    $('libGrpOpen').onclick = async () => {
      const name = sel.value;
      if (!name) return;
      try {
        const m = await fetch('/api/library/group_members?name=' +
                              encodeURIComponent(name)).then(r => r.json());
        const set = new Set(m.paths || []);
        LIB.sel = {};
        LIB.items.forEach(function (it, i) {
          if (set.has(it.path)) LIB.sel[i] = true;
        });
        renderLibrary();
        log('分组「' + name + '」：命中图库 ' +
            Object.values(LIB.sel).filter(Boolean).length + ' 张');
      } catch (e) { log('载入分组失败：' + e.message); }
    };
  } catch (e) { /* 分组接口不可用不影响图库 */ }
}

async function libOpen(idx) {
  const it = LIB.items[idx];
  if (!it) return;
  setBusy(true);
  try {
    const r = await fetch('/api/library/open', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: it.path }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    S.session = j.session;
    S.srcPath = it.path || null;   // 已修闭环：记住源路径，导出后打标
    S.meta = { width: j.width, height: j.height,
               preview_width: j.width, preview_height: j.height };
    S.faces = j.faces || [];
    S.base = 'data:image/jpeg;base64,' + j.image;
    matteImg = null; eraseCanvas = null;
    $('dropzone').style.display = 'none';
    ['btnExport','btnErase','btnPicker','btnMatte','btnMatch','btnAuto',
     'btnHeal','btnStamp','btnUpscale'].forEach(id => {
       const e = $(id); if (e) e.disabled = false;
     });
    ZOOM.mode = 'fit';
    await drawBase();
    await refreshHistory();
    addThumb(S.base, j.name);
    setMode('retouch');
    log('已从图库打开：' + j.name);
  } catch (e) { log('打开失败：' + e.message); }
  finally { setBusy(false); }
}

// ============================================================
// 背景消除（纯色背景：证件照 / 影棚）
// ============================================================
// 参考软件的「图像美化 → 背景调整」有四项，都是纯色背景特有的缺陷：
// 穿帮（露出墙/地面）、瑕疵（污点/褶皱）、光影不均（打光偏）、色彩断层
// （8 位量化色带）。这四项能做好是因为**纯色背景的掩膜可以直接从颜色
// 算出来**，不依赖模型识别"这是背景"。
const BGC = { showthrough: 0, blemish: 0, even_light: 0, banding: 0,
              enhance: 0, colour: [1, 1, 1] };

function renderBgClean() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">背景消除 · 纯色背景专用</div>' +
    '<div class="bstat">前提是纯色背景（证件照/影棚）。掩膜从背景色直接算，' +
    '所以边缘干净、主体不会被改动。</div>';

  // ---- 背景调整：四项开关 ----
  const adj = document.createElement('div');
  adj.innerHTML = '<div class="groupTitle">背景调整</div>' +
    [['showthrough', '纯色背景祛穿帮', '露出墙/地面/灯架'],
     ['blemish', '纯色背景祛瑕疵', '污点/灰尘/小褶皱'],
     ['even_light', '纯色背景光影均匀', '打光一侧亮一侧暗'],
     ['banding', '纯色背景祛色彩断层', '大面积渐变的色带']]
      .map(([k, name, hint]) =>
        '<div class="batchRow" style="align-items:flex-start">' +
        '<label class="switchRow"><input type="checkbox" id="bgc_' + k + '"' +
        (BGC[k] ? ' checked' : '') + '><span>' + name + '</span></label>' +
        '<span style="color:var(--dim);font-size:10px;flex:1;text-align:right">' +
        hint + '</span></div>').join('');
  wrap.appendChild(adj);

  // ---- 背景增强 ----
  const enh = document.createElement('div');
  enh.innerHTML = '<div class="sl"><div class="hdr">' +
    '<span class="name">背景增强</span><span class="val" id="bgc_enh_v">' +
    BGC.enhance + '</span></div>' +
    '<input type="range" id="bgc_enh" min="0" max="100" step="1" value="' +
    BGC.enhance + '"></div>';
  wrap.appendChild(enh);

  // ---- 背景替换（证件照换底色）----
  const rep = document.createElement('div');
  rep.innerHTML = '<div class="groupTitle">换背景底色</div>' +
    '<div class="presetRow" id="bgcSwatches">' +
    [['#ffffff', '白底'], ['#2f6fd0', '蓝底'], ['#d02f2f', '红底'],
     ['#8f8f96', '灰底'], ['#1b1b1f', '黑底']]
      .map(([c, n]) => '<button class="chip bgcSw" data-c="' + c + '">' +
        '<span style="display:inline-block;width:9px;height:9px;' +
        'border-radius:2px;background:' + c + ';margin-right:4px;' +
        'border:1px solid #555"></span>' + n + '</button>').join('') +
    '</div>' +
    '<div class="batchRow"><label class="switchRow">' +
    '<input type="checkbox" id="bgcKeepLight" checked>' +
    '<span>保留原背景明暗</span></label></div>';
  wrap.appendChild(rep);

  // ---- AI 祛路人（确定性管线：双尺度人脸 -> 主体判定 -> LaMa）----
  const pb = document.createElement('div');
  pb.innerHTML = '<div class="groupTitle">AI 祛路人</div>' +
    '<div class="bstat">检测背景里的其他人并抹掉（双尺度人脸检测 + ' +
    '主体重叠判定 + LaMa 填充）。主体不会被改动。</div>';
  const pbRow = document.createElement('div');
  pbRow.className = 'presetRow';
  pbRow.innerHTML = '<button class="goldbtn" id="bgcPassersby">祛除路人</button>' +
    '<span class="bstat" id="bgcPbInfo" style="flex:1"></span>';
  pb.appendChild(pbRow);
  wrap.appendChild(pb);

  // ---- 操作 ----
  const acts = document.createElement('div');
  acts.className = 'presetRow';
  acts.innerHTML = '<button class="goldbtn" id="bgcApply">应用</button>' +
    '<button class="chip" id="bgcZero">归零</button>';
  wrap.appendChild(acts);

  const bind = (id, fn) => { const e = $(id); if (e) e.onchange = fn; };
  ['showthrough', 'blemish', 'even_light', 'banding'].forEach(k => {
    bind('bgc_' + k, ev => {
      BGC[k] = ev.target.checked ? 1.0 : 0.0;
      requestBgPreview();
    });
  });
  const enhEl = $('bgc_enh');
  if (enhEl) {
    enhEl.oninput = () => {
      BGC.enhance = parseFloat(enhEl.value);
      $('bgc_enh_v').textContent = BGC.enhance;
      requestBgPreview();
    };
  }
  wrap.querySelectorAll('.bgcSw').forEach(b => {
    b.onclick = () => {
      const hex = b.dataset.c;
      BGC.colour = [parseInt(hex.slice(1, 3), 16) / 255,
                    parseInt(hex.slice(3, 5), 16) / 255,
                    parseInt(hex.slice(5, 7), 16) / 255];
      wrap.querySelectorAll('.bgcSw').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      applyBgReplace();
    };
  });
  $('bgcApply').onclick = () => applyBgClean(true);
  $('bgcPassersby').onclick = async () => {
    if (!S.session) { log('先载入图片'); return; }
    const btn = $('bgcPassersby'), info = $('bgcPbInfo');
    btn.disabled = true;
    if (info) info.textContent = '检测并消除中…（LaMa 填充，约 10–60s）';
    setBusy(true);
    try {
      const r = await fetch('/api/remove_passersby', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: S.session, commit: true }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      const i = j.info || {};
      // 超范围引导：祛路人只支持零散路人（用户确认的口径），多紧挨
      // 路人是模型能力边界，如实说明。
      if (i.guidance) {
        if (info) info.textContent = '超出支持范围';
        alert(i.guidance);
        return;
      }
      if (i.removed > 0) {
        S.base = 'data:image/jpeg;base64,' + j.image;
        await drawBase(); await refreshHistory();
        log('AI 祛路人：消除 ' + i.removed + ' 人（检出 ' +
            (i.detected || 0) + '）');
      } else if (i.error) {
        log('AI 祛路人失败：' + i.error);
      } else {
        log('AI 祛路人：没有需要消除的路人（检出 ' +
            (i.detected || 0) + ' 人）');
      }
      if (info) info.textContent = i.removed > 0
        ? '已消除 ' + i.removed + ' 人'
        : '未发现可消除的路人';
    } catch (e) {
      log('AI 祛路人失败：' + e.message);
      if (info) info.textContent = '失败';
    }
    finally { btn.disabled = false; setBusy(false); }
  };
  $('bgcZero').onclick = () => {
    BGC.showthrough = BGC.blemish = BGC.even_light = BGC.banding = 0;
    BGC.enhance = 0;
    renderBgClean();
  };
}

let bgcTimer = null;
function requestBgPreview() {
  clearTimeout(bgcTimer);
  bgcTimer = setTimeout(() => applyBgClean(false), 260);
}

async function applyBgClean(commit) {
  if (!S.session) { log('先载入图片'); return; }
  const any = BGC.showthrough || BGC.blemish || BGC.even_light ||
              BGC.banding || BGC.enhance;
  if (!any) { log('背景消除：未选择任何项'); return; }
  setBusy(true);
  try {
    const r = await fetch('/api/bgclean', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session,
                             showthrough: BGC.showthrough,
                             blemish: BGC.blemish,
                             even_light: BGC.even_light,
                             banding: BGC.banding,
                             enhance: BGC.enhance,
                             commit: !!commit }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    if (commit) {
      S.base = 'data:image/jpeg;base64,' + j.image;
      await drawBase(); await refreshHistory();
      const i = j.info || {};
      if (i.skipped) {
        // 背景不纯时如实告诉用户为什么没做，而不是悄悄无效
        log('背景消除未执行：' + i.skipped);
        return;
      }
      log('背景消除已应用：背景覆盖 ' +
          Math.round((i.bg_coverage || 0) * 100) + '%' +
          ' · 纯度 ' + Math.round((i.purity || 0) * 100) + '%' +
          (i.showthrough && i.showthrough.patched
            ? ' · 补穿帮 ' + i.showthrough.patched + ' 处' : '') +
          (i.blemish && i.blemish.fixed
            ? ' · 修瑕疵 ' + i.blemish.fixed + ' px' : ''));
    }
  } catch (e) { log('背景消除失败：' + e.message); }
  finally { setBusy(false); }
}

async function applyBgReplace() {
  if (!S.session) { log('先载入图片'); return; }
  const keep = $('bgcKeepLight') ? $('bgcKeepLight').checked : true;
  setBusy(true);
  try {
    const r = await fetch('/api/bgreplace', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, colour: BGC.colour,
                             keep_lighting: keep, commit: true }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    S.base = 'data:image/jpeg;base64,' + j.image;
    await drawBase(); await refreshHistory();
    log('背景已替换');
  } catch (e) { log('换背景失败：' + e.message); }
  finally { setBusy(false); }
}

async function renderHistory() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">历史记录 · 点任意一步跳回</div>';
  if (!S.session) {
    wrap.innerHTML += '<div class="bstat">先载入图片。</div>';
    return;
  }
  let j;
  try {
    j = await fetch('/api/history/' + encodeURIComponent(S.session))
      .then(r => r.json());
  } catch (e) { wrap.innerHTML += '<div class="bstat">读取失败</div>'; return; }

  const strip = document.createElement('div');
  strip.style.cssText = 'display:flex;flex-direction:column;gap:4px';
  strip.innerHTML = j.steps.map(s =>
    '<div class="histRow' + (s.current ? ' active' : '') +
    '" data-i="' + s.index + '" style="display:flex;align-items:center;' +
    'gap:8px;padding:4px 6px;border-radius:5px;cursor:pointer;' +
    (s.current ? 'background:rgba(232,179,65,.12);' : '') + '">' +
    '<img src="/api/history/' + encodeURIComponent(S.session) + '/thumb/' +
    s.index + '" style="width:52px;height:36px;object-fit:cover;' +
    'border-radius:3px;background:#222">' +
    '<span style="font-size:11px;flex:1;' +
    (s.current ? 'color:var(--gold)' : 'color:var(--dim)') + '">' +
    (s.index + 1) + '. ' + s.label + '</span>' +
    (s.current ? '<span style="color:var(--gold);font-size:10px">当前</span>'
               : '') + '</div>').join('');
  wrap.appendChild(strip);
  strip.querySelectorAll('.histRow').forEach(el => {
    el.onclick = async () => {
      const idx = parseInt(el.dataset.i, 10);
      setBusy(true);
      try {
        const r = await fetch('/api/history/' + encodeURIComponent(S.session) +
          '/goto', { method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     body: JSON.stringify({ index: idx }) });
        const g = await r.json();
        if (!r.ok) throw new Error(g.detail || r.statusText);
        S.base = 'data:image/jpeg;base64,' + g.image;
        await drawBase();
        renderHistory();
        log('已回到第 ' + (idx + 1) + ' 步：' +
            (j.steps[idx] ? j.steps[idx].label : ''));
      } catch (e) { log('跳转失败：' + e.message); }
      finally { setBusy(false); }
    };
  });
  const foot = document.createElement('div');
  foot.className = 'bstat';
  foot.style.marginTop = '8px';
  foot.innerHTML = '共 ' + j.steps.length + ' 步 · 当前第 ' + (j.index + 1) +
    ' 步 · <span style="color:var(--dim)">快照式撤销：' +
    '每步存 8 位 PNG，撤销不会累积误差</span>';
  wrap.appendChild(foot);
}

  const defs = [
    ['hue', '色相', -45, 45, 1], ['sat', '饱和', -100, 100, 1],
    ['lum', '明度', -100, 100, 1], ['width', '窗口宽度', 0, 100, 1],
    ['feather', '羽化', 5, 100, 1],
  ];
  defs.forEach(function (d0) {
    const key = d0[0], label = d0[1], lo = d0[2], hi = d0[3], step = d0[4];
    const val = WHEEL_PARAMS[key];
    const isPct = (key === 'width' || key === 'feather');
    const d = document.createElement('div');
    d.className = 'sl';
    d.innerHTML =
      '<div class="hdr"><span class="name">' + label + '</span>' +
      '<span class="val" id="w_' + key + '">' +
      (isPct ? Math.round(val * 100) : fmt(val, step)) + '</span></div>' +
      '<input type="range" id="w_' + key + '" min="' + lo + '" max="' + hi +
      '" step="' + step + '" value="' + (isPct ? val * 100 : val) + '" />';
    wrap.appendChild(d);
  });
  wrap.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.id.slice(2);
      let v = parseFloat(inp.value);
      if (k === 'width' || k === 'feather') v = v / 100;
      WHEEL_PARAMS[k] = v;
      const el = $('w_' + k);
      el.textContent = (k === 'width' || k === 'feather')
        ? Math.round(v * 100) : fmt(v, 1);
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(wheelPreview, 140);
    });
  });
  const bar = document.createElement('div');
  bar.className = 'presetRow';
  bar.innerHTML = '<button class="chip" id="wheelReset">归零</button>' +
    '<button class="goldbtn" id="wheelApply">应用到图片</button>';
  wrap.appendChild(bar);
  $('wheelReset').onclick = () => {
    WHEEL_PARAMS = { hue: 0, sat: 0, lum: 0, width: 0.5, feather: 0.6 };
    renderWheel(); wheelPreview();
  };
  $('wheelApply').onclick = async () => {
    setBusy(true);
    try {
      const j = await wheelPreview(true);
      if (j) {
        S.base = 'data:image/jpeg;base64,' + j.image;
        matteImg = null;
        await drawBase();
        log('色轮已应用：' + WHEEL_FAMILY);
        WHEEL_PARAMS = { hue: 0, sat: 0, lum: 0, width: 0.5, feather: 0.6 };
        renderWheel();
      }
    } catch (e) { log('应用失败：' + e.message); }
    setBusy(false);
  };
  wheelPreview();
}
async function wheelPreview(apply) {
  if (!S.session) return null;
  const j = await fetch('/api/wheel', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session: S.session, family: WHEEL_FAMILY,
      hue: WHEEL_PARAMS.hue, sat: WHEEL_PARAMS.sat, lum: WHEEL_PARAMS.lum,
      width: WHEEL_PARAMS.width, feather: WHEEL_PARAMS.feather })
  }).then(r => r.json());
  if (j.detail) { log('色轮失败：' + j.detail); return null; }
  if (!apply) {
    const im = await loadImage('data:image/jpeg;base64,' + j.image);
    const c = $('canvas');
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  }
  return j;
}

async function doCull(dir) {
  if (!S.session) { log('先载入图片'); return; }
  setBusy(true);
  try {
    const body = dir ? { paths: [dir] } : { sessions: [S.session] };
    const j = await fetch('/api/cull', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(r => r.json());
    if (j.detail) throw new Error(j.detail);
    CULL.results = j.results;
    CULL.pick = {}; CULL.reject = {};
    renderCullResults(j);
    log('挑图完成，共 ' + j.count + ' 张');
  } catch (e) { log('挑图失败：' + e.message); }
  finally { setBusy(false); }
}

const CULL = { results: [], pick: {}, reject: {} };

function renderCullResults(j) {
  const res = $('cullResult');
  if (!res) return;
  res.innerHTML = '<div class="groupTitle">结果（' + j.count + ' 张，按分数排序）</div>' +
    '<div class="cullGrid" id="cullGrid"></div>' +
    '<div class="bstat" id="cullStat"></div>' +
    '<div class="presetRow"><button class="goldbtn" id="cullPick">' +
    '标星最高 N 张</button></div>';
  const grid = $('cullGrid');
  j.results.slice(0, 24).forEach((it, i) => {
    const name = (it.path.split(/[\\/]/).pop()) || it.path;
    const d = document.createElement('div');
    d.className = 'cullThumb';
    d.dataset.i = i;
    d.title = name + '\n' + JSON.stringify(it.scores || {});
    const thumb = it.thumb
      ? 'data:image/jpeg;base64,' + it.thumb
      : '';
    d.innerHTML = (thumb ? '<img src="' + thumb + '">'
      : '<div style="aspect-ratio:3/2;background:var(--panel3);' +
        'display:flex;align-items:center;justify-content:center;' +
        'font-size:10px;color:var(--dim)">无缩略图</div>') +
      '<span class="sc">' + it.overall.toFixed(3) + '</span>' +
      (it.reasons && it.reasons.length
        ? '<span class="flag">' + it.reasons.join(',') + '</span>' : '');
    d.onclick = () => {
      // click cycles: none -> pick -> reject -> none
      const cur = CULL.pick[i] ? 'pick' : (CULL.reject[i] ? 'reject' : 'none');
      CULL.pick[i] = false; CULL.reject[i] = false;
      if (cur === 'none') CULL.pick[i] = true;
      else if (cur === 'pick') CULL.reject[i] = true;
      d.classList.toggle('pick', !!CULL.pick[i]);
      d.classList.toggle('rej', !!CULL.reject[i]);
      updateCullStat(j);
    };
    grid.appendChild(d);
  });
  const pk = $('cullPick');
  if (pk) pk.onclick = () => {
    const n = parseInt(prompt('标星前几名？', '5') || '0', 10);
    if (!n) return;
    CULL.pick = {}; CULL.reject = {};
    j.results.slice(0, n).forEach((_, i) => { CULL.pick[i] = true; });
    j.results.slice(n).forEach((_, k) => { CULL.reject[k + n] = true; });
    grid.querySelectorAll('.cullThumb').forEach(d => {
      const i = parseInt(d.dataset.i, 10);
      d.classList.toggle('pick', !!CULL.pick[i]);
      d.classList.toggle('rej', !!CULL.reject[i]);
    });
    updateCullStat(j);
  };
  updateCullStat(j);
}

function updateCullStat(j) {
  const el = $('cullStat');
  if (!el) return;
  const p = Object.values(CULL.pick).filter(Boolean).length;
  const r2 = Object.values(CULL.reject).filter(Boolean).length;
  const top = CULL.results[0];
  el.innerHTML = '已选 ' + p + ' 张 · 已弃 ' + r2 + ' 张' +
    (top ? '<br>最高分：' + ((top.path.split(/[\\/]/).pop()) || '-') +
      ' ' + top.overall.toFixed(3) : '') +
    '<br><span style="color:var(--dim)">点击缩略图循环：选中 → 弃用 → 取消</span>';
}
