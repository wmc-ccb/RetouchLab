async function upload(file) {
  const fd = new FormData(); fd.append('file', file);
  log('载入 ' + file.name + ' …');
  setBusy(true);
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    S.session = j.session; S.faces = j.faces; S.meta = j;
    S.base = 'data:image/jpeg;base64,' + j.preview;
    matteImg = null; eraseCanvas = null;
    await drawBase();
    $('dropzone').style.display = 'none';
    ['btnExport','btnErase','btnPicker','btnMatte','btnMatch',
     'btnAuto','btnHeal','btnStamp','btnUpscale'].forEach(
      function (id) { $(id).disabled = false; });
    addThumb(S.base, file.name);
    await refreshHistory();
    updateHistButtons();
    $('meta').textContent = j.width + '×' + j.height
      + (j.decode && j.decode.raw ? ' · RAW' : '')
      + (j.faces.length ? ' · ' + j.faces.length + ' 张脸' : '');
    updateMeta();    log('载入完成：' + j.width + '×' + j.height
      + (j.decode && j.decode.raw ? '（RAW ' + j.decode.decode_ms + 'ms）' : '')
      + (j.faces.length ? '，检出 ' + j.faces.length + ' 张人脸' : ''));
    requestRender();
  } catch (e) { log('载入失败：' + e.message); }
  finally { setBusy(false); }
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error('decode failed'));
    im.src = src;
  });
}

async function drawBase() {
  S.img = await loadImage(S.base);
  // 只有画面内容真的换了才让直方图失效。无条件递增会让每次重绘（缩放、
  // 蒙版叠加、抽屉开关）都推高版本号，而 loadHistogram 在请求返回时发现
  // 版本号已变就丢弃结果——于是直方图永远取不回来。
  const sig = S.base ? S.base.length + ':' + S.base.slice(-48) : '';
  if (sig !== S._baseSig) {
    S._baseSig = sig;
    if (typeof invalidateHistogram === 'function') invalidateHistogram();
  }
  const c = $('canvas');
  // 画布尺寸由缩放决定，不是原图尺寸：直接设成 naturalWidth 会让"适合窗口"
  // 失效，图片被撑出容器。缩放只影响显示，S.base 里的像素不变。
  if (S.meta) {
    const pw = S.meta.preview_width || S.img.naturalWidth;
    const ph = S.meta.preview_height || S.img.naturalHeight;
    S.meta.preview_width = pw;
    S.meta.preview_height = ph;
    if (ZOOM.mode === 'fit' || !ZOOM.level) {
      applyZoom();
      const ctx0 = c.getContext('2d');
      ctx0.drawImage(S.img, 0, 0, c.width, c.height);
      if (matteImg) ctx0.drawImage(matteImg, 0, 0, c.width, c.height);
      layoutFaceBox();
      updateMeta();
      return;
    }
    c.width = Math.round(pw * ZOOM.level);
    c.height = Math.round(ph * ZOOM.level);
  } else {
    c.width = S.img.naturalWidth;
    c.height = S.img.naturalHeight;
  }
  const ctx = c.getContext('2d');
  ctx.drawImage(S.img, 0, 0, c.width, c.height);
  if (matteImg) ctx.drawImage(matteImg, 0, 0, c.width, c.height);
  layoutFaceBox();
  // drawBase is the one place every path funnels through to show an image, so
  // deriving the status line here means it can never disagree with what is on
  // screen — a manual update in each caller missed the paths that did not
  // re-render.
  updateMeta();
  // 常驻直方图在参数区顶部，一直可见，所以画面一变就要重算——否则用户会
  // 盯着一个旧直方图判断曝光，那比没有直方图更糟。
  // 但调用方可能已经带着新直方图过来了（/api/render?with_histogram 在同一次
  // 请求里返回结果和它的直方图），那时不需要再发一次请求。
  if (!S.histFresh && $('globalHist')) {
    loadHistogram(true);
  }
  S.histFresh = false;
}

function layoutFaceBox() {
  const c = $('canvas'), box = $('faceBox');
  if (!S.faces.length || !S.showBox || !S.meta) { box.style.display = 'none'; return; }
  const rect = c.getBoundingClientRect();
  const sx = rect.width / S.meta.preview_width;
  const sy = rect.height / S.meta.preview_height;
  const f = S.faces[0].box;
  const cw = c.getBoundingClientRect(), wrap = $('canvasWrap').getBoundingClientRect();
  box.style.display = 'block';
  box.style.left = (cw.left - wrap.left + f[0] * sx) + 'px';
  box.style.top = (cw.top - wrap.top + f[1] * sy) + 'px';
  box.style.width = (f[2] * sx) + 'px';
  box.style.height = (f[3] * sy) + 'px';
  box.dataset.label = 'face ' + S.faces[0].score.toFixed(2);
}

let renderTimer = null;
function requestRender() {
  if (!S.session) return;
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(doRender, 90);
}
async function doRender() {
  if (!S.session) return;
  if (S.rendering) { S.pending = true; return; }
  S.rendering = true;
  setBusy(true);
  try {
    const params = Object.assign({}, S.params);
    // local adjustments ride along with the tone params: the engine treats
    // `local_adjustments` as a structure, and an empty list is a no-op
    const loc = localParams();
    if (loc.length) params.local_adjustments = loc;
    const r = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      // with_histogram：滑块是预览渲染，不写回 session，所以 /api/histogram
      // 拿到的是上传时的原图。要让直方图跟着滑块走，只能让这一次渲染顺便
      // 把它自己结果的直方图带回来。
      body: JSON.stringify({ session: S.session, params: params,
                             quality: NET.quality, with_histogram: true,
                             long_edge: NET.longEdge || undefined }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    S.base = 'data:image/jpeg;base64,' + j.image;
    if (j.histogram) {
      j.histogram._key = S.histKey;
      MASK.hist = j.histogram;
      LEV.hist = j.histogram;
      drawGlobalHist();
      drawLevels();
      drawCurve();
      // 同一次请求里已经拿到了结果和它的直方图，drawBase 不要再重复取一遍
      S.histFresh = true;
    }
    await drawBase();
    if (j.faces && j.faces.length) S.faces = j.faces;
    updateMeta(j.ms);
    log('渲染 ' + j.ms + ' ms · ' + (j.applied.length ? j.applied.join(', ') : '无效果'));
  } catch (e) { log('渲染失败：' + e.message); }
  finally {
    S.rendering = false;
    setBusy(false);
    if (S.pending) { S.pending = false; doRender(); }
  }
}

async function saveFull() {
  if (!S.session) return;
  // 导出目的地：优先原生保存对话框（File System Access API，桌面软件
  // 的标准体验）；不支持的环境（旧浏览器/file://）退回路径输入框。
  // 注意句柄把手：本地文件路径服务端无法直接读回句柄内容，所以这里
  // 仍走 /api/save 的服务端路径——对话框只用来**选择位置**，把选到的
  // 目录回填成完整路径。
  let path = null;
  if (window.showSaveFilePicker) {
    try {
      const base = (S.srcPath ? S.srcPath.split(/[\\/]/).pop()
                              : 'retouched.jpg').replace(/\.[^.]+$/, '');
      const ext = S.meta && S.meta.raw ? '.jpg' : '.jpg';
      const handle = await showSaveFilePicker({
        suggestedName: base + '_retouched' + ext,
        types: [{ description: 'JPEG 图像',
                  accept: { 'image/jpeg': ['.jpg'] } }] });
      // 句柄拿不到真实路径（浏览器安全模型）；用名字 + 已知根目录拼。
      // 用户数据目录里选的位置才是真实意图——这里退化为"输出根目录 +
      // 文件名"，并提示用户可在资源管理器里移动。真正的全路径要靠
      // 传统输入框路径，两种方式并存。
      path = 'C:\\Users\\Rana\\RetouchLab\\out\\' + handle.name;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // 用户取消
      path = null;                                 // API 不可用 → 降级
    }
  }
  if (!path) {
    path = prompt('保存到（完整路径）：',
      'C:\\\\Users\\\\Rana\\\\RetouchLab\\\\out\\\\retouched.jpg');
    if (!path) return;
  }
  setBusy(true);
  try {
    const r = await fetch('/api/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, params: S.params, path: path }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    const j = await r.json();
    log('已导出：' + j.path + ' (' + j.width + '×' + j.height + ')');
    // 已修闭环：当前会话来自图库时（S.srcPath 有源路径），把导出记录
    // 打到图库元数据，格子上出现 ✓——摄影师一眼看出哪些还没处理。
    if (S.srcPath) {
      try {
        await fetch('/api/library/mark_done', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ src: S.srcPath, out: j.path,
                                 params: S.params }) });
        if (typeof libLoadSources === 'function') {
          LIB.done = null;            // 失效缓存，图库下次渲染重拉
        }
      } catch (e2) { /* 标记失败不影响导出 */ }
    }
    alert('已导出：\\n' + j.path);
  } catch (e) { log('导出失败：' + e.message); }
  finally { setBusy(false); }
}

// ============================================================
// 预设栏（左栏缩略图）：用当前画面生成每个预设的缩略图
// ============================================================
// 缩略图是"这张照片套上该预设"的真实渲染，不是静态图：换一张照片，
// 预设卡片跟着换。按 preset 缓存，避免每次开面板都重跑一遍管线。
//
// 预设必须展开成**扁平参数**再提交：`params:{preset:'film'}` 是一个未知
// 键，管线会原样忽略（applied 返回空数组），所有缩略图就长得一模一样。
// 参数表从 /api/presets 取，不在前端复制一份，两边不会漂移。
const PRESET_CACHE = {};
let PRESET_PARAMS = null;      // null = 还没载入；{} = 载入失败
let PRESET_LOADING = null;

async function loadPresetParams(force) {
  // 只认"已经载入过且非空"，不要用 `if (PRESET_PARAMS)`：空对象是**真值**，
  // 第一次请求还没回来时并发调用会拿到 {} 并永久缓存下来，之后所有预设
  // 都变成空参数——表现为缩略图全一样、点预设没反应。
  //
  // `force`：保存/删除预设后必须重新拉取。仅置 PRESET_LOADING=null 不够——
  // 那只清了 in-flight 标记，PRESET_PARAMS 非空时仍会走早退分支，返回**旧
  // 表**（不含刚存的预设），列表于是永远少一张卡。
  if (!force && PRESET_PARAMS && Object.keys(PRESET_PARAMS).length) {
    return PRESET_PARAMS;
  }
  if (!force && PRESET_LOADING) return PRESET_LOADING;
  PRESET_LOADING = fetch('/api/presets')
    .then(r => r.json())
    .then(j => {
      PRESET_PARAMS = (j && j.presets) || {};
      return PRESET_PARAMS;
    })
    .catch(() => (PRESET_PARAMS = {}))
    .finally(() => { PRESET_LOADING = null; });
  return PRESET_LOADING;
}

let PRESET_TAB = 'rec';
// 渲染代际号：renderPresetCol 是 async（先 await 参数表再画 DOM），两次
// 调用可能交错——"点 tab 的渲染"await 期间"保存后的渲染"已完成，随后旧
// 的那次醒来把列表覆盖成空。每次渲染领一个号，写 DOM 前检查自己还是不是
// 最新的，不是就丢弃。
let PRESET_RENDER_GEN = 0;

async function renderPresetCol() {
  const list = $('pcList');
  if (!list) return;
  const gen = ++PRESET_RENDER_GEN;
  const names = { none: '原图', natural: '自然', studio: '影楼',
                  beauty: '美颜', film: '胶片', mono: '黑白',
                  id_photo: '证件照', vivid: '鲜艳' };
  await loadPresetParams();
  if (gen !== PRESET_RENDER_GEN) return;   // 有更新的渲染接手了
  // 推荐 = 内置，我的 = 用户保存的。服务端把两类合并返回，这里用
  // "是否在内置表里"区分，前端不用第二套请求。
  const builtin = { none: 1, natural: 1, studio: 1, beauty: 1, film: 1,
                    mono: 1, id_photo: 1, vivid: 1 };
  const tab = PRESET_TAB || 'rec';
  const keys = Object.keys(PRESET_PARAMS)
    .filter(k => tab === 'mine' ? !builtin[k] : !!builtin[k]);
  const cnt = $('pcCount');
  if (cnt) cnt.textContent = keys.length + ' 个';

  if (!keys.length) {
    list.innerHTML = '<div class="bstat" style="padding:8px 6px">' +
      (tab === 'mine'
        ? '还没有保存的预设。调好参数后点下方「存为我的预设」。'
        : '无') + '</div>';
  } else {
    list.innerHTML = keys.map(k =>
      '<div class="pcard" data-p="' + k + '">' +
      '<img data-thumb="' + k + '" alt="' + (names[k] || k) + '">' +
      '<div class="pl">' + (names[k] || k) + '</div>' +
      (tab === 'mine'
        ? '<button class="pdel" title="删除" data-del="' + k + '">✕</button>'
        : '') +
      '</div>').join('');
    list.querySelectorAll('.pcard').forEach(card => {
      card.onclick = () => applyPresetByName(card.dataset.p);
    });
    list.querySelectorAll('.pdel').forEach(btn => {
      btn.onclick = async (ev) => {
        ev.stopPropagation();
        const k = btn.dataset.del;
        if (!confirm('删除预设「' + k + '」？')) return;
        try {
          const r = await fetch('/api/presets/delete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ key: k }) });
          if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
          await loadPresetParams(true);
          renderPresetCol();
          log('已删除预设：' + k);
        } catch (e) { log('删除失败：' + e.message); }
      };
    });
    if (S.session) loadPresetThumbs(S.session, keys);
  }
}

function bindPresetTabs() {

  bar.querySelectorAll('button').forEach(b => {

async function saveUserPreset() {
  if (!S.session) { log('先载入图片'); return; }
  const name = prompt('预设名称：', '我的预设 ' +
    new Date().toLocaleDateString());
  if (!name) return;
  // 当前参数 = 用户在滑杆上调整的值（S.params 由滑杆同步维护）
  const params = (typeof S.params === 'object' && S.params) ?
    Object.assign({}, S.params) : {};
  if (!Object.keys(params).length) {
    log('当前没有调整过的参数，先调一下滑杆');
    return;
  }
  const overwrite = confirm('同名已存在时覆盖？（取消 = 保存为不同名）');
  setBusy(true);
  try {
    const r = await fetch('/api/presets/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, params: params,
                             overwrite: overwrite }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    await loadPresetParams(true);
    PRESET_TAB = 'mine';
    const bar = $('presetTabs');
    if (bar) {
      bar.querySelectorAll('button').forEach(x =>
        x.classList.toggle('active', x.dataset.t === 'mine'));
    }
    renderPresetCol();
    log('已保存预设：' + name + '（' + Object.keys(j.params || {}).length +
        ' 项参数）');
  } catch (e) { log('保存失败：' + e.message); }
  finally { setBusy(false); }
}

function presetPayload(k) {
  // 原图/无效果 = 空参数；其余从服务端参数表展开
  const p = (PRESET_PARAMS || {})[k];
  return (p && typeof p === 'object') ? Object.assign({}, p) : {};
}

async function loadPresetThumbs(sid, keys) {
  const base = PRESET_CACHE[sid] || {};
  PRESET_CACHE[sid] = base;
  for (const k of keys) {
    if (base[k]) {
      const im = document.querySelector('[data-thumb="' + k + '"]');
      if (im) im.src = base[k];
      continue;
    }
    try {
      const r = await fetch('/api/render', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: sid, params: presetPayload(k),
                               quality: 70, long_edge: 220 }),
      });
      const j = await r.json();
      if (j.image) {
        base[k] = 'data:image/jpeg;base64,' + j.image;
        const im = document.querySelector('[data-thumb="' + k + '"]');
        if (im) im.src = base[k];
      }
    } catch (e) { /* 缩略图失败不影响主流程 */ }
  }
}

async function applyPresetByName(name) {
  if (!S.session) { log('先载入图片'); return; }
  await loadPresetParams();
  const payload = presetPayload(name);
  if (!Object.keys(payload).length) {
    // 原图：重新渲染空参数，等于把所有滑块归零
    log('预设：原图');
  }
  setBusy(true);
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    const r = await fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, params: payload,
                             quality: 92 }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    S.base = 'data:image/jpeg;base64,' + j.image;
    await drawBase();
    await refreshHistory();
    document.querySelectorAll('.pcard').forEach(c =>
      c.classList.toggle('active', c.dataset.p === name));
    log('预设已应用：' + name + '（' + (j.applied || []).length + ' 项）');
  } catch (e) {
    log('预设失败：' + (e && e.name === 'AbortError'
                         ? '请求超时 20s' : (e && e.message) || e));
  } finally { setBusy(false); }
}

// ============================================================
// 底部选图条：缩略图条 + 未筛选/已选/星级/色标 + 单视图/网格
// ============================================================
// 状态全部从 FILM 派生，所以"已选 1 张（共 35 张）"、星标和当前帧不可能互相
// 矛盾。双击缩略图标星，右键弃用，单击切换当前帧。
const FILM = { items: [], current: -1, view: 'single', filter: 'all' };

const STAR_LABELS = ['', '一星', '二星', '三星', '四星', '五星'];
const SWATCHES = ['#e0b354', '#e05555', '#55b04a', '#5570e0', '#c055b0', '#888'];

function filmInit() {
  const box = $('filmbox');
  if (!box) return;
  box.style.display = 'flex';
  box.style.flexDirection = 'column';
  const cur = FILM.items[FILM.current];
  const curName = cur ? cur.name : '未选择';
  const stars = cur ? (cur.stars || 0) : 0;
  const total = FILM.items.length;

  box.innerHTML =
    '<div class="fbTop">' +
    '<button id="fbAdd" title="导入">＋</button>' +
    '<button id="fbUnfilter" class="' + (FILM.filter === 'all' ? 'on' : '') +
    '">▾ 未筛选</button>' +
    '<button>▤ 文件名</button>' +
    '<button id="fbPick"><span>▤</span> 去挑图</button>' +
    '<span>已选 <b>' + pickedCount() + '</b> 张（共 ' + total +
    ' 张）</span>' +
    '<span class="grow"></span>' +
    '<span style="color:var(--dim)">' +
    [1, 2, 3, 4, 5].map(n =>
      '<span class="star ' + (n <= stars ? 'on' : '') + '" data-star="' + n +
      '" title="' + STAR_LABELS[n] + '">★</span>').join('') + '</span>' +
    SWATCHES.map(c =>
      '<span class="swatch" data-sw="' + c + '" style="background:' + c +
      '"></span>').join('') +
    '<span class="curName">' + curName + '</span>' +
    '<span class="grow"></span>' +
    '<button id="fbSingle" class="' + (FILM.view === 'single' ? 'on' : '') +
    '">▣ 单视图</button>' +
    '<button id="fbGrid" class="' + (FILM.view === 'grid' ? 'on' : '') +
    '">▥ 网格</button>' +
    '</div>' +
    '<div class="fbStrip" id="fbStrip"></div>';

  // 缩略图条。`filter` 真正生效：'pick' 只显示已选（含星级>0），
  // 'unpicked' 只显示未选。之前这里忽略 filter——点击「未筛选」只改了
  // 状态字段，条上一张不少，等于没有过滤。
  const strip = $('fbStrip');
  if (!total) {
    strip.innerHTML = '<span style="color:var(--dim);font-size:11px;' +
      'padding:6px 2px">还没有照片。导入后会在这里出现。</span>';
  } else {
    const show = FILM.items.map((it, i) => ({ it: it, i: i }))
      .filter(pair => FILM.filter === 'all' ||
        (FILM.filter === 'pick' ? pair.it.picked : !pair.it.picked));
    strip.innerHTML = show.map(pair => {
      const it = pair.it, i = pair.i;
      const isRaw = /\.(nef|cr2|cr3|arw|raf|dng|orf|rw2)$/i.test(it.name || '');
      // 已修标记：条目名与 done 表的源文件名匹配（联机导入的条目只有
      // 文件名，没有全路径——按 basename 匹配足够）。
      const doneHit = it.name && LIB.done && Object.keys(LIB.done)
        .some(p => p.split(/[\\/]/).pop() === it.name);
      return '<div class="shot' + (i === FILM.current ? ' active' : '') +
        (it.rejected ? ' rej' : '') + '" data-i="' + i + '" title="' +
        (it.name || '') + '">' +
        '<img src="' + it.src + '">' +
        (isRaw ? '<span class="raw">RAW</span>' : '') +
        (it.picked ? '<span class="pk">★</span>' : '') +
        (doneHit ? '<span class="done" style="position:absolute;' +
          'left:2px;top:2px;background:rgba(46,160,67,.92);color:#fff;' +
          'font-size:8px;padding:0 3px;border-radius:2px">✓</span>' : '') +
        '<span class="n">' + (i + 1) + '</span></div>';
    }).join('');
    strip.querySelectorAll('.shot').forEach(el => {
      const i = parseInt(el.dataset.i, 10);
      el.onclick = () => filmSelect(i);
      el.ondblclick = () => {
        FILM.items[i].picked = !FILM.items[i].picked;
        FILM.items[i].stars = FILM.items[i].picked
          ? Math.max(1, FILM.items[i].stars || 0) : 0;
        filmInit();
      };
      el.oncontextmenu = ev => {
        ev.preventDefault();
        FILM.items[i].rejected = !FILM.items[i].rejected;
        filmInit();
      };
    });
  }

  // 顶栏行为
  const bind = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  bind('fbAdd', () => $('btnOpen').click());
  bind('fbUnfilter', () => {
    // 三态循环：全部 -> 已选 -> 未选 -> 全部。参考软件这里是下拉，
    // 选项就是这三类；循环按钮省一次弹层，语义一致。
    FILM.filter = FILM.filter === 'all' ? 'pick' :
      FILM.filter === 'pick' ? 'unpicked' : 'all';
    const label = { all: '▾ 未筛选', pick: '▾ 已选',
                    unpicked: '▾ 未选' }[FILM.filter];
    const b = $('fbUnfilter');
    if (b) b.textContent = label;
    filmInit();
  });
  bind('fbPick', () => selectCat('挑图'));
  bind('fbSingle', () => { FILM.view = 'single'; filmCloseGrid(); filmInit(); });
  bind('fbGrid', () => {
    FILM.view = FILM.view === 'grid' ? 'single' : 'grid';
    filmInit();
    if (FILM.view === 'grid') renderFilmGrid(); else filmCloseGrid();
  });
  box.querySelectorAll('[data-star]').forEach(el => {
    el.onclick = () => {
      if (FILM.current < 0) return;
      const n = parseInt(el.dataset.star, 10);
      const it = FILM.items[FILM.current];
      it.stars = (it.stars === n) ? 0 : n;
      it.picked = it.stars > 0;
      filmInit();
    };
  });
  box.querySelectorAll('[data-sw]').forEach(el => {
    el.onclick = () => {
      if (FILM.current < 0) return;
      const it = FILM.items[FILM.current];
      it.swatch = (it.swatch === el.dataset.sw) ? null : el.dataset.sw;
      filmInit();
    };
  });
}

function unfilteredCount() {
  return FILM.items.filter(i => !i.picked).length;
}
function pickedCount() {
  return FILM.items.filter(i => i.picked).length;
}

function renderFilmGrid() {
  // 网格视图：在画布上铺开全部缩略图，点击切换当前帧
  const wrap = $('canvasWrap');
  if (FILM.view !== 'grid' || !FILM.items.length) return;
  let grid = $('filmGrid');
  if (!grid) {
    grid = document.createElement('div');
    grid.id = 'filmGrid';
    grid.style.cssText = 'position:absolute;inset:0;overflow:auto;' +
      'background:#060608;display:grid;grid-template-columns:' +
      'repeat(auto-fill,minmax(160px,1fr));gap:8px;padding:16px;z-index:14';
    wrap.appendChild(grid);
  }
  grid.style.display = 'grid';
  grid.innerHTML = FILM.items.map((it, i) =>
    '<div data-i="' + i + '" style="cursor:pointer;border:2px solid ' +
    (i === FILM.current ? 'var(--gold)' : 'transparent') + ';border-radius:6px;' +
    'overflow:hidden;position:relative">' +
    '<img src="' + it.src + '" style="width:100%;display:block;aspect-ratio:3/2;' +
    'object-fit:cover">' +
    (it.picked ? '<span style="position:absolute;top:4px;right:4px;' +
      'background:var(--gold);color:#141005;font-size:10px;padding:0 5px;' +
      'border-radius:3px">已选</span>' : '') +
    '<span style="position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);' +
    'color:var(--dim);font-size:10px;padding:0 4px;border-radius:3px">' +
    (i + 1) + '</span></div>').join('');
  grid.querySelectorAll('[data-i]').forEach(el => {
    el.onclick = () => filmSelect(parseInt(el.dataset.i, 10));
  });
}

function filmCloseGrid() {
  const g = $('filmGrid');
  if (g) g.style.display = 'none';
}

function filmSelect(i) {
  if (i < 0 || i >= FILM.items.length) return;
  FILM.current = i;
  const it = FILM.items[i];
  if (it.session) {
    fetch('/api/render', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: it.session, params: {}, quality: 88 }),
    }).then(r => r.json()).then(async j => {
      if (!j.image) return;
      S.session = it.session;
      S.base = 'data:image/jpeg;base64,' + j.image;
      if (j.faces) S.faces = j.faces;
      matteImg = null; eraseCanvas = null;
      await drawBase();
      await refreshHistory();
    }).catch(() => {});
  } else {
    S.base = it.src;
    loadImage(S.base).then(im => { S.img = im; layoutFaceBox(); });
  }
  [...$('film').children].forEach((t, k) =>
    t.classList.toggle('active', k === i));
  filmInit();
  filmCloseGrid();
}

function addThumb(src, name) {
  // 只有一个来源：FILM.items。之前还往一个独立的 #film 里插 <img>，
  // 两处都存状态，切换当前帧时两边会不同步。
  FILM.items.push({ src: src, name: name, session: S.session,
                    picked: false, stars: 0 });
  FILM.current = FILM.items.length - 1;
  filmInit();
  if (FILM.view === 'grid') renderFilmGrid();
}

// ---- 蛋糕式选片快捷键的实现（←/→、x 拒片、p 选片、Shift+1..5 星级）----
function filmStep(dir) {
  if (!FILM.items.length) return;
  FILM.current = Math.max(0, Math.min(FILM.items.length - 1,
                                      FILM.current + dir));
  filmSelect(FILM.current);
}

function filmToggleReject() {
  const it = FILM.items[FILM.current];
  if (!it) return;
  it.rejected = !it.rejected;
  if (it.rejected) it.picked = false;   // 拒片与选片互斥
  filmInit();
  if (FILM.view === 'grid') renderFilmGrid();
  log((it.rejected ? '拒片：' : '取消拒片：') + (it.name || ''));
}

function filmTogglePick() {
  const it = FILM.items[FILM.current];
  if (!it) return;
  it.picked = !it.picked;
  if (it.picked) it.rejected = false;
  it.stars = it.picked ? Math.max(1, it.stars || 1) : 0;
  filmInit();
  if (FILM.view === 'grid') renderFilmGrid();
  log((it.picked ? '选片：' : '取消选片：') + (it.name || ''));
}

function filmSetStars(n) {
  const it = FILM.items[FILM.current];
  if (!it) return;
  it.stars = n;
  if (n >= 1) { it.picked = true; it.rejected = false; }
  filmInit();
  if (FILM.view === 'grid') renderFilmGrid();
  log('星级 ' + n + '：' + (it.name || ''));
}

// ---- \ 按住看原图（松开恢复）：把画布临时画成历史第 0 步快照 ----
let beforeShowing = false;
function toggleBefore(on = true) {
  if (!S.session || !S.base) return;
  if (on === beforeShowing) return;
  beforeShowing = on;

    // 原图 = 历史第 0 步（上传帧）的 640px 快照（二进制 JPEG）

        if (!blob) return;
        const im = new Image();
        im.onload = () => {
          const ctx = $('canvas').getContext('2d');
          ctx.drawImage(im, 0, 0, $('canvas').width, $('canvas').height);
        };
        im.src = URL.createObjectURL(blob);
      }).catch(() => {});
  } else {
    drawBase();                              // 恢复当前状态
  }
}

let erasing = false, eraseDown = false, eraseCanvas = null;
function eraseToggle() {
  if (!S.session || !S.img) return;
  erasing = !erasing;
  $('btnErase').classList.toggle('active', erasing);
  $('btnErase').innerHTML = erasing
    ? '<span class="ico">✓</span>完成填充' : '<span class="ico">✦</span>消除';
  if (erasing) {
    eraseCanvas = document.createElement('canvas');
    eraseCanvas.width = S.img.naturalWidth;
    eraseCanvas.height = S.img.naturalHeight;
    eraseCanvas.getContext('2d').clearRect(0, 0, eraseCanvas.width, eraseCanvas.height);
    log('消除笔：拖动涂抹要消除的区域，再点一次完成');
  } else if (eraseCanvas) submitErase();
};
function eraseDraw(ev) {
  if (!erasing || !eraseCanvas) return;
  const c = $('canvas'), rect = c.getBoundingClientRect();
  const sx = eraseCanvas.width / rect.width;
  const sy = eraseCanvas.height / rect.height;
  const x = (ev.clientX - rect.left) * sx;
  const y = (ev.clientY - rect.top) * sy;
  const ctx = eraseCanvas.getContext('2d');
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(x, y, eraseCanvas.width * 0.03, 0, Math.PI * 2);
  ctx.fill();
  const ctx2 = c.getContext('2d');
  ctx2.drawImage(S.img, 0, 0);
  ctx2.save(); ctx2.globalAlpha = 0.45;
  ctx2.drawImage(eraseCanvas, 0, 0, c.width, c.height);
  ctx2.restore();
}
async function submitErase() {
  setBusy(true);
  try {
    const u8 = eraseCanvas.getContext('2d')
      .getImageData(0, 0, eraseCanvas.width, eraseCanvas.height);
    const m = document.createElement('canvas');
    m.width = u8.width; m.height = u8.height;
    const md = m.getContext('2d').createImageData(u8.width, u8.height);
    for (let i = 0; i < u8.data.length; i += 4) {
      const v = u8.data[i];
      md.data[i] = md.data[i+1] = md.data[i+2] = v;
      md.data[i+3] = 255;
    }
    m.getContext('2d').putImageData(md, 0, 0);
    const blob = await new Promise(res => m.toBlob(res, 'image/png'));
    const b64 = await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result.split(',')[1]);
      fr.readAsDataURL(blob);
    });
    // LaMa first: it is local, deterministic and finishes in a second or two,
    // and for the usual case (removing an object whose background continues) it
    // is also the correct model. The diffusion filler is the fallback when the
    // LaMa weights are absent, and the right choice when the user wants new
    // content rather than continued texture.
    let res = await fetch('/api/remove', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session: S.session, mask_png: b64,
                             engine: 'lama', commit: true })
    }).then(r => r.json());
    if (res.detail) {
      log('LaMa 不可用（' + res.detail + '），改用生成填充…');
      res = await fetch('/api/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: S.session, mask_png: b64,
                               engine: 'diffusion', commit: true })
      }).then(r => r.json());
    }
    if (res.detail) throw new Error(res.detail);
    S.base = 'data:image/jpeg;base64,' + res.image;
    matteImg = null; eraseCanvas = null;
    await drawBase();
    await refreshHistory();
    log('消除完成（' + res.info.engine + ' · ' + res.info.seconds + 's）');
  } catch (e) { log('消除失败：' + e.message); }
  finally {
    setBusy(false); eraseCanvas = null;
    $('btnErase').classList.remove('active');
    $('btnErase').innerHTML = '<span class="ico">✦</span>消除笔';
  }
}

// ============================================================
// 蒙版调整（按语义类别选择作用区）
// ============================================================
// 截图里那一栏的实质是：先选"作用在哪"，再给这一块调曝光/饱和/色温。
// 类别来自 6 类语义分割，所以"头发"是真的头发，不是靠颜色猜的。
const MASK = {
  selected: [],           // 类别 key 列表
  feather: 2.0,
  controls: {},           // 与全局同名，引擎侧复用同一套算子
  catalog: null,
  hist: null,
};

const MASK_LABELS = {
  subject: '主体', background: '背景', skin: '全部皮肤',
  'face-skin': '面部皮肤', 'body-skin': '身体皮肤', hair: '头发',
  clothes: '衣服', accessories: '配饰',
  // 面部子蒙版来自 face-parsing（19 类），与区域层是两套来源
  brows: '眉毛', eyes: '眼睛', lips: '嘴唇', mouth: '口腔',
  teeth: '牙齿', nose: '鼻子',
};

function renderMasked() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">蒙版调整 · 先选作用区，再调这一块</div>';

  // 直方图在参数区顶部常驻，这里不再重复画一份

  const chips = document.createElement('div');
  chips.className = 'presetRow';
  wrap.appendChild(chips);
  const hint = document.createElement('div');
  hint.className = 'bstat';
  hint.id = 'maskHint';
  wrap.appendChild(hint);
  const detail = document.createElement('div');
  detail.id = 'maskDetail';
  wrap.appendChild(detail);

  loadMaskCatalog().then(() => {
    const cov = MASK.catalog ? MASK.catalog.coverage : null;
    const subCov = MASK.catalog ? (MASK.catalog.submask_coverage || {}) : {};
    const subAvail = MASK.catalog && MASK.catalog.submasks &&
                     Object.keys(MASK.catalog.submasks).length > 0 &&
                     !subCov._error;

    // ---- 第一层：整区（主体/背景/皮肤/头发/衣服/配饰）-------------------
    const regionKeys = Object.keys(MASK_LABELS).filter(k => {
      if (!cov) return true;
      if (k === 'subject' || k === 'background')
        return cov.background !== undefined;
      if (k === 'skin') return (cov['face-skin'] || 0) + (cov['body-skin'] || 0) > 0;
      return (cov[k] || 0) > 0.0005;
    });
    chips.innerHTML =
      '<div class="groupTitle" style="margin-top:2px">区域</div>' +
      regionKeys.map(k => {
        const c = cov ? (k === 'subject'
          ? 1 - (cov.background || 0)
          : k === 'skin'
            ? (cov['face-skin'] || 0) + (cov['body-skin'] || 0)
            : cov[k]) : null;
        return '<button class="chip maskChip" data-k="' + k + '">' +
          MASK_LABELS[k] +
          (c != null ? ' <span style="color:var(--dim);font-size:10px">' +
            Math.round(c * 100) + '%</span>' : '') + '</button>';
      }).join('') +
      // ---- 第二层：面部子蒙版（眉毛/眼睛/嘴唇/口腔/牙齿/鼻子）------------
      (subAvail ? '<div class="groupTitle">面部子蒙版</div>' +
        Object.keys(MASK.catalog.submasks).map(k => {
          const c = subCov[k];
          return '<button class="chip maskChip" data-k="' + k + '">' +
            MASK.catalog.submasks[k] +
            (c != null ? ' <span style="color:var(--dim);font-size:10px">' +
              Math.round(c * 100) + '%</span>' : '') + '</button>';
        }).join('') : '') +
      '<div style="height:6px"></div>' +
      '<button class="chip" id="maskClear">清空</button>';
    chips.querySelectorAll('.maskChip').forEach(b => {
      b.classList.toggle('active', MASK.selected.includes(b.dataset.k));
      b.onclick = () => {
        const k = b.dataset.k;
        const i = MASK.selected.indexOf(k);
        if (i >= 0) MASK.selected.splice(i, 1); else MASK.selected.push(k);
        b.classList.toggle('active', i < 0);
        updateMaskHint();
        requestMaskPreview();
      };
    });
    $('maskClear').onclick = () => {
      MASK.selected = [];
      renderMasked();
    };
    updateMaskHint();
    renderMaskDetail();
  });

  loadHistogram();
}

async function loadMaskCatalog() {
  if (MASK.catalog || !S.session) return;
  try {
    MASK.catalog = await fetch('/api/masks/' + encodeURIComponent(S.session))
      .then(r => r.json());
  } catch (e) { MASK.catalog = null; }
}

let HIST_LOADING = null;

async function loadHistogram(force) {
  if (!S.session) return null;
  // 缓存键带上"画面版本号"，而不是只判断"有没有取过"。原来
  // `if (MASK.hist) return` 让直方图在整个会话里只算一次，编辑之后
  // 曲线/色阶面板和蒙版面板看到的都是旧数据。
  const key = S.histKey || 0;
  if (!force && MASK.hist && MASK.hist._key === key) return MASK.hist;
  // 并发去重：拖动滑杆时会连续触发，不该为同一个版本发多个请求
  if (HIST_LOADING && HIST_LOADING.key === key) return HIST_LOADING.p;
  const p = (async () => {
    try {
      const j = await fetch('/api/histogram/' +
                            encodeURIComponent(S.session)).then(r => r.json());
      // 请求期间画面又变了：这份数据已经过期，不要覆盖更新的那一份
      if ((S.histKey || 0) !== key) return MASK.hist;
      j._key = key;
      MASK.hist = j;
      LEV.hist = j;
      drawGlobalHist();
      drawLevels();
      drawCurve();
      return j;
    } catch (e) {
      return MASK.hist;
    } finally {
      HIST_LOADING = null;
    }
  })();
  HIST_LOADING = { key: key, p: p };
  return p;
}

// 任何改变画面的路径都要调这个：它只递增版本号，**不清空**已有的直方图。
// 早先这里直接 `MASK.hist = null`，而 drawBase() 在拖动滑杆时每秒被调用十几
// 次，于是刚取回来的直方图立刻被擦掉，面板长期显示为空——数据其实取到了，
// 又被另一条路径清走，表现出来就是"直方图不工作"。
function invalidateHistogram() {
  S.histKey = (S.histKey || 0) + 1;
}

// 唯一权威的直方图在参数区顶部（drawGlobalHist）。
// 早先这里还画一份 #maskHist，两套压缩算法各画各的，形状会不一致。
function drawHistogram() {
  drawGlobalHist();
}

function updateMaskHint() {
  const el = $('maskHint');
  if (!el) return;
  if (!MASK.selected.length) {
    el.textContent = '还没有选作用区。点上面的按钮选一个或多个类别。';
    return;
  }
  const cov = MASK.catalog && MASK.catalog.coverage;
  el.innerHTML = '作用区：<b style="color:var(--gold)">' +
    MASK.selected.map(k => MASK_LABELS[k] || k).join(' + ') + '</b>' +
    (cov ? '（<span style="color:var(--dim)">覆盖 ' +
      Math.round(MASK.selected.reduce((a, k) => a +
        (k === 'subject' ? 1 - (cov.background || 0)
         : k === 'skin' ? (cov['face-skin'] || 0) + (cov['body-skin'] || 0)
         : (cov[k] || 0)), 0) * 100) + '% 画面</span>）' : '');
}

function renderMaskDetail() {
  const d = $('maskDetail');
  if (!d) return;
  d.innerHTML =
    '<div class="sl"><div class="hdr"><span class="name">羽化</span>' +
    '<span class="val" id="mkFv">' + Math.round(MASK.feather * 10) / 10 +
    ' px</span></div><input type="range" id="mkF" min="0" max="20" ' +
    'step="0.5" value="' + MASK.feather + '"></div>' +
    '<div class="groupTitle">调整项（作用在选中的蒙版内）</div>' +
    LOCAL_CONTROLS.map(([k, label, lo, hi]) =>
      '<div class="sl"><div class="hdr"><span class="name">' + label +
      '</span><span class="val" id="mkv_' + k + '">' +
      (MASK.controls[k] || 0) + '</span></div>' +
      '<input type="range" id="mkr_' + k + '" min="' + lo + '" max="' + hi +
      '" step="1" value="' + (MASK.controls[k] || 0) + '"></div>').join('') +
    '<div class="presetRow"><button class="goldbtn" id="mkApply">应用到图片' +
    '</button><button class="chip" id="mkZero">全部归零</button></div>';

  $('mkF').oninput = () => {
    MASK.feather = parseFloat($('mkF').value);
    $('mkFv').textContent = MASK.feather + ' px';
    requestMaskPreview();
  };
  LOCAL_CONTROLS.forEach(([k]) => {
    const el = $('mkr_' + k);
    if (!el) return;
    el.oninput = () => {
      MASK.controls[k] = parseFloat(el.value);
      $('mkv_' + k).textContent = MASK.controls[k];
      requestMaskPreview();
    };
  });
  $('mkZero').onclick = () => { MASK.controls = {}; renderMaskDetail(); };
  $('mkApply').onclick = async () => {
    if (!MASK.selected.length) { log('先选作用区'); return; }
    setBusy(true);
    try {
      const r = await fetch('/api/masked', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: S.session, masks: MASK.selected,
                               controls: MASK.controls,
                               feather: MASK.feather, commit: true }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      S.base = 'data:image/jpeg;base64,' + j.image;
      matteImg = null;
      await drawBase();
      await refreshHistory();
      log('蒙版调整已应用：' + j.info.masks.join(' + ') +
          '（覆盖 ' + Math.round(j.info.coverage * 100) + '%）');
    } catch (e) { log('蒙版调整失败：' + e.message); }
    finally { setBusy(false); }
  };
}

let maskTimer = null;
function requestMaskPreview() {
  if (!S.session || !MASK.selected.length) return;
  clearTimeout(maskTimer);
  maskTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/masked', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session: S.session, masks: MASK.selected,
                               controls: MASK.controls,
                               feather: MASK.feather, commit: false }),
      });
      const j = await r.json();
      if (!r.ok) return;
      const im = await loadImage('data:image/jpeg;base64,' + j.image);
      const c = $('canvas');
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    } catch (e) { /* 预览失败不打断操作 */ }
  }, 160);
}

// ============================================================
// 局部调整（径向 / 线性蒙版）
// ============================================================
// 引擎侧一直支持 local_adjustments，UI 之前没暴露。几何用 0..1 比例存储，
// 这样换预览尺寸或导出全尺寸时同一个条目仍然对得上位置。
const LOCAL = { entries: [], sel: -1, dragging: false };

const LOCAL_CONTROLS = [
  ['exposure', '曝光', -100, 100],
  ['contrast', '对比', -100, 100],
  ['saturation', '饱和', -100, 100],
  ['clarity', '清晰度', -100, 100],
  ['temp', '色温', -100, 100],
  ['tint', '色调', -100, 100],
  ['dehaze', '祛雾', -100, 100],
];

function newEntry(type, cx, cy) {
  return {
    type: type, cx: cx, cy: cy,
    rx: type === 'radial' ? 0.22 : 0.0,
    ry: type === 'radial' ? 0.22 : 0.0,
    angle: 0, position: cy, feather: 0.5, invert: false, strength: 100,
    exposure: 0, contrast: 0, saturation: 0, clarity: 0,
    temp: 0, tint: 0, dehaze: 0,
  };
}

function renderLocal() {
  const wrap = $('sliders');
  wrap.innerHTML = '<div class="groupTitle">局部调整 · 在画面上点击添加蒙版</div>';

  const bar = document.createElement('div');
  bar.className = 'presetRow';
  bar.innerHTML = '<button class="chip" id="locRadial">＋ 径向</button>' +
    '<button class="chip" id="locLinear">＋ 线性</button>' +
    '<button class="chip" id="locClear">清空</button>';
  wrap.appendChild(bar);

  const list = document.createElement('div');
  list.id = 'localList';
  wrap.appendChild(list);

  const hint = document.createElement('div');
  hint.id = 'localHint';
  wrap.appendChild(hint);

  const detail = document.createElement('div');
  detail.id = 'localDetail';
  wrap.appendChild(detail);

  $('locRadial').onclick = () => addLocal('radial');
  $('locLinear').onclick = () => addLocal('linear');
  $('locClear').onclick = () => {
    LOCAL.entries = []; LOCAL.sel = -1;
    renderLocalList(); drawLocalOverlay(); requestRender();
  };
  renderLocalList();
  renderLocalDetail();
  drawLocalOverlay();
}

function addLocal(type, cx, cy) {
  if (cx === undefined) {
    cx = type === 'linear' ? 0.5 : 0.5;
    cy = type === 'linear' ? 0.35 : 0.45;
  }
  LOCAL.entries.push(newEntry(type, cx, cy));
  LOCAL.sel = LOCAL.entries.length - 1;
  // 默认先给一点可见效果，否则新建的蒙版看不出作用
  const e = LOCAL.entries[LOCAL.sel];
  if (type === 'radial') { e.exposure = 18; } else { e.temp = 12; }
  renderLocalList(); renderLocalDetail(); drawLocalOverlay();
  requestRender();
}

function renderLocalList() {
  const list = $('localList');
  if (!list) return;
  if (!LOCAL.entries.length) {
    list.innerHTML = '<div style="color:var(--dim);font-size:11px">' +
      '还没有蒙版。</div>';
    return;
  }
  list.innerHTML = LOCAL.entries.map((e, i) => {
    const t = e.type === 'radial'
      ? ('径向 ' + Math.round(e.rx * 100) + '%') : '线性';
    const v = LOCAL_CONTROLS.map(c => e[c[0]] ? c[1] + e[c[0]] : null)
      .filter(Boolean).join(' ');
    return '<div class="locItem' + (i === LOCAL.sel ? ' active' : '') +
      '" data-i="' + i + '"><span class="idx" style="color:var(--gold)">' +
      (i + 1) + '</span><span class="nm">' + t + ' ' +
      (e.invert ? '（外）' : '') + (v ? ' · ' + v : '') +
      '</span><span class="del" data-del="' + i + '">✕</span></div>';
  }).join('');
  list.querySelectorAll('.locItem').forEach(el => {
    el.onclick = ev => {
      if (ev.target.dataset.del !== undefined) {
        LOCAL.entries.splice(parseInt(ev.target.dataset.del, 10), 1);
        LOCAL.sel = Math.min(LOCAL.sel, LOCAL.entries.length - 1);
        renderLocalList(); renderLocalDetail(); drawLocalOverlay(); requestRender();
        return;
      }
      LOCAL.sel = parseInt(el.dataset.i, 10);
      renderLocalList(); renderLocalDetail(); drawLocalOverlay();
    };
  });
}

function renderLocalDetail() {
  const d = $('localDetail');
  const hint = $('localHint');
  if (!d) return;
  if (LOCAL.sel < 0 || !LOCAL.entries[LOCAL.sel]) {
    d.innerHTML = '';
    if (hint) hint.textContent = '在画面上点击可直接放置蒙版；拖动可移动。';
    return;
  }
  const e = LOCAL.entries[LOCAL.sel];
  if (hint) {
    hint.textContent = e.type === 'radial'
      ? '拖动画面上的圆移动它；半径/羽化用下面的滑杆。'
      : '拖动画面改变渐变位置；角度用下面的滑杆。';
  }
  const geoS = e.type === 'radial'
    ? [['rx', '半径X', 2, 80], ['ry', '半径Y', 2, 80], ['angle', '旋转', -180, 180]]
    : [['position', '位置', 0, 100], ['angle', '角度', -180, 180]];
  const geoHtml = geoS.map(([k, label, lo, hi]) => {
    const pct = (k === 'position') ? e[k] * 100
      : (k === 'angle') ? e[k] : e[k] * 100;
    return '<div class="sl"><div class="hdr"><span class="name">' + label +
      '</span><span class="val" id="lv_' + k + '">' +
      (k === 'angle' ? Math.round(pct) : Math.round(pct)) +
      (k === 'angle' ? '°' : '%') + '</span></div>' +
      '<input type="range" id="lr_' + k + '" min="' + lo + '" max="' + hi +
      '" step="' + (k === 'position' ? 0.5 : 1) + '" value="' + pct + '"></div>';
  }).join('');

  d.innerHTML =
    '<div class="groupTitle">几何</div>' + geoHtml +
    '<div class="sl"><div class="hdr"><span class="name">羽化</span>' +
    '<span class="val" id="lv_feather">' + Math.round(e.feather * 100) +
    '</span></div><input type="range" id="lr_feather" min="0" max="100" ' +
    'value="' + Math.round(e.feather * 100) + '"></div>' +
    '<div class="sl"><div class="hdr"><span class="name">强度</span>' +
    '<span class="val" id="lv_strength">' + Math.round(e.strength) +
    '</span></div><input type="range" id="lr_strength" min="0" max="100" ' +
    'value="' + Math.round(e.strength) + '"></div>' +
    '<div class="presetRow"><button class="chip" id="locInvert">' +
    (e.invert ? '✓ 作用于外部' : '作用于外部') + '</button></div>' +
    '<div class="groupTitle">调整项</div>' +
    LOCAL_CONTROLS.map(([k, label, lo, hi]) =>
      '<div class="sl"><div class="hdr"><span class="name">' + label +
      '</span><span class="val" id="lv_' + k + '">' + e[k] + '</span></div>' +
      '<input type="range" id="lr_' + k + '" min="' + lo + '" max="' + hi +
      '" step="1" value="' + e[k] +
      // 色温/色调用渐变轨道（截图同款），拖动方向一眼可读
      (k === 'temp' ? '" class="wb-temp' : k === 'tint' ? '" class="wb-tint' : '') +
      '"></div>').join('');

  const bind = (k, fn) => { const el = $('lr_' + k); if (el) el.oninput = fn; };
  geoS.forEach(([k]) => bind(k, () => {
    let v = parseFloat($('lr_' + k).value);
    if (k === 'position') e[k] = v / 100; else if (k === 'angle') e[k] = v;
    else e[k] = v / 100;
    $('lv_' + k).textContent = Math.round(v) + (k === 'angle' ? '°' : '%');
    drawLocalOverlay(); requestRender();
  }));
  bind('feather', () => {
    e.feather = parseFloat($('lr_feather').value) / 100;
    $('lv_feather').textContent = Math.round(e.feather * 100);
    drawLocalOverlay(); requestRender();
  });
  bind('strength', () => {
    e.strength = parseFloat($('lr_strength').value);
    $('lv_strength').textContent = Math.round(e.strength);
    requestRender();
  });
  LOCAL_CONTROLS.forEach(([k]) => bind(k, () => {
    e[k] = parseFloat($('lr_' + k).value);
    $('lv_' + k).textContent = e[k];
    renderLocalList(); requestRender();
  }));
  const inv = $('locInvert');
  if (inv) inv.onclick = () => {
    e.invert = !e.invert;
    renderLocalDetail(); drawLocalOverlay(); requestRender();
  };
}

// 画布上的蒙版示意：半透明椭圆/渐变指示，不参与渲染
function drawLocalOverlay() {
  let ov = $('localOverlay');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'localOverlay';
    ov.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:12';
    $('canvasWrap').appendChild(ov);
  }
  if (LOCAL.sel < 0 || !LOCAL.entries[LOCAL.sel] || !S.meta) {
    ov.innerHTML = ''; return;
  }
  const e = LOCAL.entries[LOCAL.sel];
  const c = $('canvas'), rect = c.getBoundingClientRect();
  const wrap = $('canvasWrap').getBoundingClientRect();
  const ox = rect.left - wrap.left, oy = rect.top - wrap.top;
  if (e.type === 'radial') {
    const rx = e.rx * rect.width, ry = e.ry * rect.height;
    ov.innerHTML = '<div style="position:absolute;left:' +
      (ox + e.cx * rect.width - rx) + 'px;top:' +
      (oy + e.cy * rect.height - ry) + 'px;width:' + (rx * 2) +
      'px;height:' + (ry * 2) + 'px;border:1.5px dashed var(--gold);' +
      'border-radius:50%;transform:rotate(' + e.angle + 'deg);' +
      'box-shadow:0 0 0 9999px rgba(0,0,0,0)"></div>';
  } else {
    ov.innerHTML = '<div style="position:absolute;left:' + ox +
      'px;top:' + (oy + e.position * rect.height) + 'px;width:' +
      rect.width + 'px;height:2px;background:var(--gold);' +
      'transform:rotate(' + e.angle + 'deg);transform-origin:center"></div>';
  }
}

// 拖动蒙版
function localDragStart(ev) {
  if (LOCAL.sel < 0 || !LOCAL.entries[LOCAL.sel]) return false;
  LOCAL.dragging = true;
  return true;
}
function localDragMove(ev) {
  if (!LOCAL.dragging || LOCAL.sel < 0) return;
  const c = $('canvas'), rect = c.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
  const y = Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height));
  const e = LOCAL.entries[LOCAL.sel];
  if (e.type === 'radial') { e.cx = x; e.cy = y; } else { e.position = y; }
  drawLocalOverlay();
}

function localParams() {
  return LOCAL.entries.map(e => {
    const o = { type: e.type, feather: e.feather, invert: e.invert,
                strength: e.strength, angle: e.angle };
    if (e.type === 'radial') {
      o.cx = e.cx; o.cy = e.cy; o.rx = e.rx; o.ry = e.ry;
    } else {
      o.position = e.position;
    }
    LOCAL_CONTROLS.forEach(([k]) => { if (e[k]) o[k] = e[k]; });
    return o;
  });
}

// ============================================================
// 修复画笔 / 仿制图章
// ============================================================
// 两把笔刷共用一个手势：heal 保留源的纹理、取目标的明暗；clone 精确复制。
const BRUSH = {
  mode: null, source: null, path: [], drawing: false,
  radius: 40, hardness: 0.65, opacity: 1.0, lowFreq: 0.5, haveSample: false,
};

function setBrush(mode) {
  const turningOff = BRUSH.mode === mode;
  BRUSH.mode = turningOff ? null : mode;
  if (turningOff) BRUSH.haveSample = false;
  BRUSH.path = []; BRUSH.drawing = false;
  erasing = false;
  $('btnErase').classList.remove('active');
  $('btnErase').innerHTML = '<span class="ico">✦</span>消除';
  $('btnHeal').classList.toggle('active', BRUSH.mode === 'heal');
  $('btnStamp').classList.toggle('active', BRUSH.mode === 'clone');
  $('canvas').style.cursor = BRUSH.mode ? 'crosshair' : '';
  // 左侧工具条的笔刷类按钮与真实模式同步（模式名是 'clone'，不是 'stamp'）
  if (typeof window.__syncLeftTools === 'function') window.__syncLeftTools();
  brushPanel();
}

function brushPanel() {
  let bar = $('brushBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'brushBar';
    bar.style.cssText = 'position:absolute;left:12px;bottom:12px;z-index:20;' +
      'background:rgba(10,10,12,.93);border:1px solid var(--line);' +
      'border-radius:8px;padding:7px 10px;font-size:11px;display:none;' +
      'color:var(--dim);gap:12px;align-items:center;flex-wrap:wrap';
    $('canvasWrap').appendChild(bar);
  }
  bar.style.display = BRUSH.mode ? 'flex' : 'none';
  if (!BRUSH.mode) return;
  bar.innerHTML =
    '<b style="color:var(--gold)">' +
    (BRUSH.mode === 'heal' ? '修复画笔' : '仿制图章') + '</b>' +
    '<span>' + (BRUSH.haveSample ? '拖动涂抹' : 'Alt+点击 / 右键 设取样点') + '</span>' +
    '<label>大小 <input type="range" id="brR" min="8" max="160" value="' +
    BRUSH.radius + '" style="width:80px;vertical-align:middle"></label>' +
    '<label>硬度 <input type="range" id="brH" min="0" max="100" value="' +
    Math.round(BRUSH.hardness * 100) + '" style="width:64px;vertical-align:middle"></label>' +
    '<label>不透明 <input type="range" id="brO" min="10" max="100" value="' +
    Math.round(BRUSH.opacity * 100) + '" style="width:64px;vertical-align:middle"></label>' +
    (BRUSH.mode === 'heal'
      ? '<label>纹理尺度 <input type="range" id="brL" min="10" max="120" value="' +
        Math.round(BRUSH.lowFreq * 100) + '" style="width:64px;vertical-align:middle"></label>'
      : '');
  const bind = (id, fn) => { const el = $(id); if (el) el.oninput = fn; };
  bind('brR', () => { BRUSH.radius = parseFloat($('brR').value); });
  bind('brH', () => { BRUSH.hardness = parseFloat($('brH').value) / 100; });
  bind('brO', () => { BRUSH.opacity = parseFloat($('brO').value) / 100; });
  bind('brL', () => { BRUSH.lowFreq = parseFloat($('brL').value) / 100; });
}

function canvasPos(ev) {
  const c = $('canvas'), rect = c.getBoundingClientRect();
  return [(ev.clientX - rect.left) * (c.width / rect.width),
          (ev.clientY - rect.top) * (c.height / rect.height)];
}

function brushSample(ev) {
  if (!BRUSH.mode || !S.img) return;
  BRUSH.source = canvasPos(ev);
  BRUSH.haveSample = true;
  brushPanel();
  log('取样点 ' + Math.round(BRUSH.source[0]) + ',' +
      Math.round(BRUSH.source[1]));
}

async function brushCommit() {
  if (!BRUSH.path.length || !BRUSH.source || !S.session || !BRUSH.mode) return;
  const mode = BRUSH.mode;
  const path = BRUSH.path.slice();
  BRUSH.path = [];
  setBusy(true);
  try {
    const r = await fetch('/api/brush', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session: S.session, mode: mode, points: path,
        source: BRUSH.source, radius: Math.round(BRUSH.radius),
        hardness: BRUSH.hardness, opacity: BRUSH.opacity,
        low_freq: BRUSH.lowFreq, commit: true,
      }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    S.base = 'data:image/jpeg;base64,' + j.image;
    matteImg = null; eraseCanvas = null;
    await drawBase();
    await refreshHistory();
    log((mode === 'heal' ? '修复' : '图章') + '笔画已应用');
  } catch (e) { log('笔刷失败：' + e.message); }
  finally { setBusy(false); }
}

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key.toLowerCase();
  const press = (id) => {
    const b = document.getElementById(id);
    if (b && !b.disabled) { b.click(); return true; }
    return false;
  };
  // ---- Ctrl 组合（PS 同款）----
  if (mod) {
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); return; }
    if ((k === 'z' && e.shiftKey) || k === 'y') {
      e.preventDefault(); doRedo(); return;
    }
    if (k === '0') { e.preventDefault(); press('btnZoomFit'); return; }
    if (k === 'o') { e.preventDefault(); press('btnOpen'); return; }
    if (k === 'e') { e.preventDefault(); press('btnExport'); return; }
    if (k === 'j') { e.preventDefault(); press('btnAuto'); return; }
    if (k === 'd') { e.preventDefault(); press('ltZoom'); return; } // 取消工具
    return;
  }
  // ---- 单键（PS 工具切换的肌肉记忆）----
  // 输入框聚焦时不抢键
  const tag = (document.activeElement || {}).tagName || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  switch (k) {
    case 'v': press('ltZoom'); break;                   // 默认（缩放）
    case 'b': press('ltSpot'); break;                   // 画笔（污点修复）
    case 's': press('ltStamp'); break;                  // 仿制图章
    case 'e': press('ltErase'); break;                  // 橡皮擦（祛边）
    case 'c': selectCat('裁剪'); break;                  // 裁剪
    case 'w': selectCat('自动蒙版'); break;               // 快速蒙版
    case 'h': press('ltPan'); break;                     // 抓手
    case 'i': press('btnPicker'); break;                 // 吸管（灰点）
    case 'j': press('ltPatch'); break;                   // 修补
    case 'g': selectCat('滤镜'); break;                   // 渐变映射/滤镜
    case 'm': selectCat('局部'); break;                   // 选框
    case '[': {
      const el = document.querySelector('.brushSize input');
      if (el) { el.value = Math.max(2, +el.value - 4);
        el.dispatchEvent(new Event('input')); }
      break;
    }
    case ']': {
      const el = document.querySelector('.brushSize input');
      if (el) { el.value = Math.min(400, +el.value + 4);
        el.dispatchEvent(new Event('input')); }
      break;
    }
    case 'f': press('ltFit'); break;                     // 缩放循环
    // ---- 选片/对比（像素蛋糕式工作流）----
    case 'arrowleft': filmStep(-1); break;               // 上一张
    case 'arrowright': filmStep(1); break;                // 下一张
    case 'x': filmToggleReject(); break;                  // 拒片
    case 'p': filmTogglePick(); break;                    // 选片
    case '\\': toggleBefore(); break;                     // 按住看原图
    default: return;
  }
});

$('canvas').addEventListener('mousedown', ev => {
  if (BRUSH.mode) {

    if (ev.altKey || ev.button === 2) { brushSample(ev); return; }
    if (!BRUSH.haveSample) { log('先设取样点：Alt+点击 或 右键'); return; }
    ev.preventDefault();
    BRUSH.drawing = true;
    BRUSH.path = [canvasPos(ev)];
    return;
  }
  if (erasing) { eraseDraw(ev); eraseDown = true; return; }
  // local panel open with a selection: drag the mask
  if (LOCAL.sel >= 0 && LOCAL.entries[LOCAL.sel] && !picking) {
    if (localDragStart(ev)) { ev.preventDefault(); localDragMove(ev); }
  }
});

    if (!BRUSH.drawing) return;

(function () {
  const head = $('sideHead'), side = $('side');
  // Overlays are positioned in pixels from a measured rect, so anything that
  // moves the canvas has to re-measure them. Opening the drawer shifts the
  // photo up by its height; without this the face box stayed where the photo
  // used to be and floated in the black area below it.
  const sync = () => {
    const open = side.classList.contains('open');
    document.body.classList.toggle('drawer-open', open);
    layoutFaceBox();
    drawLocalOverlay();
    // the drawer animates for 220ms, and the final layout is what matters
    setTimeout(() => { layoutFaceBox(); drawLocalOverlay(); }, 260);
  };
  head.addEventListener('click', () => {
    if (window.innerWidth > 860) return;
    side.classList.toggle('open');
    sync();
  });
  window.closeDrawer = () => { side.classList.remove('open'); sync(); };
  window.openDrawer = () => { side.classList.add('open'); sync(); };
})();

// ============================================================
// 关于 / 帮助 / 诊断（版本检查 + 崩溃上报的本地出口）
// ============================================================
// 设计约束：所有网络检查都允许失败。更新检查指向 GitHub Releases，
// 仓库未公开或离线时静默降级为"检查不可用"，绝不能弹错误打断修图。
const ABOUT = {
  version: null, update: null, diag: null, errors: null,

  async load() {
    const jobs = [
      fetch('/api/version').then(r => r.json())
        .then(d => { ABOUT.version = d; ABOUT.checkUpdate(d); })
        .catch(() => {}),
      fetch('/api/diagnose').then(r => r.json())
        .then(d => { ABOUT.diag = d; }).catch(() => {}),
      fetch('/api/errors?limit=5').then(r => r.json())
        .then(d => { ABOUT.errors = d; }).catch(() => {}),
    ];
    await Promise.all(jobs);
  },

  // 语义化版本比较：只看数字段，忽略预发布后缀
  newer(remote, local) {
    const a = String(remote || '').split('.').map(Number);
    const b = String(local || '').split('.').map(Number);
    for (let i = 0; i < 3; i++) {
      if ((a[i] || 0) > (b[i] || 0)) return true;
      if ((a[i] || 0) < (b[i] || 0)) return false;
    }
    return false;
  },

  checkUpdate(ver) {
    if (!ver || !ver.update_url) return;
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 4000);
    fetch(ver.update_url, { signal: ctl.signal })
      .then(r => r.ok ? r.json() : null)
      .then(rel => {
        clearTimeout(timer);
        if (rel && rel.tag_name && ABOUT.newer(rel.tag_name.replace(/^v/, ''), ver.version)) {
          ABOUT.update = { latest: rel.tag_name, url: rel.html_url };
          const el = $('btnAbout');
          if (el) el.title = '有新版本 ' + rel.tag_name + ' · 点开查看';
        } else {
          ABOUT.update = { latest: null };
        }
      })
      .catch(() => { ABOUT.update = { latest: null, offline: true }; });
  },

  // 一键诊断报告：用户反馈问题时复制给维护者，不用翻安装目录
  reportText() {
    const L = [];
    const v = ABOUT.version || {};
    L.push('RetouchLab 诊断报告  ' + new Date().toLocaleString());
    L.push('版本: ' + (v.version || '?') + ' (build ' + (v.build || '?') + ')');
    const d = ABOUT.diag || {};
    if (Object.keys(d).length) {
      L.push('运行形态: ' + (d.frozen ? '打包版' : '源码') +
        '  Python ' + (d.python || '?'));
      L.push('torch: ' + (d.torch || d.torch_error || '未安装'));
      if (d.gpu_works === true) {
        L.push('GPU: ' + (d.gpu || '?') + '  matmul ' +
          d.gpu_matmul_ms + 'ms  CUDA ' + (d.cuda_version || '?'));
      } else {
        L.push('GPU: 不可用 (' + (d.gpu_error || d.torch_error ||
          'cuda_available=' + d.cuda_available) + ')');
      }
      if (d.models) L.push('模型: ' + JSON.stringify(d.models));
    }
    const errs = (ABOUT.errors || {}).errors || [];
    L.push('最近错误: ' + (errs.length ? errs.length + ' 条' : '无'));
    errs.slice(0, 5).forEach(e => {
      L.push('  [' + e.time + ' ' + e.request + '] ' + (e.exception || '')
        .slice(0, 160));
    });
    L.push('—— 报告完 ——');
    return L.join('\n');
  },

  async show() {
    if ($('aboutOv')) return;
    ABOUT.load();   // 并行拉取，下面每 300ms 刷新一次展示
    const ov = document.createElement('div');
    ov.id = 'aboutOv';
    const card = document.createElement('div');
    card.id = 'aboutCard';
    ov.appendChild(card);
    ov.addEventListener('pointerdown', e => {
      if (e.target === ov) ABOUT.close();
    });
    document.body.appendChild(ov);

    const render = () => {
      const v = ABOUT.version || {};
      const u = ABOUT.update;
      const upd = !v.version ? '' :
        (u === null ? '<div class="kv"><span>更新</span><b>检查中…</b></div>' :
         u.latest ? '<div class="kv"><span>更新</span><b><span class="updateDot"></span>有新版本 '
           + u.latest + ' — <a href="' + u.url + '" target="_blank" style="color:var(--gold)">下载</a></b></div>' :
         '<div class="kv"><span>更新</span><b class="ok">' +
           (u.offline ? '检查不可用（离线或仓库未公开）' : '已是最新') + '</b></div>');
      const d = ABOUT.diag || {};
      const gpu = d.gpu_works === true
        ? '<b class="ok">正常</b> ' + (d.gpu || '') + ' · matmul ' +

        '<h3>最近错误' + (errs.length ? '（' + errs.length + '）' : '') + '</h3>' +
        (errs.length
          ? errs.map(e => '<div class="err">[' + e.time + ' ' + e.request +
              '] ' + (e.exception || '').slice(0, 200) + '</div>').join('')
          : '<div class="kv"><span style="grid-column:1/3">无记录</span></div>') +
        '<div class="btns">' +
          '<button id="abCopy">复制诊断报告</button>' +
          '<button id="abOk" class="primary">关闭</button>' +
        '</div>';
      $('abOk').onclick = () => ABOUT.close();
      $('abCopy').onclick = async () => {
        const text = ABOUT.reportText();
        try {
          await navigator.clipboard.writeText(text);
          $('abCopy').textContent = '已复制 ✓';
        } catch (e) {
          // http 非 localhost 时 clipboard API 不可用，退回老办法
          const ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta);
          ta.select(); document.execCommand('copy'); ta.remove();
          $('abCopy').textContent = '已复制 ✓';
        }
        setTimeout(() => { const b = $('abCopy');
          if (b) b.textContent = '复制诊断报告'; }, 1600);
      };
    };
    render();
    ABOUT._timer = setInterval(() => {
      if (!$('aboutOv')) { clearInterval(ABOUT._timer); return; }
      render();
      if (ABOUT.version && ABOUT.update && ABOUT.diag && ABOUT.errors) {
        clearInterval(ABOUT._timer);   // 数据齐了，停掉轮询
      }
    }, 300);
  },

  close() {
    const ov = $('aboutOv');
    if (ov) ov.remove();
    if (ABOUT._timer) { clearInterval(ABOUT._timer); ABOUT._timer = null; }
  },
};
$('btnAbout').onclick = () => ABOUT.show();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') ABOUT.close();
});

// ============================================================
// 首次启动引导：新用户打开是空界面，不知道从哪下手。
// 左下角引导卡只出现一次（localStorage），任何点击都会收起，
// 不遮挡画布中心与右侧参数区，不干扰自动化测试。
// ============================================================
function showWelcomeOnce() {
  try {
    if (localStorage.getItem('rl_onboarded')) return;
    if (location.search.indexOf('nohelp') >= 0) return;
  } catch (e) { return; }
  // 防重复：页面载入建过一张后（未交互、未置 flag 期间）再次调用
  // 会出现两张同 id 卡，点「开始使用」只收掉一张，剩一张赖在角落。
  const old = document.getElementById('welcome');
  if (old) old.remove();
  const w = document.createElement('div');
  w.id = 'welcome';
  w.innerHTML =
    '<h2>欢迎使用 RetouchLab</h2>' +
    '<ol>' +
      '<li><b>导入照片</b> — 拖进窗口或点「打开」</li>' +
      '<li><b>右侧滑杆</b>调光影色彩</li>' +
      '<li><b>人像分类</b>里磨皮 / 液化 / 牙齿</li>' +
      '<li><b>导出</b>成品，或去图库批量处理</li>' +
    '</ol>' +
    '<button class="go">开始使用</button>' +
    '<div class="tip">点任何地方都会收起 · 之后可在「?」里再看</div>';
  document.body.appendChild(w);
  const dismiss = () => {
    try { localStorage.setItem('rl_onboarded', '1'); } catch (e) {}
    const el = $('welcome');
    if (el) el.remove();
    document.removeEventListener('pointerdown', dismiss, true);
  };
  w.querySelector('.go').addEventListener('click', dismiss);
  // 捕获阶段的全局 pointerdown：用户点别处也视为"知道了"
  setTimeout(() => {
    document.addEventListener('pointerdown', dismiss, true);
  }, 50);
}

init().catch(e => log('初始化失败：' + e.message));
</script>
</body>
</html>
